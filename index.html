/* ------------------------- THE SPONSOR YEAR --------------------------------
   The club's sponsor year is NOT the calendar year: it runs Aug 1 → Jul 31,
   so it starts fresh right after the picnic. Everything below is derived from
   the date alone — no stored "current year", no button to press, nothing to
   re-upload. At one minute past midnight on Aug 1 the board is simply reading
   a different year, and every member is back to owing their sponsor.         */
function sponsorYearOf(ts){
  const d=new Date(ts);
  // Aug (month 7) through Dec belong to the NEXT year's sponsor season.
  return d.getMonth()>=7 ? d.getFullYear()+1 : d.getFullYear();
}
function currentSponsorYear(){ return sponsorYearOf(Date.now()); }
function sponsorYearLabel(y){ return 'Aug 1 '+(y-1)+' → Jul 31 '+y; }
function sponsorYearStart(y){ return new Date(y-1,7,1); }
function sponsorYearEnd(y){ return new Date(y,6,31); }
// null = "whatever year it is today", which is what makes the rollover automatic.
let sponsorYr=null;
function sponsorYrShown(){ return sponsorYr||currentSponsorYear(); }
// Which sponsor years do we have anything to show for? Always include this one
// and the one that starts next, so the board exists before the first donation.
function sponsorYears(){
  const cur=currentSponsorYear();
  const ys=Object.values((S.finance||{}).txns||{})
    .filter(t=>t.kind==='income'&&t.cat==='Donations'&&t.member)
    .map(t=>sponsorYearOf(t.ts));
  return [...new Set(ys.concat([cur,cur+1]))].sort();
}
// Donations credited to each member, for one sponsor year. Reads the RAW txns,
// not the calendar-year-filtered list the rest of the books uses.
function sponsorSecured(y){
  const out={};
  Object.values((S.finance||{}).txns||{})
    .filter(t=>t.kind==='income'&&t.cat==='Donations'&&t.member&&sponsorYearOf(t.ts)===y)
    .forEach(t=>{ out[t.member]=(out[t.member]||0)+t.amount; });
  return out;
}
/* The app says the rule out loud, on its own, in both the admin books and the
   member's own Club tab. In the last weeks of a season it counts down; in the
   first weeks of a new one it explains why everybody is back at zero.        */
function sponsorNoticeHTML(target,shownArg){
  const now=new Date(), y=currentSponsorYear(), shown=shownArg||sponsorYrShown();
  const day=86400000;
  const start=sponsorYearStart(y), next=sponsorYearStart(y+1);
  const inDays=Math.floor((now-start)/day), toGo=Math.ceil((next-now)/day);
  const rule=`Every member secures a ${fmt(target)} sponsor — or self-sponsors — once per <b>sponsor year</b>,
    and the sponsor year runs <b>Aug 1 to Jul 31</b>, so it turns over right after the picnic.
    The board clears itself on Aug 1 automatically: nobody resets anything and no new file is needed.`;
  if(shown!==y) return `<div class="card"><b>📚 You are looking at a past sponsor year — ${sponsorYearLabel(shown)}</b>
    <p class="muted">${rule} The live season is ${sponsorYearLabel(y)}.</p></div>`;
  if(toGo<=45) return `<div class="card" style="border-color:var(--gold)">
    <b>⏳ ${toGo} day${toGo===1?'':'s'} left in the ${shown} sponsor year — it ends Jul 31 ${shown}</b>
    <p class="muted">${rule} On <b>Aug 1 ${shown}</b> this board starts over at zero for ${sponsorYearLabel(shown+1)},
      by itself. Anything still showing as owed below is owed for <i>this</i> season, so now is the time.</p></div>`;
  if(inDays<=45) return `<div class="card" style="border-color:var(--gold)">
    <b>🆕 A new sponsor year began on ${start.toLocaleDateString('en-CA',{month:'long',day:'numeric',year:'numeric'})}</b>
    <p class="muted">${rule} That is why everyone is back to ${fmt(target)} to go for ${sponsorYearLabel(shown)} —
      last season closed on Jul 31 and its board is still there under the year buttons.</p></div>`;
  return `<p class="muted">${rule}</p>`;
}

/* ------------------- WHO IS A MEMBER, WHO IS JUST STAFF --------------------
   The point-of-sale person runs the till on the day. They are not a member of
   the club: no sponsor to secure and no meeting attendance to keep. A roster
   row can say so outright (staff true or false); if it says nothing, we look
   the name up in the user list and treat the 'retail' role as staff.         */
function roleOfName(name){
  const n=(name||'').trim().toLowerCase();
  const u=Object.values(S.users||{}).find(x=>(x.name||'').trim().toLowerCase()===n);
  return u? (u.role||'seller') : null;
}
function isStaffRow(r){
  if(r && typeof r.staff==='boolean') return r.staff;
  return roleOfName(r&&r.name)==='retail';
}
function isStaffName(name){
  const n=(name||'').trim().toLowerCase();
  const r=attRoster().find(x=>(x.name||'').trim().toLowerCase()===n);
  if(r && typeof r.staff==='boolean') return r.staff;
  return roleOfName(name)==='retail';
}

function finCalc(y){
  const F=S.finance, op=F.opening;
  if(y<op.year){ const h=(F.history||{})[String(y)];
    return h? {hist:true, income:h.income, expenses:h.expenses, balance:h.balance, note:h.note||''} : null; }
  const prev = y===op.year ? op.amount : (finCalc(y-1)||{}).balance||0;
  const salesAuto=Object.values(S.sales||{}).filter(s=>!s.voided&&new Date(s.ts).getFullYear()===y)
    .reduce((a,s)=>a+s.total,0);
  const tx=Object.entries(F.txns||{}).map(([id,t])=>({id,...t}))
    .filter(t=>new Date(t.ts).getFullYear()===y).sort((a,b)=>b.ts-a.ts);
  const incCash=tx.filter(t=>t.kind==='income'&&!t.inkind).reduce((a,t)=>a+t.amount,0);
  const inkind=tx.filter(t=>t.kind==='income'&&t.inkind).reduce((a,t)=>a+t.amount,0);
  const expenses=tx.filter(t=>t.kind==='expense').reduce((a,t)=>a+t.amount,0);
  // Cash handed in for something the club did off the app (card game, hall rental).
  // It is logged once, on the Money screen, and flows in here so the balance is right —
  // there is no second entry to make and nothing to keep in step by hand.
  const miscAuto=Object.entries(S.payments||{}).map(([,p])=>p)
    .filter(p=>p.kind==='misc'&&new Date(p.ts).getFullYear()===y)
    .reduce((a,p)=>a+(p.amount||0),0);
  const totalIn=prev+salesAuto+incCash+miscAuto;
  return {prev, salesAuto, incCash, inkind, expenses, tx, miscAuto,
    totalIn, balance:Math.round((totalIn-expenses)*100)/100,
    pctSpent: totalIn>0? expenses/totalIn : 0};
}

/* ======================= BOOKS DRILL-DOWN ==================================
   Every line in the Total income and Total expenses tables can be tapped to
   see exactly what that number is made of — every entry, who it came from or
   went to, the date, the note, and a subtotal that has to match the row you
   tapped. Tapping the ✎ on an entry takes you straight into editing it.
   ------------------------------------------------------------------------- */
const _dDate=ts=>new Date(ts).toLocaleDateString('en-CA');
function _drillTitle(t,sub,total,cls){
  return `<h3><button class="x" onclick="closeModal()">✕</button>${esc(t)}</h3>
    <div class="stat ${cls||'gold'}" style="margin:0 0 4px">
      <div class="v">${fmt(total)}</div><div class="l">${esc(t)} — ${finYear}</div></div>
    ${sub?`<p class="muted" style="margin:6px 0 10px">${sub}</p>`:'<div style="height:8px"></div>'}`;
}
// One transaction, rendered as a row of the breakdown table.
function _drillTxRows(list){
  return list.slice().sort((a,b)=>a.ts-b.ts).map(t=>`<tr>
    <td style="white-space:nowrap;vertical-align:top">${_dDate(t.ts)}</td>
    <td>${t.sponsor?`<b>${esc(t.sponsor)}</b>`:`<span class="muted">${esc(t.cat||'—')}</span>`}
      ${t.inkind?' <span class="memberflag">IN-KIND</span>':''}
      ${t.invoice?' <span class="muted">📎</span>':''}
      ${(t.member||t.note)?`<div class="muted">${t.member?(t.kind==='income'?'secured by ':'paid / reimbursed to ')+esc(t.member):''}${t.member&&t.note?' · ':''}${t.note?esc(t.note):''}</div>`:''}
      <div class="noprint" style="margin-top:3px"><button class="btn small gray"
        onclick="closeModal();finEntryModal('${t.id}')">✎ edit this entry</button></div></td>
    <td class="r ${t.inkind?'goldtxt':(t.kind==='income'?'pos':'neg')}" style="vertical-align:top;white-space:nowrap">
      <b>${fmt(t.amount)}</b></td></tr>`).join('');
}
function _drillTxTable(list,label){
  if(!list.length) return `<div class="empty">No entries under this for ${finYear}.</div>`;
  const sub=list.reduce((a,t)=>a+t.amount,0);
  return `<div class="card"><table>
    <tr><th>Date</th><th>Who / what</th><th class="r">Amount</th></tr>
    ${_drillTxRows(list)}
    <tr class="drilltot"><td colspan="2">${esc(label||'Subtotal')} — ${list.length} entr${list.length===1?'y':'ies'}</td>
      <td class="r">${fmt(sub)}</td></tr></table></div>`;
}
// A simple two-column "these add up to that" table.
function _drillSum(rows,totLabel,tot,note){
  return `<div class="card"><table>
    ${rows.map(r=>`<tr><td>${r[2]?`<span class="muted">${esc(r[0])}</span>`:esc(r[0])}</td>
      <td class="r ${r[2]?'muted':''}">${fmt(r[1])}</td></tr>`).join('')}
    <tr class="drilltot"><td>${esc(totLabel)}</td><td class="r">${fmt(tot)}</td></tr></table></div>
    ${note?`<p class="muted">${note}</p>`:''}`;
}
function finDrill(kind,cat){
  const c=finCalc(finYear); if(!c||c.hist) return;
  const F=S.finance, tx=c.tx;

  /* ---- one income / expense category ---- */
  if(kind==='income'||kind==='expense'){
    const cash=tx.filter(t=>t.kind===kind&&t.cat===cat&&!t.inkind);
    const ink =tx.filter(t=>t.kind===kind&&t.cat===cat&&t.inkind);
    const sub=cash.reduce((a,t)=>a+t.amount,0);
    let extra='';
    if(ink.length) extra=`<h2>Also recorded here — but NOT in that total</h2>
      <p class="muted">In-kind means somebody gave an item rather than money. The value counts toward their
      sponsor quota but it is never added to the club's cash, so it is left out of the ${fmt(sub)} above.</p>
      ${_drillTxTable(ink,'In-kind value')}`;
    // who secured / who was paid
    const by={}; cash.forEach(t=>{ const k=t.member||'(nobody recorded)'; by[k]=(by[k]||0)+t.amount; });
    const byRows=Object.entries(by).sort((a,b)=>b[1]-a[1]);
    const byBlock=(byRows.length>1||(byRows.length===1&&byRows[0][0]!=='(nobody recorded)'))
      ? `<h2>${kind==='income'?'Secured by':'Paid / reimbursed to'}</h2>
         ${_drillSum(byRows.map(r=>[r[0],r[1]]),'Total',sub)}` : '';
    return openModal(_drillTitle(cat, kind==='income'
        ? 'Every '+finYear+' income entry filed under this category.'
        : 'Every '+finYear+' expense filed under this category.',
      sub, kind==='income'?'green':'red')
      + _drillTxTable(cash,'Category total') + byBlock + extra);
  }

  /* ---- the live app-sales figure ---- */
  if(kind==='sales'){
    const sales=Object.entries(S.sales||{}).map(([id,s])=>({id,...s}))
      .filter(s=>!s.voided&&new Date(s.ts).getFullYear()===finYear);
    const g=groupRollup(sales);
    const grpRows=SALE_GROUPS.filter(k=>g[k]).map(k=>[GRP_LABEL[k]||k, g[k].rev]);
    const byMonth={}; const byPay={}; const bySeller={};
    sales.forEach(s=>{
      const m=new Date(s.ts).getMonth(); byMonth[m]=(byMonth[m]||0)+s.total;
      const p=isTabSale(s)?'⏳ Pay Later (on a buyer’s tab)':isDirectSale(s)?'💳 Interac / Square':'💵 Cash';
      byPay[p]=(byPay[p]||0)+s.total;
      const n=s.sellerName||'—'; bySeller[n]=(bySeller[n]||0)+s.total;
    });
    const units=sales.reduce((a,s)=>a+saleUnits(s),0);
    const voided=Object.values(S.sales||{}).filter(s=>s.voided&&new Date(s.ts).getFullYear()===finYear);
    return openModal(_drillTitle('Picnic + Apparel Sales',
      `Added up live from the app — ${sales.length} sale${sales.length===1?'':'s'}, ${units} item${units===1?'':'s'} rung up in ${finYear}. Nothing here is typed in by hand.`,
      c.salesAuto,'green')
      + `<h2>By what was sold</h2>${_drillSum(grpRows,'Total sales',c.salesAuto)}`
      + `<h2>By month</h2>${_drillSum(Object.keys(byMonth).map(Number).sort((a,b)=>a-b)
          .map(m=>[MONTHS[m]+' '+finYear, byMonth[m]]),'Total sales',c.salesAuto)}`
      + `<h2>By how it was paid</h2>${_drillSum(Object.entries(byPay).map(r=>[r[0],r[1]]),'Total sales',c.salesAuto,
          'The books count a sale the moment it is rung up, however it was paid. Pay-later money is still sitting on a buyer’s tab and cash may still be in a seller’s pocket — the Money screen tracks who owes what.')}`
      + `<h2>By who rang it up</h2>${_drillSum(Object.entries(bySeller).sort((a,b)=>b[1]-a[1]).map(r=>[r[0],r[1]]),'Total sales',c.salesAuto)}`
      + (voided.length?`<p class="muted">${voided.length} voided sale${voided.length===1?'':'s'} in ${finYear} — voided sales are not counted anywhere above.</p>`:''));
  }

  /* ---- previous balance carried in ---- */
  if(kind==='prev'){
    const py=finYear-1, p=finCalc(py);
    let body;
    if(finYear===F.opening.year || !p){
      body=`<div class="card"><p>This is the club's opening balance — the figure the books were started
        from for ${F.opening.year}. It was not calculated from anything inside the app; it is the balance
        that was carried over from the old Excel sheet.</p></div>`;
    } else if(p.hist){
      body=_drillSum([['Income recorded for '+py,p.income],['Expenses recorded for '+py,-p.expenses]],
        py+' year-end balance → carried into '+finYear, p.balance,
        'Archived year from the old Excel workbook — the app holds the summary, and the workbook holds the line detail.');
    } else {
      body=_drillSum([
        ['Carried into '+py, p.prev],
        ['Picnic + Apparel Sales in '+py, p.salesAuto],
        ['Other income recorded in '+py, p.incCash],
        ['Less: expenses in '+py, -p.expenses],
      ], py+' year-end balance → carried into '+finYear, p.balance,
        'Tap the '+py+' button at the top of the Books screen to see that year in full.');
    }
    return openModal(_drillTitle('Previous Balance (carried from '+(finYear-1)+')',
      'What the club had in hand when '+finYear+' started.', c.prev,'gold') + body);
  }

  /* ---- the two grand totals ---- */
  if(kind==='totalin'){
    const cats=[...new Set(tx.filter(t=>t.kind==='income'&&!t.inkind).map(t=>t.cat))];
    const rows=[['Previous Balance (carried from '+(finYear-1)+')',c.prev],
                ['Picnic + Apparel Sales — live from this app',c.salesAuto]]
      .concat(c.miscAuto>0.005?[['Miscellaneous cash in — from the Money screen',c.miscAuto]]:[])
      .concat(cats.map(x=>[x, tx.filter(t=>t.kind==='income'&&t.cat===x&&!t.inkind).reduce((a,t)=>a+t.amount,0)]));
    if(c.inkind>0.005) rows.push(['In-kind donations — tracked, deliberately NOT added in',c.inkind,true]);
    return openModal(_drillTitle('TOTAL INCOME',
      'Everything the club has had available in '+finYear+', including what was carried in.', c.totalIn,'green')
      + _drillSum(rows,'TOTAL INCOME',c.totalIn,
        'Tap any single line back in the Books screen to see the individual entries behind it.'));
  }
  if(kind==='misc'){
    const mp=Object.entries(S.payments||{}).map(([id,p])=>({id,...p}))
      .filter(p=>p.kind==='misc'&&new Date(p.ts).getFullYear()===finYear).sort((a,b)=>a.ts-b.ts);
    return openModal(_drillTitle('Miscellaneous cash in',
      'Cash handed to the club in '+finYear+' for something that never went through the till. '
      +'These are logged on the <b>Money</b> screen with ＋ Record money received by club, and flow in here on their own.',
      c.miscAuto,'green')
      + `<div class="card"><table>
          <tr><th>Date</th><th>What it was for</th><th class="r">Amount</th></tr>
          ${mp.map(p=>`<tr>
            <td style="white-space:nowrap;vertical-align:top">${_dDate(p.ts)}</td>
            <td><b>${esc(p.note||'—')}</b>
              <div class="muted">handed in by ${esc(p.from||'—')}${p.by?' · recorded by '+esc(p.by):''}</div></td>
            <td class="r pos" style="vertical-align:top"><b>${fmt(p.amount)}</b></td></tr>`).join('')
            ||'<tr><td colspan="3" class="empty">Nothing recorded for '+finYear+'.</td></tr>'}
          <tr class="drilltot"><td colspan="2">TOTAL MISCELLANEOUS CASH IN</td>
            <td class="r">${fmt(c.miscAuto)}</td></tr></table></div>`);
  }
  if(kind==='totalexp'){
    const cats=[...new Set(tx.filter(t=>t.kind==='expense').map(t=>t.cat))];
    const rows=cats.map(x=>[x, tx.filter(t=>t.kind==='expense'&&t.cat===x&&!t.inkind).reduce((a,t)=>a+t.amount,0)]);
    const expInk=tx.filter(t=>t.kind==='expense'&&t.inkind).reduce((a,t)=>a+t.amount,0);
    if(expInk>0.005) rows.push(['In-kind expenses recorded (included in the total)',expInk]);
    return openModal(_drillTitle('TOTAL EXPENSES',
      'Every dollar spent in '+finYear+'.', c.expenses,'red')
      + _drillSum(rows,'TOTAL EXPENSES',c.expenses,
        'Tap any single line back in the Books screen to see the individual entries behind it.'));
  }

  /* ---- in-kind ---- */
  if(kind==='inkind'){
    const ink=tx.filter(t=>t.kind==='income'&&t.inkind);
    const by={}; ink.forEach(t=>{ const k=t.member||'(nobody recorded)'; by[k]=(by[k]||0)+t.amount; });
    return openModal(_drillTitle('In-kind donations',
      'Items donated rather than money — a TV, a gift card, a case of wine. The value counts toward the '
      +'donor’s sponsor quota, but it is never added to income or the club balance, because no cash changed hands.',
      c.inkind,'gold')
      + _drillTxTable(ink,'Total value donated')
      + `<h2>Secured by</h2>${_drillSum(Object.entries(by).sort((a,b)=>b[1]-a[1]).map(r=>[r[0],r[1]]),'Total value',c.inkind)}`);
  }
}
function booksHTML(){
  if(!S.finance){
    if(!_finInit){ _finInit=true; DB.set(['finance'],FIN_SEED).then(()=>rerender()); }
    return '<div class="empty">Opening the club books for the first time…</div>';
  }
  const F=S.finance, nowY=new Date().getFullYear();
  const years=[...new Set(Object.keys(F.history||{}).map(Number)
    .concat(Array.from({length:nowY-F.opening.year+1},(_,i)=>F.opening.year+i)))].sort();
  if(!years.includes(finYear)) finYear=nowY;
  const c=finCalc(finYear);
  const yearBtns=`<div class="payrow noprint" style="flex-wrap:wrap">
    ${years.map(y=>`<button class="${finYear===y?'on':''}" style="flex:1 1 15%"
      onclick="finYear=${y};rerender()">${y}</button>`).join('')}</div>`;
  if(c && c.hist){
    return printHead('Club Books — '+finYear,'Archived year') + yearBtns + `
      <div class="statgrid">
        <div class="stat green"><div class="v">${fmt(c.income)}</div><div class="l">Total income (incl. carry-over)</div></div>
        <div class="stat red"><div class="v">${fmt(c.expenses)}</div><div class="l">Expenses</div></div>
        <div class="stat gold"><div class="v">${fmt(c.balance)}</div><div class="l">Year-end balance</div></div>
        <div class="stat"><div class="v">${Math.round(c.expenses/c.income*100)}%</div><div class="l">Of income spent</div></div>
      </div>
      ${c.note?'<p class="muted">Note: '+esc(c.note)+' — the original sheet had a broken formula for this year; figures are derived from the years around it.</p>':''}
      <p class="muted">Archived summary from the old Excel sheet. Full detail for this year stays in the workbook.</p>
      ${yoyHTML(years)}`;
  }
  const catSum=(kind,cat)=>c.tx.filter(t=>t.kind===kind&&t.cat===cat&&!t.inkind).reduce((a,t)=>a+t.amount,0);
  // The category rows count cash only, but TOTAL EXPENSES counts everything — so if an
  // in-kind expense ever gets recorded, show it on its own line and the table still adds up.
  const expInk=c.tx.filter(t=>t.kind==='expense'&&t.inkind).reduce((a,t)=>a+t.amount,0);
  // like the Budget Report: EVERY category shown, even at $0
  const hidCats=F.catsHidden||{income:[],expense:[]};
  const incCats=[...new Set((F.cats&&F.cats.income||FIN_SEED.cats.income)
    .filter(x=>!(hidCats.income||[]).includes(x))
    .concat(c.tx.filter(t=>t.kind==='income').map(t=>t.cat)))];
  const expCats=[...new Set((F.cats&&F.cats.expense||FIN_SEED.cats.expense)
    .filter(x=>!(hidCats.expense||[]).includes(x))
    .concat(c.tx.filter(t=>t.kind==='expense').map(t=>t.cat)))];
  // Sponsor quota board — driven by the member ROSTER (plus anyone credited).
  // It runs on the SPONSOR year, Aug 1 → Jul 31, so it reads the raw txns and
  // not c.tx, which is filtered to the calendar year showing in the books.
  const target=F.sponsorTarget||500;
  const spYr=sponsorYrShown(), spYears=sponsorYears();
  const secured=sponsorSecured(spYr);
  // The point-of-sale person is staff, not a member — no sponsor expected of them.
  const roster=(S.attendance&&S.attendance.roster||ATT_SEED.roster)
    .filter(r=>!r.hidden&&!isStaffRow(r)).map(r=>r.name);
  const boardNames=[...new Set(roster.concat(Object.keys(secured).filter(n=>!isStaffName(n))))];
  const spTot=boardNames.reduce((a,m)=>a+Math.min(secured[m]||0,target),0);
  const spDone=boardNames.filter(m=>(secured[m]||0)>=target).length;
  const spAllIn=boardNames.length>0 && spDone===boardNames.length;
  const spBtns=`<div class="payrow noprint" style="flex-wrap:wrap">
    ${spYears.map(y=>`<button class="${spYr===y?'on':''}" style="flex:1 1 22%;padding:9px 4px"
      onclick="sponsorYr=${y};rerender()">${y===currentSponsorYear()?'▶ ':''}${y}</button>`).join('')}
    </div>`;
  // entries grouped by category, subtotal per group
  const groups={};
  c.tx.forEach(t=>{ (groups[t.cat]=groups[t.cat]||[]).push(t); });
  const entriesHTML=Object.entries(groups).map(([cat,list])=>{
    const sub=list.reduce((a,t)=>a+(t.inkind?0:t.amount),0);
    const subInk=list.reduce((a,t)=>a+(t.inkind?t.amount:0),0);
    const kind=list[0].kind;
    return `<div class="card" style="padding:10px 14px;background:var(--panel2)">
      <b>${esc(cat)}</b><span style="float:right"><span class="${kind==='income'?'pos':'neg'}"><b>${kind==='income'?'+':'−'}${fmt(sub)}</b></span>${subInk>0?` <span class="muted">+ ${fmt(subInk)} in-kind</span>`:''}</span></div>`+
      list.map(t=>`<div class="card" style="display:flex;justify-content:space-between;gap:10px;align-items:center">
        <div>${t.inkind?`<b class="goldtxt">🎁 ${fmt(t.amount)} value</b> <span class="memberflag">IN-KIND — not income</span>`:`<b class="${t.kind==='income'?'pos':'neg'}">${t.kind==='income'?'+':'−'}${fmt(t.amount)}</b>`}
          <span class="muted">${new Date(t.ts).toLocaleDateString('en-CA')}</span>
          ${t.sponsor?' · <b>'+esc(t.sponsor)+'</b>':''}
          ${picForBadge(t)}
          <div class="muted">${t.member?(t.kind==='income'?'secured by ':'reimbursed to ')+esc(t.member):''}${t.member&&t.note?' · ':''}${t.note?esc(t.note):''}</div></div>
        <span style="flex:0 0 auto" class="noprint">${t.invoice?`<button class="btn small gray" onclick="viewInvoice('${t.id}')">📎</button>`:''}
        <button class="btn small gray" onclick="finEntryModal('${t.id}')">✎</button></span>
      </div>`).join('');
  }).join('');
  return printHead('Club Books — '+finYear, 'Cash flow & annual report') + yearBtns + `
    ${!F.imported2026 && finYear===2026 ? `<div class="card" style="border-color:var(--gold)">
      <b>📥 One-time import available</b>
      <p class="muted">I parsed every 2026 cell note from your Excel sheet — 8 donations ($4,000, with who secured each) and 10 expenses ($3,757.62, itemized). Load them as real entries?</p>
      <button class="btn" onclick="importFin2026()">Import the 2026 entries from the Excel notes</button></div>`:''}
    <div class="rowbtns noprint">
      <button class="btn" onclick="finEntryModal(null)">＋ Add income / expense entry</button>
      <button class="btn gray" style="flex:0 0 auto" onclick="manageCatsModal()">⚙ Categories</button>
    </div>
    <div style="height:12px"></div>
    <h2>Total income</h2>
    <p class="muted noprint" style="margin:-6px 0 8px">Tap any line to see exactly what it is made up of.</p>
    <div class="card"><table>
      <tr><th>Item</th><th class="r">Amount</th></tr>
      ${incCats.map(cat=>`<tr class="drill" onclick="finDrill('income','${jsq(cat)}')"><td>${esc(cat)}</td><td class="r">${fmt(catSum('income',cat))}</td></tr>`).join('')}
      <tr class="drill" onclick="finDrill('sales')"><td>Picnic + Apparel Sales — 🛒 live from this app</td><td class="r pos">${fmt(c.salesAuto)}</td></tr>
      ${c.miscAuto>0.005?`<tr class="drill" onclick="finDrill('misc')"><td>Miscellaneous cash in — 🧾 from the Money screen</td><td class="r pos">${fmt(c.miscAuto)}</td></tr>`:''}
      <tr class="drill" onclick="finDrill('prev')"><td>Previous Balance (carried from ${finYear-1})</td><td class="r">${fmt(c.prev)}</td></tr>
      <tr class="drill" onclick="finDrill('totalin')"><td><b>TOTAL INCOME</b></td><td class="r"><b>${fmt(c.totalIn)}</b></td></tr>
      ${c.inkind>0.005?`<tr class="drill" onclick="finDrill('inkind')"><td class="muted">In-kind donations (tracked, not in balance)</td><td class="r muted">${fmt(c.inkind)}</td></tr>`:''}
    </table></div>
    <h2>Total expenses</h2>
    <p class="muted noprint" style="margin:-6px 0 8px">Tap any line to see every entry behind it.</p>
    <div class="card"><table>
      <tr><th>Item</th><th class="r">Amount</th></tr>
      ${expCats.map(cat=>`<tr class="drill" onclick="finDrill('expense','${jsq(cat)}')"><td>${esc(cat)}</td><td class="r ${catSum('expense',cat)>0?'':'dim'}">${fmt(catSum('expense',cat))}</td></tr>`).join('')}
      ${expInk>0.005?`<tr class="drill" onclick="finDrill('totalexp')"><td class="muted">In-kind expenses (included in the total below)</td><td class="r muted">${fmt(expInk)}</td></tr>`:''}
      <tr class="drill" onclick="finDrill('totalexp')"><td><b>TOTAL EXPENSES</b></td><td class="r"><b>${fmt(c.expenses)}</b></td></tr>
    </table></div>
    <h2>Summary</h2>
    <div class="statgrid">
      <div class="stat green"><div class="v">${fmt(c.totalIn)}</div><div class="l">Total annual income</div></div>
      <div class="stat red"><div class="v">${fmt(c.expenses)}</div><div class="l">Total annual expenses</div></div>
      <div class="stat gold"><div class="v">${fmt(c.balance)}</div><div class="l">Balance</div></div>
      <div class="stat"><div class="v">${Math.round(c.pctSpent*100)}%</div><div class="l">Percentage of income spent</div></div>
    </div>
    <h2>⭐ Sponsor board — ${sponsorYearLabel(spYr)}</h2>
    ${spBtns}
    ${sponsorNoticeHTML(target)}
    <div class="statgrid">
      <div class="stat ${spAllIn?'green':'gold'}"><div class="v">${spDone} / ${boardNames.length}</div><div class="l">Members covered</div></div>
      <div class="stat green"><div class="v">${fmt(spTot)}</div><div class="l">Counted toward the quota</div></div>
      <div class="stat ${spAllIn?'green':'red'}"><div class="v">${fmt(Math.max(0,boardNames.length*target-spTot))}</div><div class="l">Still to be secured</div></div>
    </div>
    <div class="card"><table><tr><th>Member</th><th class="r">Secured — ${spYr} season</th><th class="r">Status</th></tr>
      ${boardNames.map(m=>{ const got=secured[m]||0;
        return `<tr><td>${esc(m)}</td><td class="r">${fmt(got)}</td>
          <td class="r ${got>=target?'pos':'neg'}"><b>${got>=target?'✔ covered':'owes '+fmt(target-got)}</b></td></tr>`;}).join('')}
    </table></div>
    <p class="muted">A donation counts toward whoever is picked as "secured by", and it lands in the sponsor year its <b>date</b> falls in —
      one dated Aug 2 counts for the new season, one dated Jul 30 for the season just closed.
      Self-sponsoring: record a donation with sponsor "(Self)" and pick the member.
      The point-of-sale person is not on this board: they run the till, they are not a member.</p>
    <h2>Entries — ${finYear} (grouped by category)</h2>
    ${entriesHTML||'<div class="empty">No entries yet for '+finYear+'. Sales income flows in automatically; add donations and expenses with the button above.</div>'}
    ${yoyHTML(years)}
    <div class="rowbtns noprint">
      <button class="btn gray" onclick="window.print()">🖨 Print / Save as PDF</button>
      <button class="btn gray" onclick="exportBooksCSV()">⬇ Books CSV</button>
    </div>`;
}

/* ========================= EVENT PROFIT & LOSS ==============================
   The picnic is the club's big day: sponsors pay for it, the till takes money
   at it, and a whole season of expenses goes into it. Reconciling that was a
   paper job every year. This does it from the records the app already keeps —
   and, just as importantly, it prints WHY each figure is in the total, so a
   number that looks wrong can be opened up and argued with instead of trusted.

   An event OWNS nothing. It is a set of rules for gathering up records that
   live elsewhere, plus a list of hand-made exceptions:

     cats    — the expense / income categories that belong to this event
     donYr   — the sponsor year whose CASH donations paid for it
     tags    — the event names the till was set to on the day
     from/to — the day (or days) it ran, which catches anything rung up
               without a till name on it, and any cash handed in that day
     inTx/exTx, inSale/exSale, inPay/exPay — the exceptions, kept ON the event
               so deleting an event never leaves a mark on a sale or a book entry

   In-kind donations are deliberately kept OUT of the total. They count toward
   a member's sponsor quota, but no money ever arrived, so putting them in the
   income column would make the day look better funded than it really was.   */
let evShown=null;

function evAll(){
  return Object.entries((S.finance&&S.finance.events)||{})
    .map(([id,e])=>({id,...e})).sort((a,b)=>(b.from||0)-(a.from||0));
}
function evCur(){
  const list=evAll(); if(!list.length) return null;
  return list.find(e=>e.id===evShown) || list[0];
}
// Every event name ever typed into the till, with how many sales carry it, so
// setting an event up is picking off a list instead of spelling from memory.
function evSaleTags(){
  const t={};
  Object.values(S.sales||{}).forEach(s=>{ const n=(s.eventName||'').trim();
    if(n&&!s.voided) t[n]=(t[n]||0)+1; });
  return Object.entries(t).sort((a,b)=>b[1]-a[1]);
}
const _evDay=ts=>new Date(ts).toLocaleDateString('en-CA',{month:'short',day:'numeric'});

/* Everything the event page shows, worked out in one place so the tiles, the
   tables and the drill-downs are physically incapable of disagreeing.       */
function evCalc(ev){
  const F=S.finance||{};
  const inTx=ev.inTx||{}, exTx=ev.exTx||{}, inSale=ev.inSale||{}, exSale=ev.exSale||{},
        inPay=ev.inPay||{}, exPay=ev.exPay||{};
  const cats=ev.cats||[], tags=(ev.tags||[]).map(x=>String(x).trim().toLowerCase()).filter(Boolean);
  const from=ev.from||0, to=ev.to||0;

  /* ---- book entries: is this one the picnic's, and why? ---- */
  const txWhy=t=>{
    if(exTx[t.id]) return null;                                  // taken out by hand
    if(inTx[t.id]) return 'added to this event by hand';
    // A picnic tag is the last word. Tag an entry "Picnic 2027" and the 2027
    // picnic claims it whatever its category or date, and every other event
    // ignores it — which is what stops one "Annual Picnic - Prizes" entry being
    // counted twice, once by 2026 and once by 2027. No tag = behave as before.
    if(t.picFor)
      return (ev.picYr && String(ev.picYr)===String(t.picFor))
        ? 'tagged for the '+t.picFor+' picnic' : null;
    if(t.kind==='income' && t.cat==='Donations')
      return (ev.donYr && sponsorYearOf(t.ts)===ev.donYr)
        ? 'sponsorship secured for the '+ev.donYr+' sponsor year' : null;
    return cats.includes(t.cat) ? 'filed under '+t.cat : null;
  };
  const claimed=Object.entries(F.txns||{}).map(([id,t])=>({id,...t}))
    .map(t=>({...t, why:txWhy(t)})).filter(t=>t.why).sort((a,b)=>a.ts-b.ts);

  const spons  = claimed.filter(t=>t.kind==='income'&&t.cat==='Donations'&&!t.inkind);
  const inkind = claimed.filter(t=>t.kind==='income'&&t.inkind);
  const otherIn= claimed.filter(t=>t.kind==='income'&&t.cat!=='Donations'&&!t.inkind);
  const exps   = claimed.filter(t=>t.kind==='expense'&&!t.inkind);
  const expInk = claimed.filter(t=>t.kind==='expense'&&t.inkind);

  /* ---- what the till took ---- */
  const saleWhy=(id,s)=>{
    if(s.voided||exSale[id]) return null;
    if(inSale[id]) return 'added to this event by hand';
    const n=(s.eventName||'').trim();
    if(n && tags.includes(n.toLowerCase())) return 'the till was set to “'+n+'”';
    if(from && to && s.ts>=from && s.ts<=to) return 'rung up on '+_evDay(s.ts);
    return null;
  };
  const sales=Object.entries(S.sales||{}).map(([id,s])=>({id,s,why:saleWhy(id,s)}))
    .filter(x=>x.why).sort((a,b)=>a.s.ts-b.s.ts);

  /* ---- cash handed in that never went through the till ---- */
  const pays=Object.entries(S.payments||{}).map(([id,p])=>({id,...p}))
    .filter(p=>p.kind==='misc' && !exPay[p.id]
      && (inPay[p.id] || (from && to && p.ts>=from && p.ts<=to)))
    .sort((a,b)=>a.ts-b.ts);

  const sum=(l,f)=>Math.round(l.reduce((a,x)=>a+(f?f(x):(x.amount||0)),0)*100)/100;
  const sponsorIn=sum(spons), otherInc=sum(otherIn), inkindVal=sum(inkind);
  const salesIn=sum(sales,x=>x.s.total), miscIn=sum(pays);
  // Rung up but not yet in the box. It still counts as income — the club is owed
  // it, and the books have always counted a sale on the day it was made — but it
  // is flagged, because "did the day make money" and "is the money here" are two
  // different questions and the second one is the one that bites.
  const onTab=sum(sales.filter(x=>x.s.payment==='Pay Later'),x=>x.s.total);
  const cogs=Math.round(sales.reduce((a,x)=>a+(x.s.lines||[])
    .reduce((b,l)=>b+(l.cost||0)*(l.qty||0),0),0)*100)/100;
  const spent=sum(exps), spentInk=sum(expInk);
  const totalIn=Math.round((sponsorIn+salesIn+miscIn+otherInc)*100)/100;
  const net=Math.round((totalIn-spent)*100)/100;

  // Expenses rolled up by category, biggest first — the way you would read
  // them out to the table at a meeting.
  const byCat={};
  exps.forEach(t=>{ (byCat[t.cat]=byCat[t.cat]||{cat:t.cat,n:0,amt:0}); byCat[t.cat].n++; byCat[t.cat].amt+=t.amount; });
  const catRows=Object.values(byCat).map(r=>({...r,amt:Math.round(r.amt*100)/100}))
    .sort((a,b)=>b.amt-a.amt);

  return {ev, spons, inkind, otherIn, exps, expInk, sales, pays, catRows,
    sponsorIn, salesIn, miscIn, otherInc, inkindVal, onTab, cogs,
    spent, spentInk, totalIn, net,
    units:sales.reduce((a,x)=>a+(x.s.lines||[]).reduce((b,l)=>b+(l.qty||0),0),0)};
}

/* A sensible first event, guessed from what is already in the books: the
   picnic categories, this sponsor year, and the busiest selling day of the
   year — which in practice IS the picnic.                                   */
function evSuggest(){
  const y=new Date().getFullYear(), F=S.finance||{};
  // A category is picnic money if it SAYS picnic — or if the entries filed under
  // it say picnic. That second rule is what catches the merchandise order: it is
  // filed under 3 Aces Merchandise, but the note reads "Picnic order", and the
  // shirts it paid for are the same shirts sold on the day. Counting the takings
  // without counting what the stock cost would flatter the day badly.
  const said=new Set(Object.values(F.txns||{})
    .filter(t=>t.kind==='expense' && /picnic/i.test(t.note||'')).map(t=>t.cat));
  const cats=[...new Set((((F.cats||FIN_SEED.cats).expense)||[])
    .concat(Object.values(F.txns||{}).filter(t=>t.kind==='expense').map(t=>t.cat)))]
    .filter(c=>/picnic/i.test(c) || said.has(c));
  const days={};
  Object.values(S.sales||{}).forEach(s=>{ if(s.voided) return;
    if(new Date(s.ts).getFullYear()!==y) return;
    const k=dstr(s.ts); days[k]=(days[k]||0)+s.total; });
  const best=Object.entries(days).sort((a,b)=>b[1]-a[1])[0];
  const day=best? best[0] : y+'-07-12';
  const tags=[...new Set(Object.values(S.sales||{})
    .filter(s=>!s.voided && dstr(s.ts)===day && (s.eventName||'').trim())
    .map(s=>s.eventName.trim()))];
  return {name:'Annual Picnic '+y, day, cats, tags, donYr:currentSponsorYear()};
}
async function evStart(){
  const g=evSuggest();
  await evPut(null,{name:g.name, from:new Date(g.day+'T00:00:00').getTime(),
    to:new Date(g.day+'T23:59:59').getTime(), cats:g.cats, tags:g.tags, donYr:g.donYr});
  toast('Built from the books — check it over and adjust anything');
}
async function evPut(id,obj){
  const key=id||('ev'+Date.now().toString(36));
  const old=id? ((S.finance.events||{})[id]||{}) : {};
  await DB.set(['finance','events',key], {...old, ...obj});
  evShown=key; rerender();
  return key;
}

// Money tagged for a picnic that no event has claimed would be money nobody can
// see — it would sit in the books and appear on no P&L at all. Say so, loudly,
// with the amount, so it gets fixed the moment it happens.
function evOrphanHTML(list){
  const claimed=new Set((list||[]).map(e=>e.picYr).filter(Boolean).map(String));
  const lost={};
  Object.values((S.finance||{}).txns||{}).forEach(t=>{
    if(!t.picFor || claimed.has(String(t.picFor)) || t.inkind) return;
    const k=String(t.picFor);
    lost[k]=(lost[k]||0)+(t.kind==='income'? t.amount : -t.amount);
  });
  const yrs=Object.keys(lost).sort();
  if(!yrs.length) return '';
  return `<div class="card noprint" style="border-color:var(--gold)">
    <b>🧺 Tagged for a picnic that has no event yet</b>
    ${yrs.map(k=>`<p class="muted" style="margin:6px 0 0"><b>${fmt(Math.abs(lost[k]))}</b> is tagged
      <b>Picnic ${esc(k)}</b>, but no event on this page is set to the ${esc(k)} picnic, so it is counted nowhere.
      Set one up — or open an existing event and pick “The ${esc(k)} picnic” — and it will land there on its own.</p>`).join('')}
    <div style="height:8px"></div>
    <button class="btn gray" onclick="evEditModal(null)">＋ Set up the event</button>
  </div>`;
}

    const g=evSuggest();
    return printHead('Event Profit & Loss','Nothing set up yet') + `

  const story=`Sponsors and donations brought in <b>${fmt(c.sponsorIn)}</b>${c.spons.length?` from ${n(c.spons.length,'sponsor')}`:''}.

    Putting it on cost <b>${fmt(c.spent)}</b>.
    That leaves the club <b class="${c.net>=0?'pos':'neg'}">${fmt(Math.abs(c.net))} ${c.net>=0?'ahead':'down'}</b> on ${esc(ev.name)}.`;

  const row=(icon,label,val,kind,key,sub)=>`<tr class="drillrow" onclick="evDrill('${kind}','${jsq(key||'')}')">
    <td>${icon} ${label} <span class="muted">›</span>${sub?`<div class="muted" style="font-size:12px">${sub}</div>`:''}</td>
    <td class="r ${val>0.005?'pos':'dim'}">${fmt(val)}</td></tr>`;

  return printHead('Event Profit & Loss', ev.name+' — '+when) + pick + `
    <div class="card" style="padding:10px 14px">
      <b style="font-size:17px">🎪 ${esc(ev.name)}</b>
      <div class="muted">${esc(when)}</div>
    </div>
    <div class="statgrid">
      <div class="stat green"><div class="v">${fmt(c.totalIn)}</div><div class="l">Money in</div></div>
      <div class="stat red"><div class="v">${fmt(c.spent)}</div><div class="l">Money out</div></div>
      <div class="stat ${c.net>=0?'gold':'red'}"><div class="v">${c.net>=0?'':'−'}${fmt(Math.abs(c.net))}</div>
        <div class="l">${c.net>=0?'Profit on the day':'Loss on the day'}</div></div>
      <div class="stat"><div class="v">${c.totalIn>0?Math.round(c.spent/c.totalIn*100):0}%</div>
        <div class="l">Of what came in was spent</div></div>
    </div>
    <div class="card"><p style="margin:0">${story}</p></div>
    ${evOrphanHTML(list)}

    <h2>Money in</h2>
    <div class="card"><table>
      ${row('💰','Cash sponsorships &amp; donations',c.sponsorIn,'spons','',
          ev.donYr?`every cash sponsorship secured in the ${ev.donYr} sponsor year (Aug 1 ${ev.donYr-1} → Jul 31 ${ev.donYr})`
                  :'only the ones added to this event by hand')}
      ${row('🛒','Sold at the event',c.salesIn,'sales','',
          `${n(c.units,'item')} across ${n(c.sales.length,'sale')} at the till`)}
      ${c.miscIn>0.005||c.pays.length?row('💵','Cash handed in on the day',c.miscIn,'pays','',

      ${c.otherInc>0.005||c.otherIn.length?row('➕','Other income filed to this event',c.otherInc,'otherin',''):''}

        <td class="r neg">${fmt(r.amt)}</td></tr>`).join('')
        ||'<tr><td class="muted">Nothing has been filed against this event yet.</td><td class="r dim">$0.00</td></tr>'}
      <tr class="drilltot"><td><b>TOTAL OUT</b></td><td class="r"><b>${fmt(c.spent)}</b></td></tr>
    </table></div>

    <h2>The bottom line</h2>
    <div class="card"><table>
      <tr><td>Everything that came in</td><td class="r pos">${fmt(c.totalIn)}</td></tr>
      <tr><td>Everything it cost</td><td class="r neg">−${fmt(c.spent)}</td></tr>
      <tr class="drilltot"><td><b>${c.net>=0?'PROFIT':'LOSS'} ON ${esc(ev.name.toUpperCase())}</b></td>

    </table>
    ${c.cogs>0.005?`<p class="muted" style="margin:8px 0 0">For what it is worth: the goods sold at the event had cost
      the club <b>${fmt(c.cogs)}</b> to buy, so the margin on the merchandise alone was
      <b>${fmt(Math.round((c.salesIn-c.cogs)*100)/100)}</b>. That is already inside the figures above — the stock
      purchase shows up as an expense whenever you paid for it, which is the way you keep the books.</p>`:''}
    </div>

    <h2 class="noprint">How these figures were gathered</h2>
    <div class="card noprint"><p class="muted" style="margin:0">Tap any row above to see the actual records behind it —
      and to take something out that does not belong. An entry lands on this event if:</p>
      <ul class="muted" style="margin:6px 0 0;padding-left:18px">
        <li>it is a <b>cash sponsorship</b> from the ${ev.donYr||'—'} sponsor year${ev.donYr?'':' (no sponsor year is set)'};</li>

        <li>it is an <b>expense</b> filed under ${(ev.cats||[]).length?(ev.cats||[]).map(x=>'<b>'+esc(x)+'</b>').join(', '):'<i>no categories yet</i>'};</li>
        <li>or you added it by hand.</li>

      <p class="muted" style="margin:8px 0 0">Anything you leave out stays listed in ⚙ Set up this event, so you can put it back.</p>
    </div>
    <div class="rowbtns noprint">
      <button class="btn gray" onclick="evEditModal('${ev.id}')">⚙ Set up this event</button>

      <button class="btn gray" onclick="window.print()">🖶 Print / Save as PDF</button>

}

/* --------------------------- SHOW YOUR WORKING ----------------------------- */
function evDrill(kind,key){
  const ev=evCur(); if(!ev) return;
  const c=evCalc(ev);
  const cut=(what,id,label)=>`<button class="btn small gray noprint"
    onclick="evToggle('${what}','${id}',false,'${kind}','${jsq(key||'')}')">✕ ${label||'leave out'}</button>`;

  const txRows=(list,who)=>list.map(t=>`<tr>
    <td style="white-space:nowrap;vertical-align:top">${_dDate(t.ts)}</td>
    <td>${t.sponsor?`<b>${esc(t.sponsor)}</b>`:`<b>${esc(t.cat||'—')}</b>`}
      ${t.inkind?' <span class="memberflag">IN-KIND</span>':''}
      ${(t.member||t.note)?`<div class="muted">${t.member?(t.kind==='income'?'secured by ':'paid / reimbursed to ')+esc(t.member):''}${t.member&&t.note?' · ':''}${t.note?esc(t.note):''}</div>`:''}
      <div class="muted" style="font-size:11px">counted because it is ${esc(t.why)}</div>
      <div class="noprint" style="margin-top:3px">
        <button class="btn small gray" onclick="closeModal();finEntryModal('${t.id}')">✎ edit</button>
        ${cut('tx',t.id)}</div></td>
    <td class="r ${t.inkind?'goldtxt':(t.kind==='income'?'pos':'neg')}" style="vertical-align:top;white-space:nowrap">
      <b>${fmt(t.amount)}</b></td></tr>`).join('');
  const txTable=(list,label)=>list.length? `<div class="card"><table>
      <tr><th>Date</th><th>${esc(label||'Who / what')}</th><th class="r">Amount</th></tr>
      ${txRows(list)}
      <tr class="drilltot"><td colspan="2">Subtotal — ${list.length} entr${list.length===1?'y':'ies'}</td>
        <td class="r">${fmt(Math.round(list.reduce((a,t)=>a+t.amount,0)*100)/100)}</td></tr></table></div>`
    : '<div class="empty">Nothing under this yet.</div>';
  const head=(title,sub,total,cls)=>`<h3><button class="x" onclick="closeModal()">✕</button>${esc(title)}</h3>
    <div class="stat ${cls||'gold'}" style="margin:0 0 4px"><div class="v">${fmt(total)}</div>
      <div class="l">${esc(title)} — ${esc(ev.name)}</div></div>
    ${sub?`<p class="muted" style="margin:6px 0 10px">${sub}</p>`:'<div style="height:8px"></div>'}`;

  if(kind==='spons') return openModal(
    head('Cash sponsorships & donations',
      ev.donYr?`Every cash sponsorship secured in the <b>${ev.donYr}</b> sponsor year — Aug 1 ${ev.donYr-1} to Jul 31 ${ev.donYr}.
        The sponsor year ends right after the picnic, which is why the whole season's money is what paid for it.
        If one of these was meant for something else, leave it out and the total below fixes itself.`
        :'No sponsor year is set for this event, so only donations added by hand are counted.',
      c.sponsorIn,'green')
    + txTable(c.spons,'Sponsor')
    + (c.inkind.length?`<h2>Also received — but NOT in that total</h2>
        <p class="muted">In-kind means somebody gave an item rather than money. It counts toward their sponsor quota,
          but no cash arrived, so it is never added to what the event took in.</p>${txTable(c.inkind,'Sponsor')}`:''));

  if(kind==='otherin') return openModal(
    head('Other income filed to this event','Income entries other than sponsorships.',c.otherInc,'green')
    + txTable(c.otherIn,'Source'));

  if(kind==='inkind') return openModal(
    head('In-kind donations','Given as goods, not money — counted toward the donor’s sponsor quota, never counted as income.',
      c.inkindVal,'gold') + txTable(c.inkind,'Sponsor'));

  if(kind==='cat'){
    const list=c.exps.filter(t=>t.cat===key);
    return openModal(head(key,'Every expense filed against this event under this category.',
      Math.round(list.reduce((a,t)=>a+t.amount,0)*100)/100,'red') + txTable(list,'What it was for'));
  }

  if(kind==='pays') return openModal(
    head('Cash handed in on the day','Money that never went through the till — logged on the Money screen.',c.miscIn,'green')
    + (c.pays.length?`<div class="card"><table><tr><th>Date</th><th>Who / what for</th><th class="r">Amount</th></tr>
        ${c.pays.map(p=>`<tr><td style="white-space:nowrap">${_dDate(p.ts)}</td>
          <td><b>${esc(p.from||'—')}</b>${p.note?`<div class="muted">${esc(p.note)}</div>`:''}
            <div class="noprint" style="margin-top:3px">${cut('pay',p.id)}</div></td>
          <td class="r pos"><b>${fmt(p.amount)}</b></td></tr>`).join('')}
        <tr class="drilltot"><td colspan="2">Subtotal</td><td class="r">${fmt(c.miscIn)}</td></tr></table></div>`
      : '<div class="empty">No cash was logged in on those dates.</div>'));

  if(kind==='sales') return openModal(
    head('Sold at the event',`${c.sales.length} sale${c.sales.length===1?'':'s'}, ${c.units} item${c.units===1?'':'s'}.
      Each one says underneath why it landed on this event.`,c.salesIn,'green')
    + (c.onTab>0.005?`<div class="card"><p class="muted" style="margin:0">⏳ <b>${fmt(c.onTab)}</b> of this was rung up as
        <b>Pay Later</b>. It is still counted — the club is owed it — but it is not cash in the box yet.</p></div>`:'')
    + (c.sales.length? c.sales.map(({id,s,why})=>`<div class="card" style="margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap">
          <b>${new Date(s.ts).toLocaleDateString('en-CA',{month:'short',day:'numeric'})}
            ${new Date(s.ts).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</b>
          <span class="muted">${esc(s.sellerName)} · ${s.payment==='Pay Later'
            ?`<b class="goldtxt">Pay Later</b>${s.buyer?' — on '+esc(s.buyer)+'’s tab':''}`
            :esc(s.payment)+(s.buyer?' — '+esc(s.buyer):'')}</span></div>
        <div class="muted" style="font-size:12px;margin-top:2px">${(s.lines||[]).map(l=>esc(l.item)+' '+esc(l.size)+' ×'+l.qty).join(' · ')}</div>
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px">
          <span class="muted" style="font-size:11px">counted because ${esc(why)}</span>
          <b class="pos">${fmt(s.total)}</b></div>
        <div class="noprint" style="margin-top:4px">${cut('sale',id)}</div>
      </div>`).join('') : '<div class="empty">No sales landed on this event.</div>'));
}

/* Leaving something out, or putting it back. The exception is written on the
   EVENT, never on the sale or the book entry, so nothing is damaged by it and
   deleting the event forgets the whole argument.                            */
async function evToggle(what,id,keep,kind,key){
  const ev=evCur(); if(!ev) return;
  const m = what==='tx' ? ['inTx','exTx'] : what==='sale' ? ['inSale','exSale'] : ['inPay','exPay'];
  await DB.set(['finance','events',ev.id,m[0],id], keep?true:null);
  await DB.set(['finance','events',ev.id,m[1],id], keep?null:true);
  rerender();
  toast(keep?'Counted in this event again':'Left out of this event');
  if(kind) evDrill(kind,key); else if(document.getElementById('evEditBox')) evEditModal(ev.id);
}

  window._ev={id: ev?ev.id:null};

  const catAmt=(cat,kind)=>Math.round(Object.values(F.txns||{})

  openModal(`<div id="evEditBox"><h3><button class="x" onclick="closeModal()">✕</button>${ev?'Set up':'New'} event</h3>

    <label>Which cash sponsorships paid for it?</label>

    </select>
    <p class="muted" style="margin:4px 0 0">The sponsor year turns over on Aug 1, right after the picnic, so a whole
      season of sponsorship is what pays for that one day. In-kind donations are listed but never counted as income.</p>

    ${picYrs.length?`<label>Is this a picnic? Which year?</label>
    <select id="ev_picyr" onchange="this.dataset.touched=1">

    <label>…or type another one</label>

    <label>Expenses that belong to this event</label>
    ${expCats.map(x=>tick('evcat',x,on.includes(x),x,
      catAmt(x,'expense')>0? fmt(catAmt(x,'expense'))+' filed under this in '+yr : 'nothing filed under this in '+yr)).join('')}
    <label>Other income that belongs to it</label>
    ${incCats.map(x=>tick('evcat',x,on.includes(x),x,

    <button class="btn" onclick="evSaveModal()">✓ Save event</button>
    ${ev?`<div style="height:8px"></div><button class="btn red" onclick="evDelete('${ev.id}')">Delete this event</button>
      <p class="muted" style="margin:6px 0 0">Deleting an event removes nothing else — every sale, sponsorship and
        expense stays exactly where it is in the books.</p>`:''}
  </div>`);
}
// Type "Annual Picnic 2027" into the name and the picnic year ticks itself.
// It only ever fills a box the user has left alone — it never overwrites a choice.
function evPicYrSuggest(){
  const sel=$('ev_picyr'); if(!sel||sel.dataset.touched) return;
  const nm=($('ev_name')||{value:''}).value||'';
  if(!/picnic/i.test(nm)){ sel.value=''; return; }
  const yrs=[...sel.options].map(o=>o.value).filter(Boolean);
  const inName=(nm.match(/(19|20)\d\d/g)||[]).filter(y=>yrs.includes(y));
  if(inName.length){ sel.value=inName[0]; return; }
  const f=($('ev_from')||{value:''}).value;
  const fy=f? String(new Date(f+'T00:00:00').getFullYear()) : '';
  sel.value = yrs.includes(fy) ? fy : '';
}
async function evSaveModal(){
  const name=$('ev_name').value.trim();
  if(!name){ toast('Give the event a name',1); return; }
  const f=$('ev_from').value, t=$('ev_to').value||f;
  const cats=[...document.querySelectorAll('.evcat:checked')].map(x=>x.value);
  const tags=[...document.querySelectorAll('.evtag:checked')].map(x=>x.value)
    .concat($('ev_tag').value.split(',').map(x=>x.trim()).filter(Boolean));
  const donYr=$('ev_don').value? +$('ev_don').value : null;
  const picYr=($('ev_picyr')&&$('ev_picyr').value)||null;
  await evPut(window._ev&&window._ev.id, {name,
    from: f? new Date(f+'T00:00:00').getTime() : null,
    to:   t? new Date(t+'T23:59:59').getTime() : null,
    cats, tags:[...new Set(tags)], donYr, picYr});
  closeModal(); toast('Event saved');
}
function evDelete(id){
  const e=(S.finance.events||{})[id]||{};
  pinConfirm('Delete the event "'+(e.name||'')+'". This only removes the summary page — every sale, '
    +'sponsorship and expense stays exactly where it is in the books.',

function exportEventCSV(){
  const ev=evCur(); if(!ev) return;
  const c=evCalc(ev);
  const rows=[['Event',ev.name],['From',ev.from?dstr(ev.from):''],['To',ev.to?dstr(ev.to):''],[],
    ['Section','Date','Who / what','Detail','Why it is counted','Amount']];
  c.spons.forEach(t=>rows.push(['Sponsorship',dstr(t.ts),t.sponsor||'',(t.member?'secured by '+t.member:'')+(t.note?' — '+t.note:''),t.why,t.amount]));
  c.otherIn.forEach(t=>rows.push(['Other income',dstr(t.ts),t.cat||'',t.note||'',t.why,t.amount]));
  c.sales.forEach(x=>rows.push(['Sale',dstr(x.s.ts),x.s.sellerName||'',
    (x.s.lines||[]).map(l=>l.item+' '+l.size+' x'+l.qty).join(' | '),x.why,x.s.total]));
  c.pays.forEach(p=>rows.push(['Cash in',dstr(p.ts),p.from||'',p.note||'','handed in on the day',p.amount]));
  c.exps.forEach(t=>rows.push(['Expense',dstr(t.ts),t.cat||'',(t.member?'paid to '+t.member:'')+(t.note?' — '+t.note:''),t.why,-t.amount]));
  c.inkind.forEach(t=>rows.push(['In-kind (NOT counted)',dstr(t.ts),t.sponsor||'',t.note||'',t.why,0]));
  rows.push([],['TOTAL IN','','','','',c.totalIn],['TOTAL OUT','','','','',-c.spent],
    [c.net>=0?'PROFIT':'LOSS','','','','',c.net]);
  dl('three-aces-'+ev.name.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.csv',
    rows.map(r=>r.map(csvCell).join(',')).join('\n'));
}

// ── Which picnic is this for? ────────────────────────────────────────────────
// The category says WHAT the money was for (park fees, prizes, supplies).
// This says WHICH PICNIC it belongs to. They are different questions, which is
// why we do not stamp years onto category names. Buy the espresso cups in
// August 2026 for the 2027 picnic: the date stays August 2026 so the books are
// true, the tag says 2027 so the cost lands on next year's picnic.
// An entry with no tag behaves exactly the way it always has.
function picForDefault(kind){ return kind==='income' ? '' : (picYearKey()||''); }
// Union in the current picnic and whatever this entry is already tagged with,
// so the box can never open on a year that is missing from its own list.
function picForYears(also){
  return [...new Set(picYearList().concat([picYearKey()],also||[])
    .filter(Boolean).map(String))].sort().reverse();
}
function picForFieldHTML(t,editing,id){
  const yrs=picForYears([t&&t.picFor]);
  if(!yrs.length) return '';                       // no picnic set up yet — don't ask
  id=id||'fe_picfor';
  const cur = editing ? (t.picFor||'') : picForDefault(t.kind);
  return `<label>Which picnic is this for?</label>
    <select id="${id}" onchange="picForHint('${id}')">
      <option value=""${cur?'':' selected'}>— not a picnic expense —</option>
      ${yrs.map(k=>`<option value="${esc(k)}"${String(k)===String(cur)?' selected':''}>Picnic ${esc(k)}</option>`).join('')}
    </select>
    <div id="${id}Hint" class="muted" style="margin:2px 0 8px"></div>`;
}
function picForVal(id){ const s=$(id||'fe_picfor'); return (s&&s.value)||null; }
function picForHint(id,fixedDate){
  id=id||'fe_picfor';
  const el=$(id+'Hint'); if(!el) return;
  if(fixedDate!=null) el.dataset.d=fixedDate;
  const v=picForVal(id);
  const dEl=$('fe_date');
  const d=el.dataset.d || (dEl?dEl.value:'');
  const by=String(d? new Date(d+'T12:00').getFullYear() : new Date().getFullYear());
  el.textContent = !v
    ? 'Not counted against any picnic — it just sits in the books under its category.'
    : (String(v)===by
        ? 'Counted against the '+v+' picnic.'
        : 'The money leaves the '+by+' books, but the cost lands on the '+v+' picnic.');
}
function picForBadge(t){
  return t && t.picFor ? `<span class="picfortag">🧺 Picnic ${esc(t.picFor)}</span>` : '';
}

// Deleting a figure out of the books needs the same PIN as changing one.
function finDeleteEntry(id){
  const t=(S.finance.txns||{})[id]||{};
  pinConfirm('Delete this '+(t.kind==='income'?'income':'expense')+' entry — '
    +fmt(t.amount||0)+(t.cat?' under '+t.cat:'')+(t.sponsor?' from '+t.sponsor:'')
    +'. It comes straight back out of the club balance.',
    async()=>{ await DB.set(['finance','txns',id],null); closeModal(); toast('Entry deleted'); });
}
function feKind(k){
  window._fe.kind=k;
  $('feInc').classList.toggle('on',k==='income');
  $('feExp').classList.toggle('on',k!=='income');
  $('feIncOnly').style.display=k==='income'?'block':'none';
  $('fe_memLab').textContent=k==='income'?'Secured / collected by (counts toward their sponsor quota)':'Paid to / reimbursed to (optional)';
  // reload category options for the kind
  const hidK=((S.finance.catsHidden||{})[k==='income'?'income':'expense'])||[];
  const cats=((S.finance.cats||FIN_SEED.cats)[k==='income'?'income':'expense']||[]).filter(x=>!hidK.includes(x));
  const sel=$('fe_cat');
  if(sel && sel.tagName==='SELECT'){
    sel.innerHTML='<option value="" selected disabled>Pick a category…</option>'
      +cats.map(x=>`<option>${esc(x)}</option>`).join('')+'<option value="__new">＋ New category…</option>';
  }
  // Income is usually sponsorship, which is already matched by sponsor year, so
  // flipping to Income clears the picnic tag. Flipping back to Expense puts the
  // current picnic back. Only on a NEW entry — never silently re-tag an old one.
  const pf=$('fe_picfor');
  if(pf && !window._fe.id) pf.value=picForDefault(k);
  picForHint();
}
function feInkind(ink){
  $('feCash').classList.toggle('on',!ink);

async function saveFinEntry(){
  const k=window._fe.kind;
  let cat=$('fe_cat').value.trim(); if(cat==='__new') cat='';
  if(!cat){ toast('Pick or type a category',1); return; }
  const amt=parseFloat(String($('fe_amt').value).replace(/[^0-9.]/g,''))||0;
  if(amt<=0){ toast('Enter the amount',1); return; }
  const d=$('fe_date').value;
  const cats=(S.finance.cats||FIN_SEED.cats)[k==='income'?'income':'expense']||[];
  if(!cats.includes(cat)) await DB.set(['finance','cats',k==='income'?'income':'expense'],cats.concat(cat));
  const t={ts: d? new Date(d+'T12:00').getTime():Date.now(), kind:k, cat,
    amount:Math.round(amt*100)/100,
    member:$('fe_member').value||null,
    sponsor:k==='income'?($('fe_sponsor').value.trim()||null):null,
    inkind:k==='income'?$('fe_inkind').classList.contains('on'):false,
    note:$('fe_note').value.trim()||null, picFor:picForVal(), by:meU().name};
  const editingId=window._fe.id, invNew=window._feInvNew, invOld=window._feInv||null;
  // Everything above only READS the form. Everything below is the actual commit —
  // it runs from captured values, so the PIN screen is free to replace the form.
  const commit=async()=>{
    let inv=invOld;
    if(invNew){                  // a new photo/PDF/Word file → separate file store
      const fid=newId();
      try{ await fileSave(fid, invNew); inv='file:'+fid; }
      catch(e){ toast('Could not save the attachment — check the connection',1); return; }
    }
    t.invoice=inv;
    await DB.set(['finance','txns', editingId||newId()], t);
    closeModal(); toast('Entry saved'); rerender();
  };
  // Changing a figure that is already in the books is a real accounting change —
  // it moves the balance and the sponsor board. Adding a brand-new entry is not,
  // so that stays one tap, the same way ringing up a sale does.
  if(editingId){
    const was=S.finance.txns[editingId]||{};
    const changes=[];
    if(Math.abs((was.amount||0)-t.amount)>0.005) changes.push(fmt(was.amount||0)+' → '+fmt(t.amount));
    if((was.cat||'')!==t.cat) changes.push('category '+(was.cat||'—')+' → '+t.cat);
    if(dstr(was.ts)!==dstr(t.ts)) changes.push('date '+dstr(was.ts)+' → '+dstr(t.ts));
    if((was.picFor||'')!==(t.picFor||'')) changes.push('picnic '+(was.picFor||'none')+' → '+(t.picFor||'none'));
    return pinConfirm('You are changing a book entry that is already recorded'
      +(changes.length?': '+changes.join(', '):'')+'. This moves the club balance.', commit);
  }
  return commit();
}
function exportBooksCSV(){
  const rows=[['Date','Type','Category','Amount','In-Kind','Sponsor/Source','Member','For Picnic','Note','Recorded By']];
  Object.values(S.finance.txns||{}).sort((a,b)=>a.ts-b.ts).forEach(t=>
    rows.push([new Date(t.ts).toLocaleDateString('en-CA'),t.kind,t.cat,t.amount,
      t.inkind?'Y':'',t.sponsor||'',t.member||'',t.picFor||'',t.note||'',t.by||'']));
  dl('three-aces-books.csv',rows.map(r=>r.map(csvCell).join(',')).join('\n'));
}

      cats.map((cat,i)=>{
        const h=(hid[kind]||[]).includes(cat);

      }).join('')+

      <button class="btn gray" onclick="catAdd('${kind}')">＋ Add ${label.toLowerCase()} category</button>`;

    <p class="muted">▲▼ set the order they appear in the report and the entry form. Hide what no longer applies — it disappears from the report rows and the entry form, but any old entries keep showing with their amounts. Rename updates every past entry too. Delete only works if a category was never used.</p>
    ${sec('income','Income')}${sec('expense','Expense')}
    <p class="muted" style="margin-top:10px">The <b>members</b> button on an expense category decides whether members can
      pick it when they file their own expense claim from the Club tab. Tick the ones they should see — park fees,

/* v3.18 — which expense categories members may pick when filing their own claim.
   Stored as an explicit list in S.finance.catsMember. Until the first tick is made
   there is no list at all, and finMemberCats() falls back to "every visible expense
   category", so the feature works out of the box with nothing to configure. */
async function catMemberTog(i){
  const cat=S.finance.cats.expense[i];
  let list=[...finMemberCats()];
  if(list.includes(cat)) list=list.filter(c=>c!==cat); else list.push(cat);
  await DB.set(['finance','catsMember'],list);
  toast(list.includes(cat)?'Members can now pick "'+cat+'"':'Hidden from members: "'+cat+'"');
  manageCatsModal();
}
async function catAdd(kind){
  const v=$('mcNew_'+kind).value.trim();
  if(!v){ toast('Type the category name',1); return; }
  const cats=[...(S.finance.cats[kind]||[])];
  if(cats.includes(v)){ toast('That category already exists',1); return; }
  await DB.set(['finance','cats',kind],cats.concat(v));
  toast('Category added'); manageCatsModal();
}
async function catMove(kind,i,dir){
  const cats=[...S.finance.cats[kind]]; const j=i+dir;
  if(j<0||j>=cats.length) return;
  [cats[i],cats[j]]=[cats[j],cats[i]];
  await DB.set(['finance','cats',kind],cats);
  manageCatsModal();
}
async function catHide(kind,i,hide){
  const cat=S.finance.cats[kind][i];
  let list=[...(((S.finance.catsHidden||{})[kind])||[])];
  if(hide==='true'||hide===true){ if(!list.includes(cat)) list.push(cat); }
  else list=list.filter(x=>x!==cat);
  await DB.set(['finance','catsHidden',kind],list);
  manageCatsModal();
}
function catDelete(kind,i){
  const cat=S.finance.cats[kind][i];
  if(Object.values(S.finance.txns||{}).some(t=>t.cat===cat)){
    toast('"'+cat+'" has entries — hide it instead',1); return; }
  pinConfirm('Delete the '+(kind==='income'?'income':'expense')+' category "'+cat
    +'"? It was never used, so no figures move — but it disappears from the entry form and the report rows.',
    ()=>catDeleteGo(kind,cat));
}
async function catDeleteGo(kind,cat){
  await DB.set(['finance','cats',kind],(S.finance.cats[kind]||[]).filter(x=>x!==cat));
  await DB.set(['finance','catsHidden',kind],(((S.finance.catsHidden||{})[kind])||[]).filter(x=>x!==cat));
  manageCatsModal();
}
function catRename(kind,i){
  const cat=S.finance.cats[kind][i];
  const el=$('mc_'+kind+'_'+i);
  el.outerHTML=`<span style="display:flex;gap:6px;align-items:center"><input id="mcEdit" value="${esc(cat)}">
    <button class="btn small" onclick="catRenameSave('${kind}',${i})">✓</button></span>`;
  $('mcEdit').focus();
}
async function catRenameSave(kind,i){
  const old=S.finance.cats[kind][i], nv=$('mcEdit').value.trim();
  if(!nv){ toast('Name required',1); return; }
  const cats=[...S.finance.cats[kind]]; cats[i]=nv;
  await DB.set(['finance','cats',kind],cats);
  const hid=(((S.finance.catsHidden||{})[kind])||[]);
  if(hid.includes(old)) await DB.set(['finance','catsHidden',kind],hid.map(x=>x===old?nv:x));
  for(const [id,tx] of Object.entries(S.finance.txns||{}))
    if(tx.cat===old) await DB.set(['finance','txns',id,'cat'],nv);
  toast('Renamed — all past entries updated'); manageCatsModal();
}
function feInvoicePick(inp){
  const f=inp.files&&inp.files[0]; if(!f) return;
  if(!(f.type||'').startsWith('image/')){
    // PDF / Word / any document — stored as-is (no compression possible)
    // v3.21 — a document cannot be squeezed, so the ceiling on one has to be
    // low enough that the database does not fill up with them.
    if(f.size>2*1024*1024){ toast('That file is '+sizeLabel(f.size)+' — too big. Keep documents under 2 MB, or take a photo of it instead',1); inp.value=''; return; }
    const rd=new FileReader();
    rd.onload=()=>{
      window._feInvNew={name:f.name||'invoice', type:f.type||'application/octet-stream', data:rd.result};
      const pv=$('feInvPrev'); if(pv) pv.style.display='none';
      const nm=$('feInvName'); if(nm){ nm.textContent='📄 '+f.name+' — attached ('+sizeLabel(dataUrlBytes(rd.result))+')'; nm.style.display='block'; }
      toast('Attached — '+sizeLabel(dataUrlBytes(rd.result)));
    };
    rd.readAsDataURL(f); inp.value=''; return;
  }
  const rd=new FileReader();
  rd.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      /* v3.21 — SQUEEZE HARDER.
         A phone photo off a modern camera is 3–6 MB. The old settings (1200px,
         quality 0.8, stop under 450 KB, three tries) still left half a megabyte
         per receipt sitting in the database forever. An invoice only has to be
         READABLE, not printable: 1000px on the long edge is plenty to read a
         total off, and the target is now 200 KB. We step the size and the
         quality down together over more passes, and take the last result if
         even that will not get there — a big attachment beats a lost one.   */
      const MAXPX=1000, TARGET=200000;
      const before=dataUrlBytes(rd.result);
      let mx=MAXPX, q=0.72, data='', k=0;
      for(k=0;k<6;k++){
        const sc=Math.min(1,mx/Math.max(img.width,img.height));
        const cv=document.createElement('canvas');
        cv.width=Math.max(1,Math.round(img.width*sc)); cv.height=Math.max(1,Math.round(img.height*sc));
        const cx=cv.getContext('2d');
        cx.fillStyle='#fff'; cx.fillRect(0,0,cv.width,cv.height);   // no black edges on a transparent PNG
        cx.drawImage(img,0,0,cv.width,cv.height);
        data=cv.toDataURL('image/jpeg',q);
        if(data.length<TARGET) break;
        mx=Math.round(mx*0.8); q=Math.max(0.45,Math.round((q-0.07)*100)/100);
      }
      const after=dataUrlBytes(data);
      window._feInvNew={name:f.name||'photo.jpg', type:'image/jpeg', data};
      const nm=$('feInvName'); if(nm) nm.style.display='none';
      const pv=$('feInvPrev'); if(pv){ pv.src=data; pv.style.display='block'; }
      // Say what it did. People want to know the photo went in, and the club
      // wants to see that the shrinking is actually working.
      toast(before>after
        ? 'Photo attached — shrunk from '+sizeLabel(before)+' to '+sizeLabel(after)
        : 'Photo attached — '+sizeLabel(after));
    };
    img.src=rd.result;
  };
  rd.readAsDataURL(f); inp.value='';
}
async function viewInvoice(id){
  const tx=S.finance.txns[id];
  if(!tx||!tx.invoice) return;
  const head=`<h3><button class="x" onclick="closeModal()">✕</button>📎 ${esc(tx.cat)} — ${fmt(tx.amount)} · ${new Date(tx.ts).toLocaleDateString('en-CA')}</h3>`;
  const note=tx.note?'<p class="muted">'+esc(tx.note)+'</p>':'';
  if(String(tx.invoice).startsWith('data:')){   // older photo entries — stored inline
    openModal(head+`<img src="${tx.invoice}" style="width:100%;border-radius:10px">`+note); return;
  }
  openModal(head+'<div class="empty">Loading the attachment…</div>');
  const fobj=await fileLoad(String(tx.invoice).slice(5));
  if(!fobj||!fobj.data){ openModal(head+'<div class="empty">Could not load the attachment — check the connection and try again.</div>'+note); return; }
  const dl=`<a class="btn gray" style="display:block;text-align:center;text-decoration:none;margin-top:8px" href="${fobj.data}" download="${esc(fobj.name||'invoice')}">⬇ Download ${esc(fobj.name||'file')}</a>`;
  if((fobj.type||'').startsWith('image/'))
    openModal(head+`<img src="${fobj.data}" style="width:100%;border-radius:10px">`+note+dl);
  else if(fobj.type==='application/pdf')
    openModal(head+`<embed src="${fobj.data}" type="application/pdf" style="width:100%;height:60vh;border-radius:10px"><p class="muted noprint">If the preview is blank on this phone, use Download below.</p>`+note+dl);
  else
    openModal(head+`<div class="card">📄 <b>${esc(fobj.name||'document')}</b><br><span class="muted">Word / document file — download it to open.</span></div>`+note+dl);
}

/* --------------------------- ATTENDANCE ------------------------------------
   Monthly meeting register, with the FULL 2013-2026 history imported from the
   Excel sheet. Months are entered via dropdowns and SAVED (locked) — changing
   a saved month requires the admin's PIN.                                    */
let attYear=new Date().getFullYear(), attShowPast=false, _attInit=false;
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function attRoster(){ return (S.attendance&&S.attendance.roster)||ATT_SEED.roster; }
function attVisible(){ return attRoster().filter(r=>!r.hidden); }
// Who is actually expected at a meeting. The point-of-sale person is on the
// roster so they can be paid and tracked, but they don't take attendance.
function attMembers(){ return attVisible().filter(r=>!isStaffRow(r)); }
function attStaff(){ return attVisible().filter(r=>isStaffRow(r)); }
/* The patch requirement was dropped, so NP is no longer something you can pick.
   It stays readable wherever it was already recorded — the old years are the
   club's history and nothing is rewritten.                                   */
const MARK_CODES=['P','L','AN','A'];
const MARK_LABEL={P:'Present',L:'Late',A:'Absent',AN:'Absent — with notice',NP:'No patch'};
function attHasNP(){
  return Object.values(((S.attendance||{}).years)||{}).some(yy=>
    Object.values(yy.marks||{}).some(mm=>Object.values(mm).some(v=>v==='NP')));
}
function attLegendHTML(){
  return 'P = present · L = late · AN = absent with notice · A = absent'
    + (attHasNP()? ' · NP = no patch — retired, kept on the older years only':'');
}
function attendHTML(){
  if(!S.attendance){
    if(!_attInit){ _attInit=true; DB.set(['attendance'],ATT_SEED).then(()=>rerender()); }
    return '<div class="empty">Opening the attendance register…</div>';
  }
  const A=S.attendance;
  if(!A.baseline){   // upgraded from the first, 2026-only version
    return `<div class="card" style="border-color:var(--gold)">
      <b>📥 Full history available</b>
      <p class="muted">I parsed the complete Excel attendance record — every month from 2013 to 2026 for all 16 members, plus the fees/cash totals. Load it? (Any marks you already entered for 2026 are kept.)</p>
      <button class="btn" onclick="attUpgrade()">Import the full 2013–2026 register</button></div>`;
  }
  const nowY=new Date().getFullYear();
  const years=[...new Set(Object.keys(A.years||{}).map(Number).concat([nowY]))].sort();
  if(attYear!=='ALL' && !years.includes(attYear)) attYear=nowY;
  const cls=c=>c==='P'?'attP':c==='L'?'attL':c==='A'?'attA':c==='AN'?'attAN':c==='NP'?'attNP':'dim';
  const vis=attVisible(), hid=attRoster().filter(r=>r.hidden);
  const mem=attMembers(), stf=attStaff();
  // The patch requirement is gone — only carry an NP column if the old years used it.
  const npCol=attHasNP();
  // lifetime totals computed from EVERY imported year + baseline fees/cash
  const life={};
  attRoster().forEach(r=>life[r.id]={P:0,L:0,AN:0,A:0,NP:0});
  Object.values(A.years||{}).forEach(yy=>Object.entries(yy.marks||{}).forEach(([mid,mm])=>{
    if(!life[mid]) return;
    Object.values(mm).forEach(v=>{ if(life[mid][v]!==undefined) life[mid][v]++; });
  }));
  const bl=A.baseline||{};
  const tot={P:0,L:0,AN:0,A:0,NP:0,owed:0,paid:0,cash:0};
  attRoster().forEach(r=>{ const c=life[r.id], b=bl[r.id]||{owed:0,paid:0,cash:0};
    ['P','L','AN','A','NP'].forEach(k=>tot[k]+=c[k]); tot.owed+=b.owed; tot.paid+=b.paid; tot.cash+=b.cash; });
  const yearBtns=`<div class="payrow noprint" style="flex-wrap:wrap">
      ${years.map(y=>`<button class="${attYear===y?'on':''}" style="flex:1 1 12%;padding:9px 4px" onclick="attYear=${y};rerender()">${y}</button>`).join('')}
      <button class="${attYear==='ALL'?'on':''}" style="flex:1 1 12%;padding:9px 4px" onclick="attYear='ALL';rerender()">All</button>
    </div>`;
  let gridSection;
  if(attYear==='ALL'){
    // the FULL register, newest year first — read-only, includes past members
    gridSection=`<p class="muted">The whole register, every year — past members included, so nobody is missed.
      Read-only here: pick a single year above to enter or change a month. ${attLegendHTML()}</p>`+
      years.slice().reverse().map(yr=>{
        const Yy=(A.years||{})[String(yr)]||{}; const mk=Yy.marks||{}, nt=Yy.notes||{};
        const rows=attRoster().filter(r=>mk[r.id]&&Object.values(mk[r.id]).some(v=>v));
        if(!rows.length) return '';
        return `<h2>${yr}</h2><div class="gridwrap"><table class="stockgrid">
          <tr><th class="itc">Member</th>${MONTHS.map((m,i)=>`<th class="sz">${m}${nt['m'+(i+1)]?' ✱':''}</th>`).join('')}<th class="r">P</th></tr>
          ${rows.map(r=>{ const row=mk[r.id]||{}; const p=Object.values(row).filter(v=>v==='P').length;
            return `<tr><td class="itc">${esc(r.name)}${r.hidden?' <span class="muted">(past)</span>':''}</td>${MONTHS.map((m,i)=>{
              const v=row['m'+(i+1)]||''; return `<td class="c attcell ${cls(v)}">${v||'·'}</td>`;}).join('')}<td class="r"><b>${p}</b></td></tr>`;}).join('')}
        </table></div>`+
        (Object.keys(nt||{}).length?`<div class="card">${MONTHS.map((m,i)=>nt['m'+(i+1)]?
          `<div style="padding:4px 0"><b>${m}</b> — ${esc(nt['m'+(i+1)])}</div>`:'').join('')}</div>`:'');
      }).join('');
  } else {
    const Y=(A.years||{})[String(attYear)]||{marks:{},notes:{},locked:{}};
    const marks=Y.marks||{}, notes=Y.notes||{}, locked=Y.locked||{};
    // minutes = what was covered at the meeting (goes out to whoever missed it)
    // mnotes  = why one particular member was away that month
    const minutes=Y.minutes||{}, mnotes=Y.mnotes||{};
    gridSection=`<p class="muted">Tap a month to enter or view it. 🔒 = saved &amp; locked — changing it asks for your PIN.
    ${attLegendHTML()}</p>
    <div class="gridwrap"><table class="stockgrid">
      <tr><th class="itc">Member</th>${MONTHS.map((m,i)=>
        `<th class="sz" onclick="attMonthOpen(${i+1})">${m}${notes['m'+(i+1)]?' ✱':''}${locked['m'+(i+1)]?' 🔒':''}<br><span style="font-weight:400;font-size:9px;opacity:.75">${meetDate(attYear,i+1).getDate()}</span></th>`).join('')}<th class="r">P</th></tr>
      ${mem.map(r=>{
        const row=marks[r.id]||{};
        const pCount=Object.values(row).filter(v=>v==='P').length;
        return `<tr><td class="itc">${esc(r.name)}</td>${MONTHS.map((m,i)=>{
          const v=row['m'+(i+1)]||'';
          return `<td class="c attcell ${cls(v)}" onclick="attMonthOpen(${i+1})">${v||'·'}</td>`;
        }).join('')}<td class="r"><b>${pCount}</b></td></tr>`;
      }).join('')}
    </table></div>
    ${(()=>{
      /* ---- MEETING BY MEETING, the admin's copy -------------------------------
         Members each get their own missed-meeting page and see only their own
         reason for being away. The admin runs the register, so this is the whole
         picture in one place: who was away that month, why each of them was away,
         what was covered, and the admin-only register note.                      */
      const nameOf=id=>(attRoster().find(r=>r.id===id)||{}).name||'—';
      const all=mem.concat(stf,hid);
      const cards=MONTHS.map((m,i)=>{
        const k='m'+(i+1), mn=minutes[k]||'', nt=notes[k]||'', per=mnotes[k]||{};
        // Anybody on the register — hidden or since moved to staff — who was marked
        // away that month. Their history stays readable even after they move.
        const away=all.filter(r=>{ const v=(marks[r.id]||{})[k]; return v==='A'||v==='AN'; })
          .map(r=>({r, v:(marks[r.id]||{})[k], why:per[r.id]||''}));
        const marked=all.filter(r=>(marks[r.id]||{})[k]).length;
        // A reason written against somebody who was not marked away — keep it visible
        // rather than quietly dropping it.
        const stray=Object.entries(per).filter(([id,v])=>v&&!away.some(a=>a.r.id===id)&&all.some(r=>r.id===id));
        if(!mn&&!nt&&!away.length&&!stray.length&&!marked) return '';
        return `<div class="card"><b>${m} ${attYear}</b> <span class="muted">${meetDate(attYear,i+1).toLocaleDateString('en-CA',{weekday:'short',month:'short',day:'numeric'})}${locked[k]?' 🔒':''}</span>
          ${marked?`<div style="margin-top:6px"><b class="${away.length?'neg':'pos'}">${away.length?away.length+' away':'Full house'}</b>
            <span class="muted">· ${marked-away.length} of ${marked} marked in</span></div>`:''}
          ${away.length?`<table style="margin-top:6px"><tr><th>Away</th><th>Mark</th><th>Reason on the register</th></tr>
            ${away.map(a=>`<tr><td>${esc(a.r.name)}${isStaffRow(a.r)?' <span class="memberflag">STAFF</span>':''}${a.r.hidden?' <span class="memberflag">OFF REGISTER</span>':''}</td>
              <td>${MARK_LABEL[a.v]||a.v}</td>
              <td>${a.why?esc(a.why):'<span class="muted">— none written —</span>'}</td></tr>`).join('')}
          </table>`:''}

async function attUpgrade(){
  const old=S.attendance||{};
  const seed=JSON.parse(JSON.stringify(ATT_SEED));
  // keep anything already entered for 2026 that the import doesn't cover
  const old26=((old.years||{})['2026'])||{};
  const seed26=seed.years['2026'];
  Object.entries(old26.marks||{}).forEach(([mid,mm])=>{
    seed26.marks[mid]=Object.assign({}, seed26.marks[mid]||{}, mm); });
  Object.assign(seed26.notes=seed26.notes||{}, old26.notes||{});
  Object.assign(seed26.locked=seed26.locked||{}, old26.locked||{});
  await DB.set(['attendance'],seed);
  toast('Full 2013–2026 register imported'); rerender();
}

async function attMonthSave(month){
  const y=String(attYear);
  for(const sel of document.querySelectorAll('#modalBox .attSel')){
    await DB.set(['attendance','years',y,'marks',sel.dataset.id,'m'+month], sel.value||null);
  }
  // Each member's own reason for being away — written once, seen only by them.
  for(const inp of document.querySelectorAll('#modalBox .attWhy')){
    await DB.set(['attendance','years',y,'mnotes','m'+month,inp.dataset.id], inp.value.trim()||null);
  }
  await DB.set(['attendance','years',y,'minutes','m'+month], $('attMin').value.trim()||null);
  await DB.set(['attendance','years',y,'notes','m'+month], $('attMNote').value.trim()||null);
  await DB.set(['attendance','years',y,'locked','m'+month], true);
  closeModal(); toast(MONTHS[month-1]+' saved & locked'); rerender();
}

// Marking somebody staff takes them off the attendance grid and the sponsor

function lastWed(y,mi){ const d=new Date(y,mi,0); d.setDate(d.getDate()-((d.getDay()+4)%7)); return d; }
function meetDate(y,mi){
