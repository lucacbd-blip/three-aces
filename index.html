/* ------------------------------- READING --------------------------------- */
function picYearKey(){ return ((S.picnic||{}).cur)||''; }
function picY(){ const P=S.picnic; if(!P||!P.cur) return null; return ((P.years||{})[P.cur])||null; }
function picOn(){ return !!picY(); }
function picYearList(){ return Object.keys(((S.picnic||{}).years)||{}).sort().reverse(); }

function picItems(){ const y=picY(); if(!y) return [];
  return Object.entries(y.items||{}).sort((a,b)=>(a[1].order||0)-(b[1].order||0)); }
function picJobs(){ const y=picY(); if(!y) return [];
  return Object.entries(y.jobs||{}).sort((a,b)=>(a[1].order||0)-(b[1].order||0)); }
function picSlots(){ const y=picY(); if(!y) return [];
  return Object.entries(y.slots||{}).sort((a,b)=>
    (picMins(a[1].start)-picMins(b[1].start)) || ((a[1].order||0)-(b[1].order||0))); }

// A slot with no start time sorts to the very bottom, where "time to be decided" belongs.
function picMins(hhmm){
  const m=/^(\d{1,2}):(\d{2})$/.exec(String(hhmm||''));
  return m? (+m[1])*60+(+m[2]) : 99999;
}
function picClock(hhmm){
  const m=/^(\d{1,2}):(\d{2})$/.exec(String(hhmm||''));
  if(!m) return '';
  let h=+m[1]; const ap=h>=12?'pm':'am'; h=h%12||12;
  return h+':'+m[2]+ap;
}
function picWhen(s){
  const a=picClock(s.start), b=picClock(s.end);
  if(!a) return 'Time to be decided';
  return b? a+' – '+b : a+' onwards';
}

// Counted at all? An absent `have` means nobody has been to that bin yet.
function picIsCounted(it){ return it && it.have!=null; }
function picCountedN(){ return picItems().filter(([,i])=>picIsCounted(i)).length; }
// How many to buy. An uncounted item is NEVER short — we simply do not know yet.
function picShortOf(it){
  if(!picIsCounted(it)) return 0;
  const d=(+it.need||0)-(+it.have||0);
  return d>0? d : 0;
}
function picBuyList(){ return picItems().filter(([,i])=>picShortOf(i)>0); }
function picTotalOf(it){
  const per=+it.per||0; if(!per) return 0;
  return per*(picIsCounted(it)?(+it.have||0):(+it.need||0));
}
function picNeedLabel(it){
  const u=it.unit?' '+it.unit:'';
  let s='Need '+(+it.need||0)+u;
  if(+it.per) s+=' · '+it.per+' per '+(it.unit? it.unit.replace(/s$/,'') : 'pack')+' ≈ '+((+it.need||0)*(+it.per)).toLocaleString('en-CA');
  return s;
}

function picSameName(a,b){ return (a||'').trim().toLowerCase()===(b||'').trim().toLowerCase(); }
/* v3.21 — MORE THAN ONE NAME ON A JOB.
   `j.who` stays a plain string on the record, but it is now read as a
   comma-separated list. That is deliberate: every job written by every earlier
   version holds exactly one name, and a one-name string parses to a one-name
   list, so nothing has to be migrated and an old backup still restores clean.
   Luca's rule for a shared job: it is ONE job, not one each. Whoever ticks it
   ticks it for everybody, and `doneBy` records which of them did it.        */
function picWhoList(j){
  return String((j&&j.who)||'').split(',').map(s=>s.trim()).filter(Boolean);
}
function picWhoLabel(j){ const l=picWhoList(j); return l.length? l.join(', ') : 'Anyone'; }
function picJobHasName(j,name){ return picWhoList(j).some(n=>picSameName(n,name)); }
function picJobsOf(name){ return picJobs().filter(([,j])=>picJobHasName(j,name)); }
function picDoneN(list){ return (list||picJobs()).filter(([,j])=>!!j.done).length; }
// Everyone who has a job, plus every user of the app, so an admin can hand a
// job to somebody who has never had one before.
function picPeople(){
  const seen=[], add=n=>{ n=(n||'').trim(); if(n && !seen.some(x=>picSameName(x,n))) seen.push(n); };
  picJobs().forEach(([,j])=>picWhoList(j).forEach(add));
  Object.values(S.users||{}).forEach(u=>add(u.name));
  return seen.sort((a,b)=>a.localeCompare(b));
}
function picMayTick(j){ return isAdmin() || (meU() && picJobHasName(j, meU().name)); }
/* A job with a name on it that matches nobody's login is a job that only an
   admin can ever tick. That is a silent trap — the person is on the list, they
   just never see it — so the Jobs screen says who is missing a login.       */
function picNoLogin(){
  const users=Object.values(S.users||{}).filter(u=>u.active!==false).map(u=>u.name||'');
  return [...new Set(picJobs().flatMap(([,j])=>picWhoList(j)))]
    .filter(n=>!users.some(u=>picSameName(u,n))).sort();
}

/* ------------------------------- v3.20: BINS ------------------------------
   A bin is not a record you have to create before you can use it — it is just
   a number stamped on an item. But an EMPTY bin has to be able to exist too,
   otherwise you cannot make the eighth one until you already have something to
   put in it, which is backwards. So the list of bins is the union of the bins
   items actually sit in and the bins somebody has declared.                 */
function picBinRecs(){ return ((picY()||{}).bins)||{}; }
function picBins(){
  const used=picItems().map(([,i])=>+i.bin||0);
  const named=Object.keys(picBinRecs()).map(Number);
  return [...new Set(used.concat(named))].filter(n=>n>0).sort((a,b)=>a-b);
}
function picBinName(n){ const b=picBinRecs()[String(n)]; return (b&&b.name)||''; }
function picBinTitle(n){ const nm=picBinName(n); return 'Bin '+n+(nm? ' · '+nm : ''); }
function picBinItems(n){ return picItems().filter(([,i])=>(+i.bin||0)===+n); }
function picNextBin(){ const b=picBins(); return (b.length? b[b.length-1] : 0)+1; }

/* Searching. Matches the name, the note and the unit, because "where are the
   blue tablecloths" and "where is the thing with the broken lid" are both
   real questions and the second one is answered by the note.               */
function picHit(it,q){
  if(!q) return true;
  return ((it.name||'')+' '+(it.note||'')+' '+(it.unit||'')).toLowerCase().includes(q);
}
function picQnorm(){ return picQ.trim().toLowerCase(); }

/* The jobs currently on screen, worked out in one place so that moving a job
   up moves it past the job you can actually SEE above it — not past some job
   hidden by the filter you happen to have on.                              */
function picJobList(){
  const all=picJobs();
  if(picWho==='out') return all.filter(([,j])=>!j.done);
  if(picWho==='done') return all.filter(([,j])=>!!j.done);
  if(picWho==='any') return all.filter(([,j])=>picWhoList(j).length===0);
  if(picWho) return picJobsOf(picWho);

}
/* Jobs a member put on the list themselves, that an admin has not looked at
   yet. Admin never has to go hunting for what appeared without them.       */

/* A member may take back a job they added themselves, as long as nobody has
   ticked it. Anything else on the list belongs to the admin.               */

  const j=((picY()||{}).jobs||{})[id], u=meU();

   should not be able to change what the club believes it owns.              */

function picStep(id, d){
  const it=((picY()||{}).items||{})[id]; if(!it) return;
  const cur=picIsCounted(it)? (+it.have||0) : 0;
  const next=cur+d;
  if(next<0){ picSetHave(id,null); return; }   // stepping below zero means "I haven't counted this"
  picSetHave(id,next);
}

/* --------------------- v3.20: MOVING THINGS BY HAND ------------------------
   Reordering re-uses the order numbers the group ALREADY holds rather than
   renumbering from zero. Order is global across every item, and the bin
   headings only work because items of one bin sit together in that global
   order — renumbering a bin from zero would scatter it through the others.
   Permuting the group's own numbers among themselves cannot do that.       */
async function picApplyOrder(kind, rows){
  if(!isAdmin()) return;
  let slots=rows.map(([,r])=>+r.order||0).sort((a,b)=>a-b);
  // Ties would make a swap a silent no-op, so spread them just enough to
  // separate without crossing into the next whole number.
  if(new Set(slots).size!==slots.length) slots=slots.map((_,k)=>slots[0]+k/1000);
  for(let k=0;k<rows.length;k++){
    if((+rows[k][1].order||0)!==slots[k])
      await DB.set(picPath().concat([kind,rows[k][0],'order']),slots[k]);
  }
  rerender();
}
function picSwap(list,id,dir){
  const i=list.findIndex(x=>x[0]===id); if(i<0) return null;
  const j=i+dir; if(j<0||j>=list.length) return null;
  const out=list.slice(); out.splice(j,0,out.splice(i,1)[0]);
  return out;
}
/* A sub-item travels with its parent. The toolkit's twelve contents are not
   twelve independent rows you would ever want to shuffle on their own.     */
function picBinBlocks(n){
  const blocks=[];
  picBinItems(n).forEach(row=>{
    if(row[1].parent && blocks.length) blocks[blocks.length-1].push(row);
    else blocks.push([row]);
  });
  return blocks;
}
async function picMoveItem(id,dir){
  if(!isAdmin()) return;
  const it=((picY()||{}).items||{})[id]; if(!it||it.parent) return;
  const blocks=picBinBlocks(+it.bin||0);
  const moved=picSwap(blocks.map(b=>[b[0][0],b[0][1]]),id,dir); if(!moved) return;
  const byHead={}; blocks.forEach(b=>byHead[b[0][0]]=b);
  await picApplyOrder('items', moved.reduce((a,[hid])=>a.concat(byHead[hid]),[]));
}
async function picMoveJob(id,dir){
  if(!isAdmin()) return;
  const moved=picSwap(picJobList(),id,dir); if(!moved) return;
  await picApplyOrder('jobs', moved);
}
function picItemMoveable(id,it,dir){
  if(it.parent) return false;
  const heads=picBinBlocks(+it.bin||0).map(b=>b[0][0]);
  const i=heads.indexOf(id);
  return dir<0? i>0 : (i>=0 && i<heads.length-1);
}
function picJobMoveable(id,dir){
  const l=picJobList(), i=l.findIndex(x=>x[0]===id);
  return dir<0? i>0 : (i>=0 && i<l.length-1);
}

async function picItemSave(id){
  if(!isAdmin()) return;
  const name=$('pi_name').value.trim();
  if(!name){ toast('Give it a name',1); return; }
  const rec={
    bin:+$('pi_bin').value||picBins()[0]||1,
    name:name,
    need:Math.max(0,Math.round(+$('pi_need').value||0)),
    order:0
  };
  const unit=$('pi_unit').value.trim(); if(unit) rec.unit=unit;
  const per=Math.round(+$('pi_per').value||0); if(per>0) rec.per=per;
  const note=$('pi_note').value.trim(); if(note) rec.note=note;
  if(id){
    const old=((picY()||{}).items||{})[id]||{};
    rec.order=old.order||0;
    if(old.parent) rec.parent=old.parent;
    if(old.have!=null){ rec.have=old.have; rec.countedTs=old.countedTs||0; rec.countedBy=old.countedBy||''; }
    await DB.set(picPath().concat(['items',id]),rec);
  }else{
    /* Land it at the bottom of ITS OWN bin, not the bottom of everything.
       Nudging by a thousandth keeps it inside that bin's stretch of the
       global order instead of jumping it past every later bin.            */
    const sib=picBinItems(rec.bin);
    rec.order = sib.length
      ? sib.reduce((m,[,i])=>Math.max(m,+i.order||0),0)+0.001
      : picItems().reduce((m,[,i])=>Math.max(m,+i.order||0),0)+1;
    await DB.push(picPath().concat(['items']),rec);
  }
  closeModal(); toast('Saved'); rerender();
}

  if(en) rec.end=en;
  const who=$('ps_who').value.trim(); if(who) rec.who=who;
  const req=$('ps_req').value.trim(); if(req) rec.req=req;
  const notes=$('ps_notes').value.trim(); if(notes) rec.notes=notes;
  if(id){

    rec.order=old.order||0;
    if(old.done){ rec.done=old.done; rec.doneBy=old.doneBy||''; }
    await DB.set(picPath().concat(['slots',id]),rec);
  }else{
    rec.order=picSlots().reduce((m,[,s])=>Math.max(m,s.order||0),0)+1;
    await DB.push(picPath().concat(['slots']),rec);
  }
  closeModal(); toast('Saved'); rerender();
}

/* ---------------- SHOPPING LIST → JOBS, AND SHARING ----------------------- */
/* v3.21 — a shopping-list job now carries the id of the item it came from.
   That stamp is what lets the To Buy tab find the job again later and show
   who is fetching it, instead of raising a second job beside the first.
   Jobs written by v3.20 have no stamp, so picBuyJobFor falls back to the
   wording those versions generated and adopts the job rather than doubling
   it up — nothing has to be migrated.                                      */
function picBuyJobText(it){
  return 'Buy '+picShortOf(it)+((it.unit)?' '+it.unit:'')+' — '+(it.name||'');
}
function picBuyJobFor(id,it){
  const jobs=picJobs();
  const open=jobs.find(([,j])=>j.buy===id && !j.done);
  if(open) return open;
  const stamped=jobs.find(([,j])=>j.buy===id);
  if(stamped) return stamped;
  const tail=' — '+((it&&it.name)||'');
  if(tail===' — ') return null;
  return jobs.find(([,j])=>!j.done && String(j.text||'').slice(0,4)==='Buy '
    && String(j.text||'').slice(-tail.length)===tail) || null;
}
async function picBuyToJobs(){
  if(!isAdmin()) return;
  const list=picBuyList();
  if(!list.length){ toast('Nothing short — nothing to buy',1); return; }
  let n=picJobs().reduce((m,[,j])=>Math.max(m,j.order||0),0), made=0;
  for(const [id,it] of list){
    if(picBuyJobFor(id,it)) continue;                               // don't double up
    await DB.push(picPath().concat(['jobs']),{text:picBuyJobText(it), who:'', buy:id,
      order:++n, note:'From the stock count · Bin '+(it.bin||'?')});
    made++;
  }
  toast(made? made+' job'+(made===1?'':'s')+' added to the shared list'
            : 'They are all on the jobs list already'); rerender();
}

/* v3.21 — handing one line of the shopping list to somebody.
   Luca's ask: assign the buy list by item, and the assignment BECOMES that
   member's job. So this does not invent a parallel kind of record — it makes
   (or re-uses) the ordinary picnic job and puts the names on it. Several
   names are allowed, same rule as any other job: one job shared, whoever
   picks it up ticks it off for the rest.                                   */
function picBuyAssign(id){

    <div class="card" style="margin:0 0 12px">
      <b>${esc(it.name||'')}</b>
      <div class="muted">${picShortOf(it)} short${it.unit?' · '+esc(it.unit):''} · bin ${esc(String(it.bin||'?'))}</div>
    </div>
    <p class="muted" style="margin:0 0 6px">Tick whoever is getting it. It goes on their jobs list
      ${ex?'— this one is already on the list, so you are just changing the names on it.'
         :'as <b>"'+esc(picBuyJobText(it))+'"</b>.'}
      Tick nobody and it sits under <b>Anyone</b>.</p>
    <div class="card" style="margin:0 0 4px;padding:4px 10px;max-height:210px;overflow:auto">
      ${people.length? people.map(n=>`<label style="display:flex;gap:8px;align-items:center;margin:6px 0;font-weight:400">
        <input type="checkbox" class="pjwho" value="${esc(n)}" ${picJobHasName(j,n)?'checked':''}
          style="width:auto" onchange="picWhoSum()">
        <span>${esc(n)}</span></label>`).join('')
        : `<p class="muted" style="margin:8px 0">Nobody to pick from yet — add members under People first.</p>`}
    </div>
    <div id="pj_whosum" class="muted" style="margin:0 0 12px"></div>
    <button class="btn" onclick="picBuyAssignSave('${id}')">${ex?'Save':'Put it on the jobs list'}</button>
    <button class="btn gray" onclick="closeModal()">Cancel</button>`);
  picWhoSum();
}
async function picBuyAssignSave(id){
  if(!isAdmin()) return;
  const it=((picY()||{}).items||{})[id]; if(!it) return;

function picExportCSV(){
  const rows=[['Bin','Item','Need','Unit','Per','Count status','In stock','To buy','Counted by','Note']];
  // A blank "in stock" cell would open in Excel as a zero, which is the exact
  // confusion this module exists to end — so the status column says it in words.
  picItems().forEach(([,it])=>rows.push([
    it.bin||'', it.name||'', it.need||0, it.unit||'', it.per||'',
    picIsCounted(it)?'counted':'NOT COUNTED', picIsCounted(it)?it.have:'', picShortOf(it)||'',
    it.countedBy||'', it.note||'']));
  rows.push([]);

    picWhoLabel(j), j.text||'', j.done?'yes':'no',
    j.done?new Date(j.done).toLocaleDateString('en-CA'):'', j.note||'']));

function picYearStats(k){
  const y=((S.picnic||{}).years||{})[k]||{};
  const items=Object.values(y.items||{}), jobs=Object.values(y.jobs||{});
  return {items:items.length, jobs:jobs.length, counted:items.filter(i=>i.have!=null).length};

async function picRollover(){
  if(!isAdmin()) return;
  const nk=String($('pr_year').value||'').trim();
  if(!/^\d{4}$/.test(nk)){ toast('Give it a four-digit year',1); return; }
  if(((S.picnic||{}).years||{})[nk]){ toast('Picnic '+nk+' already exists',1); return; }
  /* Copy from the year the admin CHOSE — which defaults to the newest one,
     not to whichever year happens to be open. Going back to look at an old
     year must never quietly become the template for the next one.         */
  const sk=(($('pr_src')||{}).value)||picNewestYear();
  const sy=((S.picnic||{}).years||{})[sk];
  if(!sy){ toast('Cannot find Picnic '+sk,1); return; }
  const srcItems=Object.entries(sy.items||{}).sort((a,b)=>(a[1].order||0)-(b[1].order||0));
  const srcJobs =Object.entries(sy.jobs ||{}).sort((a,b)=>(a[1].order||0)-(b[1].order||0));
  const srcSlots=Object.entries(sy.slots||{}).sort((a,b)=>
    (picMins(a[1].start)-picMins(b[1].start))||((a[1].order||0)-(b[1].order||0)));
  const items={}, jobs={}, slots={};
  srcItems.forEach(([id,it])=>{
    const n={bin:it.bin, name:it.name, need:it.need, order:it.order||0};
    if(it.unit) n.unit=it.unit;
    if(it.per) n.per=it.per;
    if(it.note) n.note=it.note;
    if(it.parent) n.parent=it.parent;
    // last year's count is this year's opening stock — that is the whole point
    if(picIsCounted(it)){ n.have=it.have; n.countedTs=it.countedTs||0; n.countedBy=it.countedBy||''; }
    items[id]=n;
  });
  srcJobs.forEach(([id,j])=>{
    const n={text:j.text, who:j.who||'', order:j.order||0};
    if(j.due) n.due=j.due;
    if(j.note) n.note=j.note;
    jobs[id]=n;                       // deliberately NOT copying done/doneBy,
  });                                 // nor the member-added flag — it is old news now
  srcSlots.forEach(([id,s])=>{
    const n={title:s.title, order:s.order||0};
    if(s.start) n.start=s.start;
    if(s.end) n.end=s.end;
    if(s.who) n.who=s.who;
    if(s.req) n.req=s.req;
    if(s.notes) n.notes=s.notes;
    slots[id]=n;
  });
  const rec={label:'Picnic '+nk, date:$('pr_date').value||'', items, jobs, slots, made:Date.now(),
             from:sk};
  if(sy.bins) rec.bins=JSON.parse(JSON.stringify(sy.bins));   // the bins come too
  await DB.set(['picnic','years',nk],rec);
  await DB.set(['picnic','cur'],nk);
  closeModal(); toast('Picnic '+nk+' started from '+sk); picTab='supplies'; rerender();
}

function picDaysAway(){
  const y=picY(); if(!y||!y.date) return '';
  const d=new Date(y.date+'T12:00:00'); if(isNaN(d)) return '';
  const t=new Date(); t.setHours(12,0,0,0);
  const n=Math.round((d-t)/86400000);
  if(n===0) return 'today';
  if(n>0) return n+' day'+(n===1?'':'s')+' away';
  return Math.abs(n)+' day'+(n===-1?'':'s')+' ago';
}

/* ========================= THE SAVE-THE-DATE CARD =========================
   Draws the club's save-the-date as a JPEG, straight from the picnic date.
   Everything it needs is embedded below — five display faces (each cut down to
   only the characters this card can ever use) and the club logo. No internet,

/* The five looks for the two big lines. `k` scales the lettering, because a
   condensed face at 118px reads much smaller than a fat slab at 118px. */
const SD_FONTS = {
  rye:      { label:'Western — the one we have always used', face:'SdRye',      k:1.00 },
  slab:     { label:'Circus — heavy and loud',               face:'SdSlab',     k:0.90 },
  bebas:    { label:'Modern — tall and clean',               face:'SdBebas',    k:1.30 },
  cinzel:   { label:'Roman — carved capitals',               face:'SdCinzel',   k:0.95 },
  playfair: { label:'Elegant — like a wedding invitation',   face:'SdPlayfair', k:1.00 }
};
const SD_FONT_DEFAULT = 'rye';

function sdFontKey(k){ return SD_FONTS[k] ? k : SD_FONT_DEFAULT; }

let _sdAssets=null;
function sdLoadAssets(){
  if(!_sdAssets){
    _sdAssets = (async ()=>{
      const src = { SdRye:RYE_B64, SdCinzel:CINZEL_B64, SdPlayfair:PLAYFAIR_B64,
                    SdSlab:SLAB_B64, SdBebas:BEBAS_B64 };
      await Promise.all(Object.keys(src).map(async n=>{
        const ff = new FontFace(n, 'url(data:font/woff2;base64,'+src[n]+') format("woff2")');
        await ff.load(); document.fonts.add(ff);
      }));
      const img = new Image();
      await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; img.src='data:image/png;base64,'+LOGO_B64; });
      return img;
    })();
  }
  return _sdAssets;
}

const SD_SANS = '"Carlito","Calibri","Segoe UI",Arial,Helvetica,sans-serif';

// The two display lines — solid black, shrunk to fit if the wording runs long.
function sdWestern(ctx, txt, cx, y, size, maxW, face){
  face = face || 'SdRye';
  ctx.font = size+'px '+face;
  let w = ctx.measureText(txt).width;
  if(w > maxW){ size = Math.floor(size*maxW/w); ctx.font = size+'px '+face; w = ctx.measureText(txt).width; }
  ctx.fillStyle = '#000';
  ctx.fillText(txt, cx - w/2, y);
}

function sdOrdSuffix(n){
  n = parseInt(n,10)||0;
  const r100 = n%100, r10 = n%10;
  if(r100>=11 && r100<=13) return 'TH';
  return r10===1?'ST':r10===2?'ND':r10===3?'RD':'TH';
}

function sdDateLine(iso){
  if(!iso) return '';
  const p = String(iso).split('-');
  if(p.length<3) return String(iso).toUpperCase();
  const d = new Date(+p[0], +p[1]-1, +p[2]);
  if(isNaN(d)) return String(iso).toUpperCase();
  const days = ['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
  const mon  = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
  return days[d.getDay()]+' '+mon[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear();
}

/* opts: { date:'2027-07-25', ordinal:10, font:'rye', event:'ANNUAL PICNIC',
           club:'THREE ACES', sub:'Italian Canadian Cultural Club', scale:1.6 } */
async function sdRender(canvas, opts){
  const logo = await sdLoadAssets();
  const o = Object.assign({ event:'ANNUAL PICNIC', club:'THREE ACES',
    sub:'Italian Canadian Cultural Club', font:SD_FONT_DEFAULT, scale:0 }, opts||{});

  const F = SD_FONTS[sdFontKey(o.font)];
  const DW = 1120, DH = 560;
  const k  = o.scale || 1.6;

  canvas.width = Math.round(DW*k); canvas.height = Math.round(DH*k);
  const ctx = canvas.getContext('2d');
  ctx.setTransform(k,0,0,k,0,0);
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,DW,DH);
  ctx.textBaseline = 'alphabetic';

  const cx = DW/2, maxW = DW - 140;
  let y = 152;

  // line 1 — SAVE THE DATE
  sdWestern(ctx, 'SAVE THE DATE', cx, y, Math.round(118*F.k), maxW, F.face);

  // line 2 — THREE ACES  Italian Canadian Cultural Club
  y += 87;
  ctx.font = '60px '+SD_SANS;  const wBig = ctx.measureText(o.club).width;
  ctx.font = '31px '+SD_SANS;  const wSub = ctx.measureText(' '+o.sub).width;
  let x = cx - (wBig+wSub)/2;
  ctx.fillStyle = '#000';
  ctx.font = '60px '+SD_SANS; ctx.fillText(o.club, x, y); x += wBig;
  ctx.font = '31px '+SD_SANS; ctx.fillText(' '+o.sub, x, y);

  // line 3 — [logo] 10TH ANNUAL PICNIC
  y += 133;
  const lh = 162, lw = Math.round(lh*logo.width/logo.height);
  const num = String(o.ordinal||''), suf = num ? sdOrdSuffix(num) : '';
  ctx.font = '100px '+SD_SANS; const wNum = num ? ctx.measureText(num).width : 0;
  ctx.font = '42px '+SD_SANS;  const wSuf = suf ? ctx.measureText(suf).width : 0;
  ctx.font = '76px '+SD_SANS;  const wEv  = ctx.measureText(' '+o.event).width;
  x = cx - (lw + wNum + wSuf + wEv)/2;
  ctx.drawImage(logo, x, y - 106, lw, lh); x += lw;
  ctx.fillStyle = '#000';
  if(num){
    ctx.font = '100px '+SD_SANS; ctx.fillText(num, x, y); x += wNum;
    ctx.font = '42px '+SD_SANS;  ctx.fillText(suf, x, y - 58); x += wSuf;
  }
  ctx.font = '76px '+SD_SANS; ctx.fillText(' '+o.event, x, y);

  // line 4 — SUNDAY JULY 25, 2027
  y += 135;
  sdWestern(ctx, sdDateLine(o.date), cx, y, Math.round(78*F.k), maxW, F.face);

  return canvas;
}

/* --- which picnic is this? -------------------------------------------------
   2026 was the 9th, so the year minus 2017 gives the number and it rolls over
   on its own every year. If the club ever skips a year the number can be typed
   in by hand on the date sheet, and that typed number wins from then on. */
const PIC_ORD_EPOCH = 2017;
function picOrdinalFor(key, yearRec){
  const saved = yearRec && yearRec.ordinal;
  if(saved) return parseInt(saved,10)||0;
  const n = parseInt(key,10);
  return n ? n - PIC_ORD_EPOCH : 0;
}
function picOrdinal(){ return picOrdinalFor(picYearKey(), picY()||{}); }

/* Redrawing only the list, not the whole screen, so typing in the search box
   does not tear the box out from under the caret. The two possible lists —
   the admin's and the member's — can both be sitting in the page at once, so
   they are addressed by their own ids rather than by whichever comes first. */
function picStockRedraw(live){
  const sfx=live?'a':'m', el=$('picStockList_'+sfx);
  if(!el){ rerender(); return; }
  el.innerHTML=picStockBody(!!live);
}
/* The poll redraws everything every few seconds, which throws the search box
   away and the caret with it. So look at the live page BEFORE the redraw,
   remember which box had the caret and where it was sitting, and put it back
   afterwards — otherwise a slow typist loses a word every three seconds.
   Reading it off the DOM rather than off a focus handler is deliberate:
   taking an element out of the page fires `blur`, so a flag kept by a blur
   handler has already been wiped by the time you come to use it.           */
function picFocusSnap(){
  const el=document.activeElement;
  if(!el || !/^picSearch_/.test(el.id||'')) return null;
  let at=null; try{ at=el.selectionStart; }catch(e){}
  return {id:el.id, at:(at==null? (el.value||'').length : at)};
}
function picRefocus(snap){
  if(!snap) return;
  const el=$(snap.id); if(!el || el===document.activeElement) return;
  el.focus();
  try{ el.setSelectionRange(snap.at, snap.at); }catch(e){}
}
function picStockBody(live){
  const q=picQnorm();
  let list=picItems();
  if(picFilt==='un') list=list.filter(([,i])=>!picIsCounted(i));
  else if(picFilt==='short') list=list.filter(([,i])=>picShortOf(i)>0);
  if(q) list=list.filter(([,i])=>picHit(i,q));

  // A search is a "where is it" question, so it always answers as a flat list
  // with the bin spelled out — never as drawers you would have to open.
  if(q || picStockView==='list') return picFlatHTML(list,live,q);

  const bins=picBins();
  if(!bins.length) return '<div class="empty">No bins yet. Tap <b>＋ New bin</b> to make the first one.</div>';
  return bins.map(n=>{
    const rows=list.filter(([,i])=>(+i.bin||0)===+n);
    const own=picBinItems(n);
    const sh=own.filter(([,i])=>picShortOf(i)>0).length;
    const un=own.filter(([,i])=>!picIsCounted(i)).length;
    const open=picOpen[n]===true;
    const meta=[own.length+' item'+(own.length===1?'':'s'),
      un? un+' not counted':'', sh? '<b>'+sh+' short</b>':''].filter(Boolean).join(' · ');
    return `<div class="card" style="padding:0 12px">
      <div class="picbinhd" onclick="picBinToggle(${n},${live?1:0})">
        <span class="picchev">${open?'▾':'▸'}</span>
        <span class="picbinnm">${esc(picBinTitle(n))}</span>
        <span class="picbinct">${meta}</span>
        <button class="picx picprt" title="Print a label for this bin"
          onclick="event.stopPropagation();picPrintBinLabels(${n})">🖨</button>
        ${live?`<button class="picx" onclick="event.stopPropagation();picBinSheet('${n}')">✎</button>`:''}
      </div>
      ${open? `<div class="picbinbody">${rows.length
          ? picRowBlocks(rows).map(b=>picBlockHTML(b,live,live&&picFilt==='all')).join('')
          : '<div class="muted" style="padding:10px 0;font-size:12.5px">'+
            (own.length? 'Nothing in this bin matches the filter.' : 'This bin is empty.')+'</div>'}</div>` : ''}
    </div>`;
  }).join('');
}
/* ---------------------- BIN LABELS YOU TAPE TO THE LID ---------------------

   The type shrinks as the bin fills up so a bin of forty things still lands on

   Pass a bin number for one label, or nothing for the whole set.           */

function picLabelQty(it){

function picBinToggle(n,live){ picOpen[n]=!picOpen[n]; picStockRedraw(live); }
function picItemToggle(id,live){ picItemOpen[id]=!picItemOpen[id]; picStockRedraw(live); }
/* Same grouping rule as picBinBlocks, but run over the rows that survived the
   filter and the search rather than over the whole bin. If a parent has been
   filtered out from under its children, the first surviving child becomes the
   head of its own block — better than orphan rows floating with no context. */
function picRowBlocks(rows){
  const blocks=[];
  rows.forEach(row=>{
    if(row[1].parent && blocks.length) blocks[blocks.length-1].push(row);
    else blocks.push([row]);
  });
  return blocks;
}
/* One item, or one item with its contents folded up underneath it. */
function picBlockHTML(block,live,mv){
  const [hid,head]=block[0], kids=block.slice(1);
  if(!kids.length) return picItemRow(hid,head,live,mv,null,false);
  const open=picItemOpen[hid]===true;
  return picItemRow(hid,head,live,mv,kids,open)
    + (open? kids.map(([id,it])=>picItemRow(id,it,live,false,null,false)).join('') : '');
}

/* When something is short, the very next question is "has anyone been asked to
   get it?" — so the answer sits on the row itself rather than only over on the
   To Buy screen. Same wording both places, so they read as one thing.     */
function picAssignLine(id,it,live){
  if(picShortOf(it)<=0) return '';
  const jb=picBuyJobFor(id,it), names=jb?picWhoList(jb[1]):[];
  const txt = jb&&jb[1].done ? '<b class="goldtxt">✓ got it</b>'+(jb[1].doneBy?' — '+esc(jb[1].doneBy):'')
    : names.length ? '🛒 <b>'+names.map(esc).join(', ')+'</b>'+(names.length>1?' — shared':'')

    ? `<button class="btn small gray noprint" onclick="event.stopPropagation();picBuyAssign('${id}')"
        >${names.length?'✎ Change':'👤 Assign'}</button>` : ''}</div>`;

function picItemRow(id,it,live,mv,kids,open){
  const counted=picIsCounted(it), short=picShortOf(it);
  const tag = !counted? '<span class="pictag un">NOT COUNTED</span>'
    : short? '<span class="pictag short">BUY '+short+'</span>'
    : (+it.have||0)>(+it.need||0)? '<span class="pictag over">+'+((+it.have)-(+it.need))+'</span>'
    : '<span class="pictag ok">OK</span>';
  const tot=counted&&+it.per? ' ≈ '+((+it.have||0)*(+it.per)).toLocaleString('en-CA') : '';
  const hasKids=!!(kids&&kids.length);
  return `<div class="picit${it.parent?' sub':''}${hasKids?' haskids':''}">
    <div class="picr1"${hasKids?` style="cursor:pointer" onclick="picItemToggle('${id}',${live?1:0})"`:''}>
      <div><div class="picnm">${hasKids?`<span class="picchev">${open?'▾':'▸'}</span> `:''}${esc(it.name||'')}</div>
        <div class="picneed">${esc(picNeedLabel(it))}</div>
        ${hasKids?`<div class="picneed">${open?'▾ contents shown · ':''}${picKidSummary(kids)}</div>`:''}</div>
      ${tag}
    </div>
    ${live? `<div class="picr2">
      <div class="picstep">
        <button onclick="picStep('${id}',-1)">−</button>
        <input type="text" inputmode="numeric" class="${counted?'':'un'}"
          value="${counted? it.have : '—'}" onchange="picTypeHave('${id}',this)">
        <button onclick="picStep('${id}',1)">＋</button>
      </div>
      <span class="muted">${counted? esc(it.unit||'in stock')+tot : 'tap ＋ to start counting'}</span>
      <div style="margin-left:auto;display:flex;align-items:center;gap:6px">
        ${mv&&isAdmin()&&!it.parent? picMvBtns('Item',id,picItemMoveable(id,it,-1),picItemMoveable(id,it,1)):''}
        <button class="btn small gray" onclick="picItemSheet('${id}')">✎</button></div>
    </div>` : `<div class="picr2"><span class="muted">${counted? 'In stock: '+it.have+' '+esc(it.unit||'')+tot : 'not counted yet'}</span></div>`}
    ${it.note?`<div class="muted" style="font-size:11.5px;margin-top:3px">${esc(it.note)}</div>`:''}
    ${picAssignLine(id,it,live)}
  </div>`;
}

/* -------------------------------- JOBS ------------------------------------ */
function picJobsHTML(){
  const all=picJobs(), done=picDoneN(all);
  // v3.21 — one job can carry several names, so the chip row is built from the
  // flattened list rather than from the raw field.
  const people=[...new Set(all.flatMap(([,j])=>picWhoList(j)))].sort((a,b)=>a.localeCompare(b));
  const pct=all.length? Math.round(done/all.length*100) : 0;
  const list=picJobList();
  const chip=(k,l)=>`<button class="${picWho===k?'on':''}" onclick="picWho='${jsq(k)}';rerender()">${l}</button>`;
  const anyN=all.filter(([,j])=>picWhoList(j).length===0).length;

  const nologin=picNoLogin(), fresh=picNewFromMembers();
  let h=printHead('Picnic jobs — '+esc(picYearKey()), done+' of '+all.length+' done')+`
    <div class="card noprint">
      <div style="display:flex;justify-content:space-between;font-size:13px"><b>All jobs</b><b>${done} / ${all.length} done</b></div>
      <div class="picbar ${pct>=100?'':'part'}"><i style="width:${pct}%"></i></div>
    </div>
    ${fresh.length?`<div class="card noprint"><b>🆕 ${fresh.length} job${fresh.length===1?'':'s'} added by ${fresh.length===1?'a member':'members'}</b>
      <p class="muted">${fresh.map(([id,j])=>`<b>${esc(j.addedBy||'someone')}</b> put “${esc(j.text||'')}” on their own list`).join('<br>')}</p>
      <p class="muted">They are already on the list and count towards the totals. Tap the pencil on any of them
        to re-word it, hand it to somebody else or take it off.</p>
      <button class="btn small gray" onclick="picSeenAll()">✓ Got it</button></div>`:''}
    ${nologin.length?`<div class="card noprint"><b>⚠ ${nologin.map(esc).join(', ')} ${nologin.length===1?'has jobs':'have jobs'} but no login yet</b>
      <p class="muted">Their work is on the list, but they cannot open the app to see it or tick anything off —
        only you can. Add them under <b>Users</b> with the same spelling and the jobs find them on their own.</p>
      <button class="btn small gray" onclick="adminTab='users';rerender()">👤 Go to Users</button></div>`:''}
    <div class="card" style="padding:2px 12px">
      ${people.map((n,i)=>{ const mine=picJobsOf(n), d=picDoneN(mine);
        return `<div class="picperson" onclick="picWho='${jsq(n)}';rerender()">
          <div class="picav a${(i%5)+1}">${esc(picInitials(n))}</div>
          <div class="picpn">${esc(n)}<span class="picpc">${mine.length} job${mine.length===1?'':'s'} · ${d} done · ${mine.length-d} to go</span></div>
          <div class="picar">›</div></div>`; }).join('')}
      ${anyN?`<div class="picperson" onclick="picWho='any';rerender()">
        <div class="picav a3">?</div>
        <div class="picpn">Anyone<span class="picpc">${anyN} job${anyN===1?'':'s'} nobody owns yet</span></div>
        <div class="picar">›</div></div>`:''}
    </div>
    <div class="tabbar noprint">${chip('','Everyone '+all.length)}${chip('out','Outstanding '+(all.length-done))}${chip('done','Done '+done)}${people.map(n=>chip(n,esc(n))).join('')}</div>
    <h2>${picWho==='out'?'Still to do':picWho==='done'?'Done':picWho==='any'?'Nobody owns these yet':picWho?esc(picWho):'Every job'}</h2>`;

  if(!list.length) return h+'<div class="empty">Nothing here.</div>'+picJobAddBtn();
  h+='<div class="card" style="padding:2px 12px">'+list.map(([id,j])=>picJobRow(id,j,true)).join('')+'</div>';
  return h+picJobAddBtn();
}
function picJobAddBtn(){
  return `<div class="rowbtns noprint" style="margin-top:10px">
    <button class="btn small" onclick="picJobSheet('')">＋ Add a job</button>
    <button class="btn small gray" onclick="picExportCSV()">⬇ CSV</button>
    <button class="btn small gray" onclick="window.print()">🖨 Print</button></div>`;
}
function picInitials(n){
  const p=String(n||'').trim().split(/\s+/);
  return ((p[0]||'?').charAt(0)+(p[1]?p[1].charAt(0):'')).toUpperCase();
}
// `admin` true shows the pencil and the reorder arrows. Ticking is decided
// per job by picMayTick. A member gets a pencil only on a job they added
// themselves and nobody has ticked.
function picJobRow(id,j,admin){
  const can=picMayTick(j), boss=admin&&isAdmin(), own=!boss&&picMayEditOwn(id);
  return `<div class="picjob${j.done?' done':''}">
    <div class="pictick${j.done?' on':''}${can?'':' locked'}" onclick="picToggleJob('${id}')">${j.done?'✓':''}</div>
    <div class="pictx">${esc(j.text||'')}${j.member?' <span class="picadd">ADDED BY '+esc((j.addedBy||'').toUpperCase())+'</span>':''}
      <span class="picby">${esc(picWhoLabel(j))}${j.done?' · done '+new Date(j.done).toLocaleDateString('en-CA',{month:'short',day:'numeric'})+(j.doneBy?' by '+esc(j.doneBy):''):''}${j.due&&!j.done?' · needed by '+esc(j.due):''}${j.note?' · '+esc(j.note):''}</span></div>
    ${boss? picMvBtns('Job',id,picJobMoveable(id,-1),picJobMoveable(id,1)) : ''}
    ${boss?`<button class="picx" onclick="picJobSheet('${id}')">✎</button>`
      : own?`<button class="picx" onclick="picMyJobSheet('${id}')">✎</button>`:''}
  </div>`;
}

/* ------------------------------- THE DAY ---------------------------------- */
function picPlanHTML(){
  const slots=picSlots();
  let h=printHead('The Day — '+esc(picYearKey()),
      slots.length+' stops · times and staffing are yours to change')+`
    <p class="muted noprint">This is the running order. Only an Administrator can move a time or change who is on a
      station — everybody else sees it exactly as you leave it.</p>`;
  if(!slots.length) return h+'<div class="empty">Nothing on the plan yet.</div>'+picSlotAddBtn();
  h+=slots.map(([id,s])=>picSlotRow(id,s,true)).join('');
  return h+picSlotAddBtn();
}
function picSlotAddBtn(){
  return `<div class="rowbtns noprint" style="margin-top:10px">
    <button class="btn small" onclick="picSlotSheet('')">＋ New slot</button>
    <button class="btn small gray" onclick="window.print()">🖨 Print the day</button></div>`;
}
function picSlotRow(id,s,admin){
  const reqs=String(s.req||'').split('·').map(x=>x.trim()).filter(Boolean);
  return `<div class="card${s.done?' picdone':''}">
    <div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap">
      <b class="picwhen">${esc(picWhen(s))}</b>
      ${admin&&isAdmin()?`<span class="rowbtns noprint">
        <button class="btn small gray" onclick="picSlotDone('${id}')">${s.done?'↩ Not done':'✔ Done'}</button>
        <button class="btn small gray" onclick="picSlotSheet('${id}')">✎</button></span>`
        :(s.done?'<span class="memberflag">DONE</span>':'')}
    </div>
    <div style="font-weight:800;font-size:15px;margin-top:2px">${esc(s.title||'')}</div>
    ${s.who?`<div class="muted">👤 ${esc(s.who)}</div>`:''}
    ${reqs.length?`<div style="margin-top:6px"><div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.5px">Needs</div>
      <div>${reqs.map(r=>`<span class="picreq">${esc(r)}</span>`).join('')}</div></div>`:''}
    ${s.notes?`<div class="muted" style="margin-top:6px">${esc(s.notes)}</div>`:''}
  </div>`;
}

/* ----------------------------- SHOPPING LIST ------------------------------ */
function picBuyHTML(){
  const list=picBuyList(), all=picItems(), un=all.length-picCountedN();
  let h=printHead('Still to buy — '+esc(picYearKey()), list.length+' item'+(list.length===1?'':'s')+' short');
  if(un) h+=`<div class="card"><b>${un} item${un===1?'':'s'} not counted yet</b>
    <p class="muted">This list can only be as complete as the count. Finish the bins and it may well grow.</p></div>`;
  if(!list.length) return h+'<div class="empty">Nothing is short. Either everything is in the bins, or the count is not done yet.</div>';
  h+='<div class="card" style="padding:2px 12px">'+list.map(([id,it])=>{
    const jb=picBuyJobFor(id,it), names=jb?picWhoList(jb[1]):[];
    return `<div class="picbuy"><div class="picq">${picShortOf(it)}</div>
      <div style="flex:1"><b>${esc(it.name)}</b>
        <div class="muted">${esc(it.unit||'')}${it.per?' of '+it.per:''} · have ${it.have}, need ${it.need} · bin ${it.bin||'?'}</div>
        <div class="muted" style="font-size:11.5px;margin-top:2px">${
          jb&&jb[1].done? '<b class="goldtxt">✓ got it</b>'+(jb[1].doneBy?' — '+esc(jb[1].doneBy):'')
          : names.length? '🛒 <b>'+names.map(esc).join(', ')+'</b>'+(names.length>1?' — shared':'')
          : jb? 'on the jobs list · nobody has taken it'
          : '<span class="muted">not handed out yet</span>'}</div></div>
      ${isAdmin()?`<button class="btn small gray noprint" onclick="picBuyAssign('${id}')"
        >${names.length?'✎ Change':'👤 Assign'}</button>`:''}
    </div>`;}).join('')+'</div>';
  h+=`<div class="rowbtns noprint" style="margin-top:10px">
      <button class="btn small gray" onclick="picShareBuy()">📤 Share</button>
      <button class="btn small gray" onclick="window.print()">🖨 Print</button>
    </div>
    <button class="btn noprint" onclick="picBuyToJobs()">➕ Turn this into ${list.length} job${list.length===1?'':'s'}</button>
    <p class="muted noprint">Anything already handed out is left alone. The rest go on the shared list as
      "Anyone" — and you can hand any line to somebody with <b>Assign</b> above, which puts it straight
      on their own jobs list.</p>`;
  return h;
}

/* ========================= THE MEMBER'S CARD ============================== */
/* Everybody can see the whole picnic — the jobs, the day, the bins. What they
   CANNOT do is add, remove, reassign or re-time anything, and they can only
   tick their own work off. The card opens on their own list, because that is
   what they came for; everything else is one tap away.                       */
function picnicMemberHTML(){
  if(!picOn()) return '';
  const u=meU(); if(!u) return '';
  const y=picY();
  const mine=picJobsOf(u.name), mineDone=picDoneN(mine), mineOut=mine.length-mineDone;
  const all=picJobs(), allDone=picDoneN(all);
  const days=picDaysAway();
  const tab=(k,l)=>`<button class="${picMemTab===k?'on':''}" onclick="picMemTab='${k}';rerender()">${l}</button>`;

  let h=`<h2>🎪 ${esc(y.label||('Picnic '+picYearKey()))}</h2>`;
  if(y.date) h+=`<p class="muted">${new Date(y.date+'T12:00:00').toLocaleDateString('en-CA',{weekday:'long',month:'long',day:'numeric',year:'numeric'})}${days?' · '+days:''}</p>`;

  if(!mine.length && picMemTab==='mine') picMemTab='all';
  h+=`<div class="tabbar noprint">${tab('mine','My Jobs'+(mineOut?' ('+mineOut+')':''))}${tab('all','Everyone '+allDone+'/'+all.length)}${tab('stock','The Bins')}${tab('plan','The Day')}</div>`;

  if(picMemTab==='all'){
    h+=`<p class="muted">The whole club list, so you can see where everything stands. You can tick off
      your own jobs from here too — the rest are somebody else's to tick.</p>`;
    const out=all.filter(([,j])=>!j.done), fin=all.filter(([,j])=>!!j.done);
    h+=`<h2>Still to do — ${out.length}</h2>`;
    h+= out.length? '<div class="card" style="padding:2px 12px">'+out.map(([id,j])=>picJobRow(id,j,false)).join('')+'</div>'
      : '<div class="empty">Everything is done. Well done, all.</div>';
    h+=`<h2>Done — ${fin.length}</h2>`;
    h+= fin.length? '<div class="card" style="padding:2px 12px">'+fin.map(([id,j])=>picJobRow(id,j,false)).join('')+'</div>'
      : '<div class="empty">Nothing ticked off yet.</div>';
    return h;
  }
  if(picMemTab==='plan'){
    h+=`<p class="muted">The running order for the day, and what each station needs. Times are set by an
      admin — if something here looks wrong, say so and it gets changed in one place for everybody.</p>`;
    const slots=picSlots();
    return h + (slots.length? slots.map(([id,s])=>picSlotRow(id,s,false)).join('')
      : '<div class="empty">The day has not been planned out yet.</div>');
  }
  if(picMemTab==='stock'){
    h+=`<p class="muted">What is in the bins in ${esc(picAdminName())}'s mezzanine — by bin, or as one full
      list, and the search finds anything and tells you which bin it is in. Counting is an Administrator job, so
      there is nothing here to press: it is so you can see what the club already owns before you go and
      buy any of it.</p>`;
    return h+picStockHTML(false);
  }

  // ---- my jobs (the default) ----
  const pct=mine.length? Math.round(mineDone/mine.length*100) : 0;
  h+=`<div class="card">
      <div style="display:flex;justify-content:space-between;font-size:13px"><b>My Jobs</b>
        <b>${mineDone} / ${mine.length} done</b></div>
      <div class="picbar ${pct>=100?'':'part'}"><i style="width:${pct}%"></i></div>
    </div>`;
  if(!mine.length) return h+`<div class="empty">You have no picnic jobs yet. Tap <b>Everyone</b> above to see
    the whole list — and if something should be yours, ask an Administrator to put it on you.</div>`+picMyAddBtn();
  const out=mine.filter(([,j])=>!j.done), fin=mine.filter(([,j])=>!!j.done);
  h+=`<h2>Still to do — ${out.length}</h2>`;
  h+= out.length? '<div class="card" style="padding:2px 12px">'+out.map(([id,j])=>picJobRow(id,j,false)).join('')+'</div>'
    : '<div class="empty">You are all done. 👏</div>';
  if(fin.length){
    h+=`<h2>Done — ${fin.length}</h2>
      <div class="card" style="padding:2px 12px">${fin.map(([id,j])=>picJobRow(id,j,false)).join('')}</div>`;
  }
  h+=picMyAddBtn();
  h+=`<p class="muted">You can put a job on your own list any time. To change what somebody else is doing —
    or to take off a job an Administrator gave you — ask an Administrator.</p>`;
  return h;
}
function picMyAddBtn(){
  return `<div class="rowbtns noprint" style="margin-top:10px">
    <button class="btn small" onclick="picMyJobSheet('')">＋ Add a job for myself</button></div>`;
}

/* ------------- ONE-TIME TIDY-UP: the picnic expense category --------------
   "Picnic - Expenses" sat apart from the three "Annual Picnic - …" rows even
   though it is the same event, so the picnic never added up in one place on
   the report. Renaming it moves the three imported entries with it.        */
let _finMigrDone=false;
async function finMigrate(){
  if(_finMigrDone || !S.finance || !isAdmin()) return;
  const F=S.finance;
  if(F.migr318) { _finMigrDone=true; return; }
  _finMigrDone=true;
  const OLD='Picnic - Expenses', NEW='Annual Picnic - General Expenses';
  const cats=[...((F.cats&&F.cats.expense)||[])];
  const i=cats.indexOf(OLD);
  if(i>=0){
    cats[i]=NEW;
    await DB.set(['finance','cats','expense'],cats);
    const hid=((F.catsHidden||{}).expense)||[];
    if(hid.includes(OLD)) await DB.set(['finance','catsHidden','expense'],hid.map(x=>x===OLD?NEW:x));
    for(const [id,tx] of Object.entries(F.txns||{}))
      if(tx.cat===OLD) await DB.set(['finance','txns',id,'cat'],NEW);
  }
  await DB.set(['finance','migr318'],true);
}

/* ------------------------------- BOOT -------------------------------------- */
DB.init(()=>{
  const saved=sessionStorage.getItem('ta_me');
  if(saved && S.users[saved] && !me) me=saved;
  rerender();
  finMigrate();
});
</script>
