/* ------------------------ MY CLUB (member self-view) -----------------------
   Members (not admins) see what's pertinent to THEM: meeting dates, their own
   attendance for the year, and whether their $500 sponsor is done.
   No club money, costs or balances appear here.                             */
function renderMyClub(){
  const u=meU(), yr=new Date().getFullYear();
  const A=S.attendance, F=S.finance;
  /* The Club tab now has two reasons to exist. Club records may be switched
     off entirely and yet a picnic is running — in that case this tab IS the
     picnic, and none of the attendance-and-sponsor machinery below applies. */
  if(!clubRecOn()){
    $('myClubBody').innerHTML=`<h2>🎪 ${esc(u.name)} — the picnic</h2>`+picnicMemberHTML();
    return;
  }
  // The point-of-sale person runs the till on the day. They are not a club
  // member: no meeting attendance is taken for them and no sponsor is expected.
  const staff=isStaffName(u.name);
  let html=`<h2>🎟 ${esc(u.name)} — my club year ${yr}</h2>`;
  if(staff){
    html+=`<div class="card"><b>🛒 You are set up as point-of-sale</b>
      <p class="muted">You run the till at the picnic and the events. Meeting attendance and the
        ${fmt((F&&F.sponsorTarget)||500)} sponsor quota are club-member business, so neither one applies
        to you — nothing is missing from this page. Everything you need is on the Sell tab.</p></div>`;
  } else if(A&&A.baseline){
    const today=new Date(); today.setHours(0,0,0,0);
    let nxt=null,nxtOv=false;
    for(let mi=1;mi<=12;mi++){ const d=meetDate(yr,mi);
      if(d>=today){ nxt=d; nxtOv=!!((((A.years||{})[String(yr)]||{}).mdates||{})['m'+mi]); break; } }
    html+=`<div class="stat gold"><div class="v">${nxt? nxt.toLocaleDateString('en-CA',{weekday:'long',month:'long',day:'numeric'}) : 'See you in January'}</div>
      <div class="l">Next meeting${nxtOv?' — note: the date was changed':''}</div></div>`;
    const r=(A.roster||[]).find(x=>(x.name||'').trim().toLowerCase()===(u.name||'').trim().toLowerCase());
    const Y=(A.years||{})[String(yr)]||{};
    const myMarks=r? ((Y.marks||{})[r.id]||{}) : {};
    // The shared register note can name several members, so it never appears here —
    // only the minutes (club business) and this member's own reason for being away.
    const minutes=(Y.minutes||{}), mnotes=(Y.mnotes||{});
    const myWhy=mi=>r? ((mnotes['m'+mi]||{})[r.id]||'') : '';
    const MARKNAME={P:'Present',L:'Late',A:'Absent',AN:'Absent — with notice',NP:'No patch'};
    const missed=MONTHS.map((m,i)=>({m,mi:i+1,v:myMarks['m'+(i+1)]||''}))
      .filter(x=>x.v==='A'||x.v==='AN');
    html+=`<h2>📅 Meetings & my attendance — ${yr}</h2>
      <div class="card"><table>
        <tr><th>Month</th><th>Meeting</th><th class="r">Me</th></tr>
        ${MONTHS.map((m,i)=>{ const d=meetDate(yr,i+1); const ov=!!((Y.mdates||{})['m'+(i+1)]);
          const v=myMarks['m'+(i+1)]||'';
          const out=(v==='A'||v==='AN');
          return `<tr${out?' style="background:rgba(210,31,38,.08)"':''}><td>${m}</td><td>${d.toLocaleDateString('en-CA',{weekday:'short',month:'short',day:'numeric'})}${ov?' <span class="memberflag">changed</span>':''}</td>
            <td class="r"><b>${v||'·'}</b></td></tr>`; }).join('')}
      </table></div>`;
    if(missed.length){
      html+=`<h2>🚩 What I missed — ${yr}</h2>
        ${missed.map(x=>{
          const mn=minutes['m'+x.mi]||'', why=myWhy(x.mi);
          return `<div class="card">
            <b>${x.m} ${meetDate(yr,x.mi).getDate()}</b> — ${MARKNAME[x.v]||x.v}
            ${why?`<div class="muted" style="font-size:12px">Reason on the register: ${esc(why)}</div>`:''}
            ${mn?`<p style="margin:8px 0 0;white-space:pre-wrap">${esc(mn)}</p>`
                :'<p class="muted" style="margin:8px 0 0">The minutes for this meeting have not been written up yet.</p>'}
          </div>`; }).join('')}
        <p class="muted">This is what was covered at the meetings you were away for. If something here looks wrong, speak to an Administrator.</p>`;
    }
    if(r){
      const cnt={P:0,L:0,AN:0,A:0,NP:0};
      Object.values(myMarks).forEach(v=>{ if(cnt[v]!==undefined) cnt[v]++; });
      html+=`<p class="muted">${attLegendHTML()}<br>My year so far: P ${cnt.P} · L ${cnt.L} · AN ${cnt.AN} · A ${cnt.A}${cnt.NP?' · NP '+cnt.NP:''}</p>`;
    } else {
      html+=`<p class="muted">You're not on the attendance register yet — ask an Administrator to add you (the register name must match your login name).</p>`;
    }
  } else {
    html+=`<p class="muted">The attendance register hasn't been opened yet — it appears once an Administrator opens the Attendance tab.</p>`;
  }
  if(F && !staff){
    const target=F.sponsorTarget||500;
    // The sponsor season is Aug 1 → Jul 31, and it is worked out from today's
    // date, so on Aug 1 this page turns over on its own.
    const sy=currentSponsorYear();
    const mine=Object.values(F.txns||{})
      .filter(t=>t.kind==='income'&&t.cat==='Donations'&&t.member&&(t.member||'').trim().toLowerCase()===(u.name||'').trim().toLowerCase()
        &&sponsorYearOf(t.ts)===sy);
    const last=Object.values(F.txns||{})
      .filter(t=>t.kind==='income'&&t.cat==='Donations'&&t.member&&(t.member||'').trim().toLowerCase()===(u.name||'').trim().toLowerCase()
        &&sponsorYearOf(t.ts)===sy-1);
    const got=mine.reduce((a,t)=>a+t.amount,0), gotLast=last.reduce((a,t)=>a+t.amount,0);
    /* v3.21 — a donation that came in through the member's own sponsor log is shown
       in full detail further down (with its status, photo and history), so listing it
       up here as well would show the same sponsor to them twice. Only donations an
       admin typed straight into the books appear in this short list. Both kinds still
       count towards `got` — the total above is unchanged.                            */
    const direct=mine.filter(t=>!t.sponsorId);
    html+=`<h2>⭐ My sponsor — ${sponsorYearLabel(sy)}</h2>
      <div class="stat ${got>=target?'green':'red'}"><div class="v">${got>=target?'✔ Done':fmt(target-got)+' to go'}</div>
        <div class="l">${got>=target?'Sponsor secured for this season — thank you!':'Every member secures a '+fmt(target)+' sponsor each season, or self-sponsors'}</div></div>
      ${direct.length?`<div class="card">${direct.map(t=>`<div style="padding:4px 0"><b>${esc(t.sponsor||'Donation')}</b> — ${fmt(t.amount)}${t.inkind?' <span class="memberflag">IN-KIND</span>':''} <span class="muted">${new Date(t.ts).toLocaleDateString('en-CA')}</span></div>`).join('')}</div>`:''}
      ${sponsorMineHTML(sy)}
      ${sponsorNoticeHTML(target,sy)}
      ${gotLast>0.005?`<p class="muted">Last season (${sponsorYearLabel(sy-1)}) you secured ${fmt(gotLast)}. That one is closed — it does not carry over.</p>`:''}`;
  }
  html+=claimsMemberHTML();
  html+=picnicMemberHTML();
  $('myClubBody').innerHTML=html;
}

  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes());
}

function esShiftDay(n){

async function saveSaleEdit(){
  const s=S.sales[_es.id];
  _es.buyer=($('es_buyer')||{}).value||'';
  if(_es.payment==='Pay Later' && !_es.buyer){ toast('Pick which member owes this',1); return; }
  if(_es.payment!=='Pay Later' && !_es.buyer && (s.lines||[]).some(l=>l.member)){
    toast('This sale has a member price — pick which member it was for',1); return; }
  const rows=[...document.querySelectorAll('#modalBox .sizeedit')];
  const newLines=[], applied=[];
  for(const r of rows){
    const i=+r.dataset.i, l=s.lines[i];
    const q=Math.max(0,Math.round(+r.querySelector('.es_q').value||0));
    const p=Math.max(0,+r.querySelector('.es_p').value||0);
    const delta=q-l.qty;                      // extra units sold consume stock
    if(delta!==0 && !l.adhoc && S.items[l.itemId]){
      const ok=await DB.txnStock(l.itemId,l.size,-delta);
      if(!ok){
        for(const a of applied) await DB.txnStock(a.itemId,a.size,a.d);   // roll back
        toast('Not enough stock for '+l.item+' '+l.size,1); return;
      }
      applied.push({itemId:l.itemId,size:l.size,d:delta});
    }
    if(q>0) newLines.push({...l,qty:q,price:p});
  }
  const total=newLines.reduce((a,l)=>a+l.qty*l.price,0);
  const whenEl=$('es_when'), typed=whenEl? whenEl.value : '';
  let ts=s.ts, moved=false;
  if(typed){
    const t=new Date(typed).getTime();
    if(!isNaN(t) && Math.abs(t-s.ts)>60000){ ts=t; moved=true; }
  }
  const note=(($('es_note')||{}).value||'').trim().slice(0,500);
  await DB.set(['sales',_es.id],{...s, ts, lines:newLines, total,
    payment:_es.payment, buyer:_es.buyer||null,
    note: note||null,
    voided:newLines.length===0? true : (s.voided||false),
    edited:{ts:Date.now(), by:meU().name, movedFrom: moved? s.ts : (s.edited&&s.edited.movedFrom)||null}});
  closeModal();
  toast(newLines.length
    ? 'Sale updated — '+fmt(total)+(moved?' · moved to '+new Date(ts).toLocaleDateString('en-CA'):'')
    : 'All lines removed — sale voided');
  rerender();
}

let repFrom=null, repTo=null, repPreset='today', repSeller='', repItem='', repDisc='', repGroup='';
/* ------------------ WHAT "DISCOUNTED" ACTUALLY MEANS ------------------------
   Two completely different things were being muddled together:

   1. A VOLUME DISCOUNT is applied to a whole SALE at the till. It is then spread
      across the lines in proportion to their value. So a sale can be flagged
      "discounted" while one particular item on it still went out at full shelf
      price — the money came off the other lines.
   2. A LINE is marked down when what was charged for it is less than the shelf
      price. That can come from the volume discount, from the item being on sale,
      or from member pricing (members pay cost).

   The old filter tested (1) and then printed every line of those sales, so a
   full-price hoodie inside a discounted sale looked discounted. It never was.
   Pay Later has nothing to do with either — that is only WHEN it was paid.     */
function lineList(l){ return (l.orig!=null? l.orig : l.price); }        // shelf price
function lineOff(l){ return Math.max(0,(lineList(l)-l.price))*(l.qty||0); }
function lineCut(l){ return lineOff(l)>0.005; }
/* v3.21 — what a complimentary was worth. New sales carry the figure on the record;
   older ones (and any hand-typed 100% job from before this version) get it worked
   back out of the lines, so the report never shows a give-away as $0.00. */
function isComp(s){ return !!(s && s.comp); }
function compValueOf(s){
  if(s && s.comp && s.comp.value!=null) return s.comp.value;
  return Math.round((s&&s.lines||[]).reduce((a,l)=>
    a + (l.member? (l.cost||0) : lineList(l)) * (l.qty||0), 0)*100)/100;
}
// Why this line came in under the shelf price — in plain words, for the drill-down.
function lineWhy(l,s){
  const w=[];
  if(s&&s.comp){ return ['complimentary — given away by '+(s.comp.by||s.sellerName||'—')]; }
  if(l.member) w.push('member price (at cost)');
  if(l.salePct>0) w.push(l.salePct+'% off — item on sale');
  if(s&&s.discount) w.push('share of the '+(s.discount.type==='pct'?s.discount.value+'%':fmt(s.discount.value))
    +' volume discount on this sale');
  return w;
}
// One place that decides which sales are in scope, so the tiles, the tables and
// the drill-downs can never drift apart.
function repScopedSales(){
  const [from,to]=repRange();
  let sales=salesSorted().map(([id,s])=>({id,s})).filter(x=>!x.s.voided&&x.s.ts>=from&&x.s.ts<=to);
  if(repSeller) sales=sales.filter(x=>x.s.sellerName===repSeller);
  if(repDisc==='sale') sales=sales.filter(x=>x.s.discount);
  if(repDisc==='comp') sales=sales.filter(x=>isComp(x.s));
  return sales;
}
// ...and one place that decides which LINES of a scoped sale are in scope.
function repScopedLines(s){
  let lines = repItem ? s.lines.filter(l=>l.item===repItem) : s.lines;
  if(repGroup) lines = lines.filter(l=>lineGroup(l)===repGroup);
  if(repDisc==='line') lines = lines.filter(lineCut);
  return lines;
}
function repRange(){
  const now=new Date();
  if(repPreset==='custom') return [repFrom??today0(), repTo??(today0()+86400000-1)];
  if(repPreset==='today') return [today0(), today0()+86400000-1];
  if(repPreset==='week'){ const d=new Date(); const dow=(d.getDay()+6)%7;
    d.setHours(0,0,0,0); d.setDate(d.getDate()-dow); return [d.getTime(), Date.now()]; }
  if(repPreset==='month') return [new Date(now.getFullYear(),now.getMonth(),1).getTime(), Date.now()];
  if(repPreset==='year') return [new Date(now.getFullYear(),0,1).getTime(), Date.now()];
  return [0, Date.now()];   // all time
}
function dstr(t){ const d=new Date(t); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
/* --------------------------- SHOW YOUR WORKING ------------------------------
   Every total on the report can now be opened up. You get the individual sales
   behind it: when, who rang it up, how it was paid — and for each line the shelf
   price against what was actually charged, with the reason spelled out. This is
   what was missing: the numbers were right, but there was no way to check them. */
function repDrill(kind,key){
  const [from,to]=repRange();
  const want=l=> kind==='group' ? lineGroup(l)===key
             : kind==='item'  ? (l.item+' — '+l.size)===key
             : kind==='off'   ? lineCut(l)
             : true;                                  // 'seller' / 'comp' — whole sale
  const hits=[];
  repScopedSales().forEach(({id,s})=>{
    if(kind==='seller' && s.sellerName!==key) return;
    if(kind==='comp' && !isComp(s)) return;
    const lines=repScopedLines(s).filter(want);
    if(lines.length) hits.push({id,s,lines});
  });
  const rev=hits.reduce((a,h)=>a+h.lines.reduce((b,l)=>b+l.price*l.qty,0),0);
  const cost=hits.reduce((a,h)=>a+h.lines.reduce((b,l)=>b+l.cost*l.qty,0),0);
  const qty=hits.reduce((a,h)=>a+h.lines.reduce((b,l)=>b+l.qty,0),0);
  const off=hits.reduce((a,h)=>a+h.lines.reduce((b,l)=>b+lineOff(l),0),0);
  const title = kind==='group' ? (GRP_LABEL[key]||key)
              : kind==='item'  ? key
              : kind==='off'   ? 'Everything sold below shelf price'
              : kind==='comp'  ? '🎁 Complimentary — everything given away'
              : 'Sold by '+key;
  const rows=hits.map(({id,s,lines})=>{
    const paid = s.payment==='Pay Later'
      ? `<b class="goldtxt">Pay Later</b>${s.buyer?` — on ${esc(s.buyer)}'s tab`:''}`
      : esc(s.payment)+(s.buyer?` — ${esc(s.buyer)}`:'');
    return `<div class="card" style="margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap">
        <b>${new Date(s.ts).toLocaleDateString('en-CA',{month:'short',day:'numeric'})}
          ${new Date(s.ts).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</b>
        <span class="muted">${esc(s.sellerName)} · ${paid}</span></div>
      <table style="margin-top:6px"><tr><th>Item</th><th class="r">Qty</th><th class="r">Shelf</th><th class="r">Charged</th><th class="r">Off</th></tr>
      ${lines.map(l=>{ const o=lineOff(l), why=lineWhy(l,s);
        return `<tr><td>${esc(l.item)} ${esc(l.size)}
            ${o>0.005&&why.length?`<div class="muted" style="font-size:11px">${esc(why.join(' + '))}</div>`:''}</td>
          <td class="r">${l.qty}</td>
          <td class="r ${o>0.005?'muted':''}" style="${o>0.005?'text-decoration:line-through':''}">${fmt(lineList(l))}</td>
          <td class="r"><b>${fmt(l.price)}</b></td>
          <td class="r ${o>0.005?'neg':'muted'}">${o>0.005?'−'+fmt(o):'—'}</td></tr>`; }).join('')}
      </table>
      ${s.comp?`<p style="margin:6px 0 0;color:var(--gold)">🎁 <b>Complimentary</b> — this whole sale was given
        away by <b>${esc(s.comp.by||s.sellerName)}</b>. Nothing was collected. Worth <b>${fmt(compValueOf(s))}</b>
        at the price the club would have charged, and the stock came off the shelf.</p>`:''}
      ${s.discount&&!s.comp?`<p class="muted" style="margin:6px 0 0">🧾 A ${s.discount.type==='pct'?s.discount.value+'%':fmt(s.discount.value)+' off'}
        volume discount (−${fmt(s.discount.amount)}) was applied to this whole sale by <b>${esc(s.discount.by||s.sellerName)}</b>,
        spread across all ${s.lines.length} line${s.lines.length===1?'':'s'} on it${s.lines.length>lines.length?` — only ${lines.length} shown here`:''}.</p>`:''}
      ${s.note?`<p style="margin:6px 0 0;color:var(--gold)">📝 ${esc(s.note)}</p>`:''}
      ${s.edited?'<p class="muted" style="margin:6px 0 0">This sale was edited after it was rung up.</p>':''}
    </div>`;
  }).join('');
  openModal(`<h3><button class="x" onclick="closeModal()">✕</button>${esc(title)}</h3>
    <p class="muted">${dstr(from)} to ${dstr(to)}${repSeller&&kind!=='seller'?' · seller: '+esc(repSeller):''}</p>
    <div class="statgrid">
      <div class="stat green"><div class="v">${fmt(rev)}</div><div class="l">Revenue · ${hits.length} sale${hits.length===1?'':'s'}</div></div>

function moneyCalc(){

  //  - Interac/Square: the money is already in the club's account → nobody owes it.
  //  - Pay Later sales: nobody collected money → the BUYER owes the club (their "tab").
  const sales=salesSorted().map(([,s])=>s).filter(s=>!s.voided);
  const cashSales=sales.filter(isSellerCash);
  const tabSales=sales.filter(isTabSale);
  const interacSales=sales.filter(isDirectSale);
  const interacTotal=interacSales.reduce((a,s)=>a+s.total,0);
  const bal={};  const row=n=>bal[n]=bal[n]||{collected:0,keeps:0,received:0};
  cashSales.forEach(s=>{
    const pct=(s.sellerPct||0)/100;
    const prof=s.lines.reduce((a,l)=>a+(l.price-l.cost)*l.qty,0);
    const e=row(s.sellerName); e.collected+=s.total; e.keeps+=prof*pct;
  });
  const tabs={};  const trow=n=>tabs[n]=tabs[n]||{charged:0,paid:0};
  tabSales.forEach(s=>{ trow(s.buyer||'Unknown').charged+=s.total; });
  const pays=Object.entries(S.payments||{}).sort((a,b)=>b[1].ts-a[1].ts);
  const payoutBy={};   // club -> member profit-share payouts
  const floats={};     // cash float: loaned out for making change, then returned
  let miscIn=0;        // cash in from something that never went through the till
  const frow=n=>floats[n]=floats[n]||{out:0,back:0};
  pays.forEach(([,p])=>{
    if(p.kind==='tab') trow(p.from).paid+=p.amount;
    else if(p.kind==='payout') payoutBy[p.from]=(payoutBy[p.from]||0)+p.amount;
    else if(p.kind==='floatout') frow(p.from).out+=p.amount;
    else if(p.kind==='floatin') frow(p.from).back+=p.amount;
    // Cash from something the club did off the app — a card game, a hall rental.
    // It is real money in, but it settles nobody's balance, so keep it on its own.
    else if(p.kind==='misc') miscIn+=p.amount;
    else row(p.from).received+=p.amount;
  });
  const floatOutNow=Object.values(floats).reduce((a,f)=>a+(f.out-f.back),0);
  // profit share the club owes sellers on Pay-Later sales (club collects those in full)
  const shareOf=s=>{ const prof=s.lines.reduce((a,l)=>a+(l.price-l.cost)*l.qty,0);
    return prof*(s.sellerPct||0)/100; };
  // ...and on Interac sales too — that money went straight to the club, so the
  // seller never had a chance to take their share out of it.
  const laterShare={};
  tabSales.concat(interacSales).forEach(s=>{ const sh=shareOf(s);
    if(sh>0) laterShare[s.sellerName]=(laterShare[s.sellerName]||0)+sh; });
  Object.keys(payoutBy).forEach(n=>{ laterShare[n]=laterShare[n]||0; });
  const owedSellers=Object.values(bal).reduce((a,e)=>a+(e.collected-e.keeps),0);
  const recSellers=Object.values(bal).reduce((a,e)=>a+e.received,0);
  const owedTabs=Object.values(tabs).reduce((a,e)=>a+e.charged,0);
  const paidTabs=Object.values(tabs).reduce((a,e)=>a+e.paid,0);
  const sellersStill=owedSellers-recSellers;          // what sellers have NOT handed in yet
  const tabsStill=owedTabs-paidTabs;
  const outstanding=sellersStill+tabsStill;
  const mism=shareMismatches();
  return {sales,cashSales,tabSales,interacSales,interacTotal,bal,tabs,pays,payoutBy,floats,
    floatOutNow,shareOf,laterShare,owedSellers,recSellers,owedTabs,paidTabs,
    sellersStill,tabsStill,outstanding,miscIn,mism};
}
/* ================= "WHERE DOES THAT NUMBER COME FROM?" =====================
   Tap any tile on the Money screen and this shows the whole sum in order, in
   plain words, with every person and every payment that went into it.        */
const PAY_KIND={tab:'Tab payment (a member paying off what they took)',
  payout:"Payout (the club paying a seller their share)",
  misc:'Miscellaneous cash in (something done off the app)',
  floatout:'Float given out (change money)', floatin:'Float returned'};
function moneyDrill(which){
  const M=moneyCalc();
  const seller=(n,e)=>({n, owes:e.collected-e.keeps, bal:e.collected-e.keeps-e.received, ...e});
  const rows=Object.entries(M.bal).map(([n,e])=>seller(n,e));

  if(which==='sellers'){
    const stillList=rows.filter(r=>r.bal>0.005);
    return openModal(_moneyTitle('Sellers still to hand in', M.sellersStill,
        M.sellersStill>0.005?'gold':'green')
      + `<div class="card"><p>When somebody rings up a <b>cash</b> sale, the customer hands
        <i>them</i> the money — it goes in their pocket, not the club's box. They keep their agreed profit
        share out of it and the rest belongs to the club. So the club is owed money by its own sellers
        until they hand it in.</p>
        <p class="muted">Interac / Square never appears here: that money goes straight into the club's
        account, so there is nothing for a seller to hand over. Pay-later sales are not here either —
        nobody collected anything, so it sits on the buyer's tab instead.</p></div>`
      + `<h2>The sum, in order</h2>`
      + _drillSum([
          ['Cash the sellers collected, all time', M.cashSales.reduce((a,s)=>a+s.total,0)],
          ['Less: the profit share they are entitled to keep', -Object.values(M.bal).reduce((a,e)=>a+e.keeps,0)],
          ['= Owed to the club, all time', M.owedSellers],
          ['Less: already handed in and recorded', -M.recSellers],
        ], 'STILL TO HAND IN', M.sellersStill,
        M.sellersStill>0.005
          ? 'That last figure is the one on the tile. It is what is genuinely still out there.'
          : 'Everything the sellers ever collected has been handed in and recorded. Nobody owes the club anything.')
      + `<h2>Person by person</h2>`
      + `<div class="card"><table>
          <tr><th>Member</th><th class="r">Collected</th><th class="r">Keeps</th><th class="r">Owed club</th><th class="r">Handed in</th><th class="r">Still owes</th></tr>
          ${rows.map(r=>`<tr><td>${esc(r.n)}</td><td class="r">${fmt(r.collected)}</td>
            <td class="r goldtxt">${fmt(r.keeps)}</td><td class="r">${fmt(r.owes)}</td>
            <td class="r pos">${fmt(r.received)}</td>
            <td class="r ${r.bal>0.005?'neg':'pos'}"><b>${fmt(r.bal)}</b></td></tr>`).join('')
            ||'<tr><td colspan="6" class="empty">No cash sales yet.</td></tr>'}
          <tr class="drilltot"><td>Total</td>
            <td class="r">${fmt(rows.reduce((a,r)=>a+r.collected,0))}</td>
            <td class="r">${fmt(rows.reduce((a,r)=>a+r.keeps,0))}</td>
            <td class="r">${fmt(M.owedSellers)}</td>
            <td class="r">${fmt(M.recSellers)}</td>
            <td class="r">${fmt(M.sellersStill)}</td></tr></table></div>`
      + (stillList.length?`<p class="muted">Still to collect from: <b>${stillList.map(r=>esc(r.n)+' '+fmt(r.bal)).join(', ')}</b>.</p>`
         :'<p class="muted">Nothing to chase — every seller is square with the club.</p>'));
  }

  if(which==='tabs'){
    const list=Object.entries(M.tabs).map(([n,e])=>({n,...e,still:e.charged-e.paid}))
      .sort((a,b)=>b.still-a.still);
    return openModal(_moneyTitle('Owed on member tabs', M.tabsStill, M.tabsStill>0.005?'gold':'green')
      + `<div class="card"><p>A tab is a pay-later sale: the member walked off with the goods and nothing
        was collected at the time. The <b>buyer</b> owes the club, and it stays here until they pay.</p></div>`
      + `<div class="card"><table>
          <tr><th>Member</th><th class="r">Charged</th><th class="r">Paid</th><th class="r">Still owes</th></tr>
          ${list.map(r=>`<tr><td>${esc(r.n)}</td><td class="r">${fmt(r.charged)}</td>
            <td class="r pos">${fmt(r.paid)}</td>
            <td class="r ${r.still>0.005?'neg':'pos'}"><b>${fmt(r.still)}</b></td></tr>`).join('')
            ||'<tr><td colspan="4" class="empty">Nobody has taken anything on a tab.</td></tr>'}
          <tr class="drilltot"><td>Total</td><td class="r">${fmt(M.owedTabs)}</td>
            <td class="r">${fmt(M.paidTabs)}</td><td class="r">${fmt(M.tabsStill)}</td></tr></table></div>`);
  }

  if(which==='received'){
    const inPays=M.pays.filter(([,p])=>p.kind!=='payout'&&p.kind!=='floatout'&&p.kind!=='floatin');
    return openModal(_moneyTitle('Received by club', M.recSellers+M.paidTabs+M.miscIn, 'green')
      + `<div class="card"><p>Every payment recorded with the <b>＋ Record money received by club</b> button —
        sellers handing in their cash, members paying off their tabs, and any miscellaneous cash from
        something the club did off the app.</p></div>`
      + _drillSum([['Handed in by sellers', M.recSellers],['Paid off member tabs', M.paidTabs]]
          .concat(M.miscIn>0.005?[['Miscellaneous cash in', M.miscIn]]:[]),
          'RECEIVED BY CLUB', M.recSellers+M.paidTabs+M.miscIn)
      + `<h2>Every payment</h2>`
      + `<div class="card"><table>
          <tr><th>Date</th><th>From / what</th><th class="r">Amount</th></tr>
          ${inPays.slice().sort((a,b)=>a[1].ts-b[1].ts).map(([,p])=>`<tr>

      + (Object.keys(M.payoutBy).length?`<h2>Paid back out to sellers</h2>
          <p class="muted">Profit share the club owed on pay-later and Interac sales. This is money going
          the other way, so it is not part of the total above.</p>
          ${_drillSum(Object.entries(M.payoutBy).map(([n,v])=>[n,v]),'Total paid out',
            Object.values(M.payoutBy).reduce((a,v)=>a+v,0))}`:''));
  }

  if(which==='misc'){
    const mp=M.pays.filter(([,p])=>p.kind==='misc').sort((a,b)=>a[1].ts-b[1].ts);
    return openModal(_moneyTitle('Miscellaneous cash in', M.miscIn, 'green')
      + `<div class="card"><p>Cash handed to the club for something that never went through the till —
        a card game, a hall rental, a donation at the door. Nobody owes it and nobody is holding it:
        it is already in. It flows straight into the books as income under
        <b>Miscellaneous cash in</b>, so the club balance includes it.</p></div>`
      + `<h2>Every entry</h2>`
      + `<div class="card"><table>
          <tr><th>Date</th><th>What it was for</th><th class="r">Amount</th></tr>
          ${mp.map(([,p])=>`<tr>
            <td style="white-space:nowrap;vertical-align:top">${_dDate(p.ts)}</td>
            <td><b>${esc(p.note||'—')}</b>
              <div class="muted">handed in by ${esc(p.from||'—')}${p.by?' · recorded by '+esc(p.by):''}</div></td>
            <td class="r pos" style="vertical-align:top"><b>${fmt(p.amount)}</b></td></tr>`).join('')
            ||'<tr><td colspan="3" class="empty">Nothing recorded yet.</td></tr>'}
          <tr class="drilltot"><td colspan="2">TOTAL MISCELLANEOUS CASH IN</td>
            <td class="r">${fmt(M.miscIn)}</td></tr></table></div>`);
  }

  if(which==='outstanding'){
    return openModal(_moneyTitle('Still outstanding (total)', M.outstanding,
        M.outstanding>0.005?'red':'green')
      + _drillSum([
          ['Sellers still to hand in (cash sales)', M.sellersStill],
          ['Members still to pay off their tabs', M.tabsStill],
        ], 'STILL OUTSTANDING', M.outstanding,
        M.outstanding>0.005
          ? 'This is every dollar the club is still waiting on. Tap the other two tiles to see who.'
          : 'Nothing is outstanding — every seller has handed in their cash and every tab is paid off. Any large figure showing elsewhere on this screen is an all-time running total, not a debt.')
      + (M.outstanding>0.005?`<div class="card"><table>
          <tr><th>Who</th><th>Why</th><th class="r">Still owed</th></tr>
          ${rows.filter(r=>r.bal>0.005).map(r=>`<tr><td>${esc(r.n)}</td>
            <td class="muted">cash sales not handed in</td><td class="r neg"><b>${fmt(r.bal)}</b></td></tr>`).join('')}
          ${Object.entries(M.tabs).filter(([,e])=>e.charged-e.paid>0.005).map(([n,e])=>`<tr><td>${esc(n)}</td>
            <td class="muted">pay-later tab</td><td class="r neg"><b>${fmt(e.charged-e.paid)}</b></td></tr>`).join('')}
          <tr class="drilltot"><td colspan="2">Total</td><td class="r">${fmt(M.outstanding)}</td></tr>
        </table></div>`:''));
  }

  if(which==='interac'){
    const byS={}; M.interacSales.forEach(s=>{ const n=s.sellerName||'—'; byS[n]=(byS[n]||0)+s.total; });
    return openModal(_moneyTitle('Interac / Square', M.interacTotal, 'green')
      + `<div class="card"><p>Tapped or e-transferred straight into the club's own account. Nobody was ever
        holding this money, so nobody owes it — the only thing still to settle is the seller's profit share,
        which the club pays back out.</p></div>`
      + `<h2>By who rang it up</h2>`
      + _drillSum(Object.entries(byS).sort((a,b)=>b[1]-a[1]).map(r=>[r[0],r[1]]),'Total Interac / Square',M.interacTotal)
      + `<h2>Share the club owes back on these</h2>`
      + _drillSum(M.interacSales.reduce((acc,s)=>{
            const n=s.sellerName||'—', sh=M.shareOf(s);
            const f=acc.find(r=>r[0]===n); if(f) f[1]+=sh; else acc.push([n,sh]); return acc;},[]),
          'Total share owed back', M.interacSales.reduce((a,s)=>a+M.shareOf(s),0)));

  if(which==='float'){
    const list=Object.entries(M.floats).map(([n,f])=>({n,...f,still:f.out-f.back}));
    return openModal(_moneyTitle('Cash float currently out', M.floatOutNow, 'gold')

        sellers can make change. It is <b>not</b> revenue and it is <b>not</b> a debt — it is the club's own
        cash, temporarily in somebody's apron. When the box comes back, record it as returned and this goes to zero.</p></div>`
      + `<div class="card"><table>
          <tr><th>Held by</th><th class="r">Given out</th><th class="r">Returned</th><th class="r">Still out</th></tr>
          ${list.map(r=>`<tr><td>${esc(r.n)}</td><td class="r">${fmt(r.out)}</td>
            <td class="r pos">${fmt(r.back)}</td>

          <tr class="drilltot"><td colspan="3">Still out</td><td class="r">${fmt(M.floatOutNow)}</td></tr></table></div>`);
  }
}
function _moneyTitle(t,total,cls){

function rsPreview(el,id){
  const row=el.closest('.rsrow'); const s=row.dataset.size; const z=S.items[id].sizes[s];
  const q=+row.querySelector('.rs_q').value||0, c=+row.querySelector('.rs_c').value||0;
  const st=z.stock||0;
  const avg=q>0 ? ((st*z.cost)+(q*c))/(st+q) : z.cost;
  row.querySelector('.rs_avg').textContent=fmt(Math.round(avg*100)/100);
}
async function saveRestock(id){
  const it=S.items[id]; let any=false;
  for(const row of document.querySelectorAll('#modalBox .rsrow')){
    const s=row.dataset.size;
    const q=Math.round(+row.querySelector('.rs_q').value||0);
    const c=+row.querySelector('.rs_c').value||0;
    if(q<=0) continue;
    any=true;
    const z=it.sizes[s]; const st=z.stock||0;
    const avg=Math.round((((st*z.cost)+(q*c))/(st+q))*100)/100;
    await DB.set(['items',id,'sizes',s,'cost'],avg);
    await DB.txnStock(id,s,q);
    await DB.push(['restocks'],{ts:Date.now(),itemId:id,item:it.name,size:s,qty:q,unitCost:c,newAvgCost:avg,by:meU().name});
  }
  if(!any){ toast('Enter a quantity for at least one size',1); return; }
  closeModal(); toast('Stock received — costs updated'); rerender();
}

        ${SALE_GROUPS.map(x=>`<button class="${g===x&&!guessed?'on':''}" style="flex:1 1 24%;font-size:11px;${g===x&&guessed?'opacity:.75;border-color:var(--gold)':''}"

async function moveItem(id,dir){
  const list=allItemsSorted();

  rerender();

function sizeRowHTML(s,z,def){

  // Standard sizes get a dropdown; unusual labels (e.g. hat colours) get a text box via "Custom…"
  const std = !s || SIZE_ORDER.includes(s);
  const sizeField = std
    ? `<select class="se_s" onchange="if(this.value==='__custom'){const i=document.createElement('input');i.className='se_s';i.placeholder='Size';this.replaceWith(i);i.focus();}">
        ${s?'':'<option value="" selected disabled>Size…</option>'}

        <option value="__custom">Custom…</option></select>`
    : `<input class="se_s" value="${esc(s)}" placeholder="Size">`;
  return `<div class="sizeedit">${sizeField}
    <input class="se_c" type="number" step="0.01" min="0" value="${z.cost}">
    <input class="se_p" type="number" step="0.01" min="0" value="${z.price}">
    <input class="se_q" type="number" step="1" min="0" value="${z.stock||0}">

function addSizeRow(){
  // Default the new row to the NEXT size up, and copy cost/price from the row above
  const rows=[...document.querySelectorAll('#ei_sizes .sizeedit')];
  let next='', def=null;
  if(rows.length){
    const last=rows[rows.length-1];
    const lastSize=(last.querySelector('.se_s')||{}).value||'';
    const i=SIZE_ORDER.indexOf(lastSize);
    if(i>=0 && SIZE_ORDER[i+1] && SIZE_ORDER[i+1]!=='One Size') next=SIZE_ORDER[i+1];
    def={cost:last.querySelector('.se_c').value, price:last.querySelector('.se_p').value,
         reorder:last.querySelector('.se_r').value||2};
  }
  $('ei_sizes').insertAdjacentHTML('beforeend', sizeRowHTML(next,null,def));
}

/* ------------- PROFIT SHARE ON SALES ALREADY RECORDED ---------------------
   Each sale stores the seller's % at the moment it was rung up, so the
   history of what someone was actually owed can never be silently rewritten
   by a later settings change. The flip side is that correcting a mistake —
   a member left on 50% by accident all day — needs a deliberate repair, and
   this is it.                                                              */
function pastShareSales(userId){
  return Object.entries(S.sales||{})
    .filter(([,s])=>s.sellerId===userId && !s.voided)
    .sort((a,b)=>b[1].ts-a[1].ts);
}
function countSharePast(userId,pct){
  return pastShareSales(userId).filter(([,s])=>(s.sellerPct||0)!==pct).length;
}
// Anyone whose recorded sales carry a share that isn't what their settings say
// now. Surfaced on the Money screen, where the wrong number actually shows up.
function shareMismatches(){
  const out=[];
  Object.entries(S.users||{}).forEach(([id,u])=>{
    const now=u.profitPct||0;
    const wrong=pastShareSales(id).filter(([,s])=>(s.sellerPct||0)!==now);
    if(wrong.length) out.push({id, name:u.name, now, n:wrong.length,
      pcts:[...new Set(wrong.map(([,s])=>s.sellerPct||0))].sort((a,b)=>b-a)});
  });
  return out;
}
let _fsFrom=null;
function fixShareModal(userId, oldPct){
  const u=S.users[userId], now=u.profitPct||0;
  const all=pastShareSales(userId);
  const wrong=all.filter(([,s])=>(s.sellerPct||0)!==now);
  const byPct={};
  all.forEach(([,s])=>{ const p=s.sellerPct||0; byPct[p]=byPct[p]||{n:0,rev:0};
    byPct[p].n++; byPct[p].rev+=s.total; });
  if(_fsFrom===null) _fsFrom = all.length ? dstr(Math.min(...all.map(([,s])=>s.ts))) : dstr(today0());
  openModal(`<h3><button class="x" onclick="closeModal();rerender()">✕</button>⟳ Profit share on past sales</h3>
    <p class="muted"><b>${esc(u.name)}</b> now keeps <b>${now}%</b> of the profit on their own sales${
      oldPct!==undefined?` (was ${oldPct}%)`:''}. That new figure applies to sales from here on.
      Sales <b>already recorded</b> still carry the share they were rung up at — deliberately, so nobody's history
      changes behind their back. If the old figure was a mistake, correct it here.</p>
    <div class="card"><table>
      <tr><th>Recorded at</th><th class="r">Sales</th><th class="r">Value</th></tr>
      ${Object.entries(byPct).sort((a,b)=>b[0]-a[0]).map(([p,e])=>
        `<tr><td>${p}%${+p===now?' <span class="muted">— current</span>':''}</td>
         <td class="r">${e.n}</td><td class="r">${fmt(e.rev)}</td></tr>`).join('')
        ||'<tr><td colspan="3" class="empty">No sales recorded for this member yet.</td></tr>'}
    </table></div>
    ${wrong.length?`
    <label>Correct every sale on or after this date</label>
    <input type="date" id="fs_from" value="${_fsFrom}" onchange="_fsFrom=this.value;fixShareModal('${userId}')">
    <p class="muted" style="margin:2px 2px 10px">${
      pastShareSales(userId).filter(([,s])=>(s.sellerPct||0)!==now && s.ts>=new Date(_fsFrom+'T00:00').getTime()).length
      } sale(s) on or after ${esc(_fsFrom)} would be changed to ${now}%. Stock, prices and totals are untouched —
      only who keeps the profit changes, so the Money screen and everyone's balances re-add themselves.</p>
    <button class="btn" onclick="pinConfirm('Rewrite the profit share to ${now}% on ${esc(u.name)}\\'s sales from ${esc(_fsFrom)} onwards? Sale amounts and stock are not touched.',()=>applyPctToSales('${userId}',${now},new Date('${_fsFrom}'+'T00:00').getTime()))">
      ⟳ Correct those sales to ${now}%</button>
    <div style="height:8px"></div>
    <button class="btn gray" onclick="pinConfirm('Rewrite the profit share to ${now}% on ALL ${wrong.length} of ${esc(u.name)}\\'s past sales?',()=>applyPctToSales('${userId}',${now},0))">
      ⟳ Correct all ${wrong.length} of them</button>
    <div style="height:8px"></div>`:'<p class="muted">Every recorded sale already sits at '+now+'% — nothing to correct.</p>'}
    <button class="btn gray" onclick="closeModal();rerender()">Leave the history as it is</button>`);
}
async function applyPctToSales(userId,pct,fromTs){
  const hits=pastShareSales(userId).filter(([,s])=>s.ts>=fromTs && (s.sellerPct||0)!==pct);

    await DB.set(['sales',id,'sellerPct'],pct);
    await DB.set(['sales',id,'shareFixed'],{ts:Date.now(), by:meU().name, pct});
  }
  _fsFrom=null; closeModal();
  toast(hits.length? hits.length+' sale(s) corrected to '+pct+'%' : 'Nothing needed changing');
  rerender();
}

async function downloadBackup(){
  let tree, files, fileMeta;
  if(CLOUD){
    toast('Building the backup — reading the whole database…');
    let r; try{ r=await _fx(_restUrl([]),{cache:'no-store'}); }catch(e){ r=null; }
    if(!r||!r.ok){ toast('Could not read the database — check the connection and try again',1); return; }
    tree=await r.json();
    try{
      const rf=await _fx(FIREBASE_CONFIG.databaseURL.replace(/\/+$/,'')+'/threeacesFiles.json',{cache:'no-store'});
      files=rf.ok? await rf.json() : null;
    }catch(e){ files=null; }
    // v3.21 — the size manifest rides along, so a restored database still knows
    // how much room its attachments take.
    try{ const rm=await _fx(_fileMetaUrl(''),{cache:'no-store'}); fileMeta=rm.ok? await rm.json() : null; }catch(e){ fileMeta=null; }
  }else{
    tree=S; files=JSON.parse(localStorage.getItem('threeacesFiles')||'null');
    fileMeta=JSON.parse(localStorage.getItem('threeacesFileMeta')||'null');
  }
  if(!tree||!tree.users){ toast('The database looks empty — backup not saved',1); return; }
  const d=new Date(), pad=n=>String(n).padStart(2,'0');
  const name='three-aces-backup-'+d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'-'+pad(d.getHours())+pad(d.getMinutes())+'.json';
  dl(name, JSON.stringify({app:'Three Aces Club Manager', version:APP_VERSION,
    savedAt:d.toISOString(), data:tree, files:files||null, fileMeta:fileMeta||null}));
  toast('Backup downloaded — keep it somewhere safe (email it to yourself, or a USB stick)');
}
function restoreBackupPick(inp){
  const f=inp.files&&inp.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    let b; try{ b=JSON.parse(rd.result); }catch(e){ toast('That file is not a Three Aces backup',1); return; }
    const OKAPP=['Three Aces Club Manager','Three Aces Sales App'];
    const data=(b&&OKAPP.indexOf(b.app)>=0&&b.data)? b.data : null;
    if(!data||!data.users||!data.items){ toast('That file is not a Three Aces backup',1); return; }
    const when=b.savedAt? new Date(b.savedAt).toLocaleString('en-CA') : 'an unknown date';
    pinConfirm('RESTORE the backup from '+when+'? This REPLACES everything currently in the database — items, stock, sales, users, money, books, attendance — with what is in that file. Every phone switches to it within seconds. This cannot be undone (unless you have a newer backup).',
      async ()=>{
        if(CLOUD){
          const r=await _fx(_restUrl([]),{method:'PUT',body:JSON.stringify(data)});
          if(!r.ok){ toast('Restore failed — check the connection',1); return; }
          if(b.files){ try{ await _fx(FIREBASE_CONFIG.databaseURL.replace(/\/+$/,'')+'/threeacesFiles.json',{method:'PUT',body:JSON.stringify(b.files)}); }catch(e){} }
          if(b.fileMeta){ try{ await _fx(_fileMetaUrl(''),{method:'PUT',body:JSON.stringify(b.fileMeta)}); }catch(e){} }
          _lastJson='';
          S=Object.assign({items:{},users:{},sales:{},settings:{},restocks:{},payments:{}}, data);
        }else{
          S=Object.assign({items:{},users:{},sales:{},settings:{},restocks:{},payments:{}}, data);
          if(b.files) localStorage.setItem('threeacesFiles',JSON.stringify(b.files));
          if(b.fileMeta) localStorage.setItem('threeacesFileMeta',JSON.stringify(b.fileMeta));
          DB._persist();
        }
        if(me && !S.users[me]) me=null;
        toast('Backup restored — everything is back to '+when);
      });
  };
  rd.readAsText(f); inp.value='';
}
/* ---------------------- IS THE DATABASE LOCKED? ----------------------------
   Asks the database for the club data with NO signature attached — exactly what
   a stranger who found the address would get. Data back means it is still wide
   open; "Permission denied" means the lock is doing its job.                  */
let _lockState=null;      // null = not checked yet
async function checkLock(){
  _lockState={busy:true}; renderAdmin();
  let open=null, err='';
  try{
    const r=await fetch(_restUrl(['settings']),{cache:'no-store'});
    if(r.status===401||r.status===403) open=false;
    else if(r.ok){ const t=await r.text(); open = t!=='null'; if(!open) err='the database answered but had nothing to give'; }
    else err='HTTP '+r.status;
  }catch(e){ err=(e&&e.message)||'no answer'; }
  _lockState={open, err, signedIn:_authState==='ok', ts:Date.now()};
  renderAdmin();
}

/* v3.21 — how much room the attachments are taking.
   Reads the little size manifest, NOT the files themselves, so this costs a
   couple of kilobytes however many invoices there are. Attachments saved by
   v3.20 and earlier have no manifest line, so they are counted separately and
   said out loud rather than quietly left out of the total.                 */
async function fileStoreCheck(){
  const box=$('fsBox'); if(box) box.innerHTML='Checking…';
  let meta=null, ids=null;
  try{
    if(CLOUD){
      const r=await _fx(_fileMetaUrl(''),{cache:'no-store'});
      meta=r.ok? await r.json() : null;
      const rs=await _fx(FIREBASE_CONFIG.databaseURL.replace(/\/+$/,'')+'/threeacesFiles.json?shallow=true',{cache:'no-store'});
      ids=rs.ok? await rs.json() : null;
    }else{
      meta=JSON.parse(localStorage.getItem('threeacesFileMeta')||'null');
      ids=JSON.parse(localStorage.getItem('threeacesFiles')||'null');
    }
  }catch(e){ if(box) box.innerHTML='<span class="neg">Could not read the file store — check the connection.</span>'; return; }
  const M=meta||{}, rows=Object.entries(M);
  const total=rows.reduce((a,[,m])=>a+(Number(m&&m.b)||0),0);
  const held=ids? Object.keys(ids).length : rows.length;
  const older=Math.max(0, held-rows.length);
  const big=rows.slice().sort((a,b)=>(b[1].b||0)-(a[1].b||0)).slice(0,3);
  if(!box) return;
  if(!held){ box.innerHTML='No attachments stored yet.'; return; }
  box.innerHTML=`<b>${held} attachment${held===1?'':'s'}</b>`
    + (rows.length? ` · <b>${sizeLabel(total)}</b> across the ${rows.length} saved since v3.21`
        + ` · about <b>${sizeLabel(Math.round(total/rows.length))}</b> each` : '')
    + (older? `<div>${older} older one${older===1?'':'s'} from before v3.21 — their sizes were never recorded,`
        + ` so they are not in that figure. They are the big ones.</div>` : '')
    + (big.length? '<div style="margin-top:6px">Largest: '+big.map(([,m])=>
        esc(m.n||'attachment')+' ('+sizeLabel(m.b)+')').join(' · ')+'</div>' : '');
}

function uploadLogo(inp){
  const f=inp.files&&inp.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const mx=256, sc=Math.min(1, mx/Math.max(img.width,img.height));
      const cv=document.createElement('canvas');
      cv.width=Math.max(1,Math.round(img.width*sc)); cv.height=Math.max(1,Math.round(img.height*sc));
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      let data=cv.toDataURL('image/png');
      if(data.length>400000) data=cv.toDataURL('image/jpeg',0.85);
      DB.set(['settings','logo'],data).then(()=>{ applyLogo(); toast('Logo saved — it now shows on every phone'); rerender(); });
    };
    img.src=rd.result;
  };
  rd.readAsDataURL(f); inp.value='';
}

/* ======================= MEMBER EXPENSE CLAIMS (v3.18) =====================
   Members file their own expenses from the Club tab — category, the date the
   money was actually spent, the amount, an optional receipt photo and a note.
   Nothing is handed over on paper any more.

   An admin then does three things, and only three:
     APPROVE     — the club accepts the cost. THIS is the moment the expense
                   lands in the Books, so the picnic P&L is right the same
                   night, whether or not anybody has been paid yet.
     SEND BACK   — something is wrong. The member fixes it and resubmits.
     DECLINE     — the club is not paying it. It drops out of every total
                   immediately, and can be cleared off the member's list.

   Paying is a SEPARATE, later step, because approving and paying are two
   different facts. Until a claim is paid it shows as cash the club still
   owes that member — a figure Luca does not have today.

   ONE RULE HOLDS THE WHOLE THING TOGETHER: only an APPROVED claim is ever
   counted as owed. Waiting, sent-back and declined claims never touch a
   money tile on either side, so a decline can never look like a debt.

   The receipt is stored in the out-of-band file store (/threeacesFiles),
   exactly like a book-entry invoice, so the 3-second live sync never has to
   download a single photo.                                                  */

const CLAIM_ST={
  waiting :{lab:'Waiting for approval', cls:'gold',  ic:'🕓'},
  back    :{lab:'Sent back to you',     cls:'red',   ic:'↩'},
  approved:{lab:'Approved — not paid',  cls:'green', ic:'✔'},
  paid    :{lab:'Paid',                 cls:'green', ic:'💵'},
  declined:{lab:'Declined',             cls:'red',   ic:'✕'}
};
function claimsAll(){
  return Object.entries(S.claims||{}).sort((a,b)=>(b[1].ts||0)-(a[1].ts||0));
}
function claimsOf(name){
  const k=(name||'').trim().toLowerCase();
  return claimsAll().filter(([,c])=>(c.member||'').trim().toLowerCase()===k);
}
// Only approved-and-unpaid money is owed. Nothing else counts, ever.
function claimOwed(list){
  return Math.round((list||claimsAll()).filter(([,c])=>c.status==='approved')
    .reduce((a,[,c])=>a+(c.amount||0),0)*100)/100;
}
function claimOwedByMember(){
  const out={};
  claimsAll().filter(([,c])=>c.status==='approved')
    .forEach(([,c])=>{ out[c.member]=(out[c.member]||0)+(c.amount||0); });
  return out;
}
// Cash (not e-transfer) that has physically left the club's cash box on claims.
function claimCashPaid(){
  return Math.round(claimsAll().filter(([,c])=>c.status==='paid'&&c.pay&&c.pay.method==='cash')
    .reduce((a,[,c])=>a+(c.amount||0),0)*100)/100;
}
function claimsWaiting(){ return claimsAll().filter(([,c])=>c.status==='waiting'); }

/* Which expense categories members may pick from. Until the admin ticks even
   one, everything visible on the books is offered — nobody has to configure
   anything to start using this. */
function finMemberCats(){
  const F=S.finance||{};
  const all=((F.cats||FIN_SEED.cats).expense||[]);
  const hid=((F.catsHidden||{}).expense)||[];
  const vis=all.filter(c=>!hid.includes(c));
  const pick=F.catsMember;
  if(!Array.isArray(pick)) return vis;              // never configured → everything
  return vis.filter(c=>pick.includes(c));
}
function claimStamp(c,what){
  const t=Array.isArray(c.trail)?c.trail.slice():[];
  t.push({ts:Date.now(), by:(meU()&&meU().name)||'', what});
  return t;
}

async function claimSave(){
  const cat=($('cl_cat').value||'').trim();
  if(!cat){ toast('Pick what the expense was for',1); return; }
  const amt=parseFloat(String($('cl_amt').value).replace(/[^0-9.]/g,''))||0;
  if(amt<=0){ toast('Enter how much you paid',1); return; }
  const d=$('cl_date').value;
  const date=d? new Date(d+'T12:00').getTime() : Date.now();
  if(date>Date.now()+86400000){ toast('That date is in the future — check it',1); return; }
  const note=($('cl_note').value||'').trim().slice(0,400);
  const id=_cl.id, invNew=window._feInvNew;
  const old=id? ((S.claims||{})[id]||{}) : null;
  let receipt=_cl.receipt;
  if(invNew){
    const fid=newId();
    try{ await fileSave(fid, invNew); receipt='file:'+fid; }
    catch(e){ toast('Could not save the receipt — check the connection',1); return; }
  }
  const mine=meU().name;
  if(id){
    const ch=[];
    if(Math.abs((old.amount||0)-amt)>0.005) ch.push(fmt(old.amount||0)+' → '+fmt(amt));
    if((old.cat||'')!==cat) ch.push('category '+(old.cat||'—')+' → '+cat);
    if(dstr(old.date||0)!==dstr(date)) ch.push('date '+dstr(old.date||0)+' → '+dstr(date));
    if((old.receipt||'')!==(receipt||'')) ch.push(receipt?'receipt attached':'receipt removed');
    await DB.set(['claims',id],{...old, cat, date, amount:Math.round(amt*100)/100, note:note||null,
      receipt:receipt||null, status:'waiting', backNote:null,
      trail:claimStamp(old, (old.status==='back'?'Fixed and resent':'Edited')+(ch.length?' — '+ch.join(', '):''))});
    closeModal(); toast('Sent back in for approval'); rerender(); return;
  }
  const c={ts:Date.now(), member:mine, cat, date, amount:Math.round(amt*100)/100,
    note:note||null, receipt:receipt||null, status:'waiting',
    trail:[{ts:Date.now(), by:mine, what:'Filed — '+fmt(amt)+' · '+cat+(receipt?' · receipt attached':' · no receipt')}]};
  await DB.set(['claims',newId()], c);
  closeModal(); toast('Expense submitted — an Administrator will review it'); rerender();
}

async function claimApproveGo(id){
  const c=(S.claims||{})[id]; if(!c) return;
  const amt=parseFloat(String(($('ca_amt')||{}).value||c.amount).replace(/[^0-9.]/g,''))||0;
  if(amt<=0){ toast('Enter the amount you are approving',1); return; }
  const changed=Math.abs(amt-(c.amount||0))>0.005;
  // The book entry — same shape as any expense typed in on the Books tab, so it
  // flows into the year totals, the category rows and the Event P&L untouched.
  const txnId=c.txnId||newId();
  await DB.set(['finance','txns',txnId],{
    ts:c.date||c.ts, kind:'expense', cat:c.cat, amount:Math.round(amt*100)/100,
    member:c.member||null, sponsor:null, inkind:false,
    note:(c.note?c.note+' — ':'')+'member expense claim', by:meU().name,
    picFor:(($('ca_picfor')||{}).value)||null,
    invoice:c.receipt||null, claim:id});

    picFor:(($('ca_picfor')||{}).value)||null,

    trail:claimStamp(c,'Approved'+(changed?' — '+fmt(c.amount||0)+' → '+fmt(amt):'')+' · written into the books')});

/* ====================== MEMBER SPONSOR LOGGING (v3.21) ====================
   Luca: "there is no facility for the member to upload their sponsor and
   whether it is in kind or cash ... when they secure it, it needs to be date
   stamped and then they should be able to submit it to admin. When Admin
   receives the cash or confirmation of in kind donation they should have
   their sponsor requirement completed."

   THE ONE RULE THAT DRIVES THE WHOLE DESIGN: the sponsor board must never
   show money the club has not actually received. So a member's entry does
   NOT write a Donations entry into the books. It lives in its own store
   until an admin confirms it, and the ADMIN'S CONFIRMATION is what writes
   the book entry. sponsorSecured() carries on reading the books exactly as
   it always did, and the books stay honest.

   The written entry is dated to the day the member SECURED it, not the day
   the admin got round to confirming it — so a sponsor landed on July 29th
   counts in the season it was earned in, even if it is confirmed in August.

   An admin can still type a donation straight into the books the old way.
   That path is untouched: it is how sponsors that never went through a
   member get recorded.                                                     */

const SPON_ST={
  chasing :{lab:'Chasing it',                 cls:'gold',  ic:'🔎'},
  secured :{lab:'Got it — not sent in yet',   cls:'gold',  ic:'✋'},
  waiting :{lab:'Waiting for an Administrator',       cls:'gold',  ic:'🕓'},
  back    :{lab:'Sent back to you',           cls:'red',   ic:'↩'},
  done    :{lab:'Confirmed — it counts',      cls:'green', ic:'✔'},
  declined:{lab:'Declined',                   cls:'red',   ic:'✕'}
};
function sponsAll(){
  return Object.entries(S.sponsors||{}).sort((a,b)=>(b[1].ts||0)-(a[1].ts||0));
}
function sponsOf(name){
  const k=(name||'').trim().toLowerCase();
  return sponsAll().filter(([,r])=>(r.member||'').trim().toLowerCase()===k);
}
// The season an entry belongs to is decided by the day it was SECURED, so
// nothing has to be moved on Aug 1 — the records sort themselves.
function sponsYearOf(r){ return sponsorYearOf((r&&(r.securedTs||r.ts))||Date.now()); }
function sponsIn(y,list){ return (list||sponsAll()).filter(([,r])=>sponsYearOf(r)===y); }
function sponsWaiting(){ return sponsAll().filter(([,r])=>r.status==='waiting'); }
function sponsBadge(){ const n=sponsWaiting().length; return n? ' ('+n+')' : ''; }
// Anything a member has logged that has NOT been confirmed. It is shown to
// them so they can see it is not lost — and it is never added to the quota,
// because the club has not got the money yet.
const SPON_PENDING=['chasing','secured','waiting','back'];
function sponsPending(list){
  return Math.round((list||[]).filter(([,r])=>SPON_PENDING.indexOf(r.status)>=0)
    .reduce((a,[,r])=>a+(r.amount||0),0)*100)/100;
}
function sponsStamp(r,what){
  const t=Array.isArray(r&&r.trail)? r.trail.slice() : [];
  t.push({ts:Date.now(), by:(meU()&&meU().name)||'', what});
  return t;
}
/* Two members ringing the same business is a real problem at this club, so
   the app says so — as a warning, never as a block. The member on the phone
   knows things the app does not.                                           */
function sponsDupes(bizName,y,exceptId){
  const k=(bizName||'').trim().toLowerCase();
  if(!k) return [];
  const mine=((meU()||{}).name||'').trim().toLowerCase();
  return sponsIn(y).filter(([id,r])=>id!==exceptId
    && (r.sponsor||'').trim().toLowerCase()===k
    && (r.member||'').trim().toLowerCase()!==mine
    && r.status!=='declined');
}
function sponsWhatLine(r){
  return (r.kind==='inkind'? 'In-kind — '+((r.what||'goods or services')) : 'Cash');
}

      <p style="margin:6px 0 0;white-space:pre-wrap">${esc(r.backNote)}</p>
      <p class="muted" style="margin:6px 0 0">Fix it below and send it in again.</p></div>`:''}
    <p class="muted">Log the business here as soon as you have spoken to them. Nothing you enter goes into the
      club's books — an Administrator does that when the money or the goods actually arrive, and <b>that</b> is what

      <button type="button" id="spKcash" class="${_spKind==='cash'?'on':''}" onclick="sponsKind('cash')">💵 Cash</button>
      <button type="button" id="spKink" class="${_spKind==='inkind'?'on':''}" onclick="sponsKind('inkind')">🎁 In-kind</button>
    </div>
    <p class="muted" id="sp_kindhelp" style="margin:0 0 8px"></p>

    <div class="payrow">
      <button type="button" id="spSchasing" onclick="sponsStatusPick('chasing')">🔎 Still chasing</button>
      <button type="button" id="spSsecured" onclick="sponsStatusPick('secured')">✋ Got it — not ready to send</button>
      <button type="button" id="spSwaiting" onclick="sponsStatusPick('waiting')">🕓 Send it to an Administrator</button>
    </div>
    <p class="muted" id="sp_stathelp" style="margin:0 0 10px"></p>

    <img id="feInvPrev" src="" style="max-height:130px;border-radius:8px;display:none;margin:4px 0">
    <div id="feInvName" class="muted" style="display:${hasFile?'block':'none'};margin:4px 0">📎 Already attached to this sponsor</div>
    <div class="rowbtns">
      <button class="btn gray" type="button" onclick="$('feInvCam').click()">📷 Take a photo</button>
      <button class="btn gray" type="button" onclick="$('feInvFile').click()">📎 Attach a file</button>
    </div>
    <div class="rowbtns">
      <button class="btn gray" type="button" onclick="_sp.file=null;window._feInvNew=null;$('feInvPrev').style.display='none';$('feInvName').style.display='none';toast('Photo removed')">Remove</button>

      to just take one with your phone.</p>

    <input id="sp_note" value="${esc(r.note||'')}" placeholder="e.g. Cheque to be picked up from Tony at the shop">

    <div style="height:8px"></div>
    <button class="btn gray" onclick="closeModal()">Cancel</button>`);
  sponsKind(_spKind); sponsStatusPick(_spStatus); sponsDupWarn();
}
function sponsKind(k){
  _spKind=k;
  const a=$('spKcash'), b=$('spKink'); if(a) a.className=k==='cash'?'on':''; if(b) b.className=k==='inkind'?'on':'';
  const w=$('sp_whatwrap'); if(w) w.style.display = k==='inkind'?'block':'none';
  const l=$('sp_amtlab'); if(l) l.textContent = k==='inkind'? 'What is it worth $' : 'How much $';
  const h=$('sp_kindhelp');
  if(h) h.innerHTML = k==='inkind'
    ? 'Goods or services instead of money — food, printing, a prize. It still counts toward your sponsor in full, '
      +'but it is never counted as club cash, so put down what it is <b>worth</b>.'
    : 'A cheque, an e-transfer or cash. It goes into the club’s books as income once an Administrator has it in hand.';
}
function sponsStatusPick(s){
  _spStatus=s;
  ['chasing','secured','waiting'].forEach(k=>{ const b=$('spS'+k); if(b) b.className = k===s?'on':''; });
  const h=$('sp_stathelp');
  if(h) h.innerHTML = s==='chasing'
    ? 'Still talking to them. Nobody is asked to do anything — but it shows on an Administrator’s list as being chased, '
      +'so another member does not ring the same business.'
    : s==='secured'
    ? 'They have said yes but you are not ready to hand it over. It waits on your list until you send it in.'
    : 'Goes to an Administrator now. When they have the '+(_spKind==='inkind'?'goods confirmed':'money in hand')
      +', they confirm it and your sponsor for the season is done.';
}
function sponsDupWarn(){
  const box=$('sp_dup'); if(!box) return;
  const biz=(($('sp_biz')||{}).value||'').trim();
  const d=sponsDupes(biz, currentSponsorYear(), _sp&&_sp.id);
  box.innerHTML = d.length
    ? '<span class="neg">⚠ '+d.map(([,r])=>esc(r.member||'Someone')+' logged '+esc(r.sponsor||'')+' on '
        +new Date(r.securedTs||r.ts).toLocaleDateString('en-CA',{month:'short',day:'numeric'})).join('; ')
      +'. Worth a word before you call them — you are not blocked.</span>'
    : '';
}
async function sponsSave(){
  const biz=(($('sp_biz')||{}).value||'').trim();
  if(!biz){ toast('Put the business name in',1); return; }
  const amt=Math.round((parseFloat(String((($('sp_amt')||{}).value||'')).replace(/[^0-9.]/g,''))||0)*100)/100;
  const what=(($('sp_what')||{}).value||'').trim();
  if(_spKind==='inkind' && !what){ toast('Say what they are giving',1); return; }
  // Chasing is allowed with no figure yet — everything else has to have one,
  // because the quota is a number and the board has to add up.
  if(_spStatus!=='chasing' && amt<=0){ toast(_spKind==='inkind'?'Put down what it is worth':'Put down how much it is for',1); return; }
  const d=(($('sp_date')||{}).value||'');
  const securedTs = d? new Date(d+'T12:00').getTime() : Date.now();
  if(securedTs > Date.now()+86400000){ toast('That date is in the future — check it',1); return; }
  const note=(($('sp_note')||{}).value||'').trim().slice(0,400);
  const id=_sp.id, invNew=window._feInvNew;
  const old=id? ((S.sponsors||{})[id]||{}) : null;
  let file=_sp.file;
  if(invNew){
    const fid=newId();
    try{ await fileSave(fid, invNew); file='file:'+fid; }
    catch(e){ toast('Could not save the photo — check the connection',1); return; }
  }
  const mine=meU().name;
  const core={sponsor:biz, kind:_spKind, amount:amt, what:_spKind==='inkind'?(what||null):null,
    securedTs, note:note||null, file:file||null};
  if(id){
    const ch=[];
    if((old.sponsor||'')!==biz) ch.push('sponsor '+(old.sponsor||'—')+' → '+biz);
    if(Math.abs((old.amount||0)-amt)>0.005) ch.push(fmt(old.amount||0)+' → '+fmt(amt));
    if((old.kind||'cash')!==_spKind) ch.push('now '+(_spKind==='inkind'?'in-kind':'cash'));
    if(dstr(old.securedTs||0)!==dstr(securedTs)) ch.push('secured '+dstr(old.securedTs||0)+' → '+dstr(securedTs));
    if((old.status||'')!==_spStatus) ch.push('now '+((SPON_ST[_spStatus]||{}).lab||_spStatus).toLowerCase());
    await DB.set(['sponsors',id],{...old, ...core, status:_spStatus, backNote:null,
      trail:sponsStamp(old,(old.status==='back'?'Fixed and sent in again':'Edited')+(ch.length?' — '+ch.join(', '):''))});
    closeModal();
    toast(_spStatus==='waiting'?'Sent to an Administrator':'Saved'); rerender(); return;
  }
  const rec={ts:Date.now(), member:mine, ...core, status:_spStatus,
    trail:[{ts:Date.now(), by:mine, what:'Logged — '+biz+' · '+(_spKind==='inkind'?'in-kind':'cash')
      +(amt>0?' '+fmt(amt):'')+' · secured '+dstr(securedTs)}]};
  await DB.set(['sponsors',newId()], rec);
  closeModal();
  toast(_spStatus==='waiting'? 'Sent to an Administrator — they confirm it when it lands'
      : _spStatus==='secured'? 'Saved — send it in when you are ready'
      : 'Saved — logged as being chased');
  rerender();
}
function sponsSubmit(id){
  const r=(S.sponsors||{})[id]||{};
  if(!(r.amount>0)){ toast('Put a figure on it first — open it and edit',1); return; }
  DB.set(['sponsors',id],{...r, status:'waiting', backNote:null,
    trail:sponsStamp(r,'Sent in to an Administrator')}).then(()=>{ toast('Sent to an Administrator'); rerender(); });
}
function sponsWithdraw(id){
  const r=(S.sponsors||{})[id]||{};
  pinConfirm('Withdraw your '+(r.sponsor||'sponsor')+' entry? It disappears completely — nothing is recorded '
    +'and nobody is asked to confirm anything.',
    async()=>{ await DB.set(['sponsors',id],null); toast('Withdrawn'); });
}
async function sponsClearDeclined(id){
  const r=(S.sponsors||{})[id]||{};
  await DB.set(['sponsors',id,'declineHidden'],true);
  await DB.set(['sponsors',id,'trail'],sponsStamp(r,'Cleared off the member\'s list'));
  toast('Cleared off your list'); rerender();
}

/* --------------- MEMBER: THE SPONSOR BLOCK ON THE CLUB TAB ---------------- */
/* Sits under the ⭐ My sponsor tile. The tile itself still reads the BOOKS, so
   what "counts" is unchanged; this only adds what the member has logged and
   what is still waiting on somebody.                                        */
function sponsorMineHTML(sy){
  const u=meU(); if(!u) return '';
  const mine=sponsIn(sy, sponsOf(u.name));
  const shown=mine.filter(([,r])=>!(r.status==='declined'&&r.declineHidden));
  const pend=sponsPending(mine);
  let h=`<button class="btn" onclick="sponsorModal()">＋ Log a sponsor</button>`;
  if(pend>0.005) h+=`<p class="muted" style="margin:6px 0 0"><b>${fmt(pend)} logged and waiting.</b>
    It is not counted above until an Administrator has the money or the goods in hand — that is what keeps the
    club's sponsor board honest. Nothing is lost; it is all listed below.</p>`;
  h+='<div style="height:10px"></div>';
  if(!shown.length) return h+`<div class="empty">You haven't logged a sponsor for this season yet.</div>`;
  h+=shown.map(([id,r])=>{
    const m=SPON_ST[r.status]||SPON_ST.waiting;
    const editable=SPON_PENDING.indexOf(r.status)>=0;
    return `<div class="card"${r.status==='declined'?' style="opacity:.55"':''}>
      <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap">
        <b>${esc(r.sponsor||'')}</b><b class="goldtxt">${r.amount>0?fmt(r.amount):'—'}</b></div>
      <div class="muted">${esc(sponsWhatLine(r))} · secured ${new Date(r.securedTs||r.ts).toLocaleDateString('en-CA',{month:'short',day:'numeric',year:'numeric'})}${r.note?' · '+esc(r.note):''}</div>
      <div style="margin-top:6px"><span class="voidtag" style="color:var(--${m.cls==='green'?'pos':m.cls==='gold'?'gold':'neg'})">${m.ic} ${m.lab}</span>
        ${r.kind==='inkind'?' <span class="memberflag">IN-KIND</span>':''}</div>
      ${r.status==='back'&&r.backNote?`<div style="margin-top:6px;color:var(--gold)">↩ ${esc(r.backNote)}</div>`:''}
      ${r.status==='declined'&&r.declineNote?`<div style="margin-top:6px" class="neg">✕ ${esc(r.declineNote)}</div>`:''}
      ${r.status==='done'?`<div style="margin-top:6px" class="pos">✔ Confirmed by ${esc(r.confirmedBy||'an Administrator')}
        on ${new Date(r.confirmedTs||Date.now()).toLocaleDateString('en-CA')} — it is in the books and it counts.</div>`:''}
      <div class="rowbtns" style="margin-top:8px">
        ${r.file?`<button class="btn small gray" onclick="sponsViewFile('${id}')">📎 Photo</button>`:''}
        <button class="btn small gray" onclick="sponsTrail('${id}')">🕘 History</button>
        ${editable?`<button class="btn small gray" onclick="sponsorModal('${id}')">✎ Edit</button>`:''}
        ${(r.status==='chasing'||r.status==='secured')?`<button class="btn small" onclick="sponsSubmit('${id}')">🕓 Send to an Administrator</button>`:''}
        ${editable?`<button class="btn small red" onclick="sponsWithdraw('${id}')">Withdraw</button>`:''}
        ${r.status==='declined'?`<button class="btn small gray" onclick="sponsClearDeclined('${id}')">Clear off my list</button>`:''}
      </div></div>`;
  }).join('');
  return h;
}

  const card=([id,r],mode)=>`<div class="card">
    <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap">
      <b>${esc(r.member||'')}</b><b class="goldtxt">${r.amount>0?fmt(r.amount):'—'}</b></div>

    ${!r.file?`<div style="margin-top:6px"><span class="memberflag">NO PHOTO ATTACHED</span></div>`:''}
    ${r.status==='done'?`<div class="pos" style="margin-top:6px">✔ Confirmed ${new Date(r.confirmedTs||r.ts).toLocaleDateString('en-CA')}
      by ${esc(r.confirmedBy||'')} — written into the books dated ${new Date(r.securedTs||r.ts).toLocaleDateString('en-CA')}</div>`:''}
    ${r.status==='declined'?`<div class="neg" style="margin-top:6px">✕ Declined${r.declineNote?' — '+esc(r.declineNote):''}</div>`:''}
    ${r.status==='back'?`<div style="margin-top:6px;color:var(--gold)">↩ Sent back${r.backNote?' — '+esc(r.backNote):''}</div>`:''}
    <div class="rowbtns noprint" style="margin-top:8px">
      ${r.file?`<button class="btn small gray" onclick="sponsViewFile('${id}')">📎 Photo</button>`
              :`<button class="btn small gray" disabled style="opacity:.4">No photo</button>`}
      <button class="btn small gray" onclick="sponsTrail('${id}')">🕘 History</button>
      ${mode==='waiting'?`<button class="btn small" onclick="sponsConfirm('${id}')">✓ ${r.kind==='inkind'?'In-kind confirmed':'Cash received'}</button>
        <button class="btn small gray" onclick="sponsBackSheet('${id}')">↩ Send back</button>
        <button class="btn small red" onclick="sponsDeclineSheet('${id}')">✕ Decline</button>`:''}
      ${mode==='chasing'?`<button class="btn small" onclick="sponsConfirm('${id}')">✓ Confirm it anyway</button>`:''}
      ${r.status==='done'?`<button class="btn small red" onclick="sponsUnconfirm('${id}')">↩ Undo the confirmation</button>`:''}
      ${isAdmin()?`<button class="btn small red" onclick="sponsDelete('${id}')">🗑</button>`:''}
    </div></div>`;
  return printHead('Member sponsors — '+sponsorYearLabel(y),'As at '+new Date().toLocaleDateString('en-CA')) + `
    <p class="muted noprint">Members log their own sponsors on their Club tab. Nothing they log touches the books —
      <b>confirming</b> is what writes the donation in, and the entry is dated to the day the member
      <b>secured</b> it, not today. That is what puts it in the right sponsor season when somebody lands one on
      July 29th and you confirm it in August. You can still type a donation straight into the Books the old way
      for any sponsor that never went through a member.</p>
    <div class="tabbar noprint">${years.map(yy=>
      `<button class="${yy===y?'on':''}" onclick="sponsorYr=${yy};rerender()">${yy}</button>`).join('')}</div>
    <div class="statgrid">

      <div class="stat"><div class="v">${chasing.length}</div>
        <div class="l">Being chased</div><div class="sub">logged, not sent in yet</div></div>
    </div>

    ${waiting.map(x=>card(x,'waiting')).join('')||'<div class="empty">Nothing waiting — you are all caught up.</div>'}
    <h2>🔎 Being chased</h2>
    ${chasing.length?`<p class="muted noprint">Members have logged these but not sent them in. They are here so

    <div class="card">
      <div style="display:flex;justify-content:space-between"><span>${esc(r.member||'')}</span><b class="goldtxt">${fmt(r.amount||0)}</b></div>
      <div><b>${esc(r.sponsor||'')}</b> — ${esc(sponsWhatLine(r))}</div>
      <div class="muted">Secured ${when}${r.note?' · '+esc(r.note):''}</div>
    </div>
    <label>Amount you are confirming $</label>

    <div class="card" style="border-color:var(--gold)">
      <b>What this does</b>
      <p class="muted" style="margin:6px 0 0">Writes a <b>Donations</b> entry into the Books for
        <b>${esc(r.member||'')}</b> dated <b>${when}</b> — the day they secured it, not today — so it lands in the

          ? 'It is marked <b>in-kind</b>, so it completes their sponsor but is never counted as club cash.'
          : 'It counts as club income the same as a donation you type in yourself.'}
        Their sponsor requirement is completed the moment you press this.</p>
    </div>
    <button class="btn" onclick="sponsConfirmGo('${id}')">✓ Confirm and put it in the books</button>
    <div style="height:8px"></div>
    <button class="btn gray" onclick="closeModal()">Cancel</button>`);
}
async function sponsConfirmGo(id){
  const r=(S.sponsors||{})[id]; if(!r) return;
  const amt=Math.round((parseFloat(String((($('sc_amt')||{}).value||r.amount)).replace(/[^0-9.]/g,''))||0)*100)/100;
  if(amt<=0){ toast('Enter the amount you are confirming',1); return; }
  const changed=Math.abs(amt-(r.amount||0))>0.005;
  /* The book entry. Same shape as a donation typed straight in on the Books
     tab, so sponsorSecured(), the sponsor board, the year totals and the Event
     P&L all pick it up with nothing changed. `sponsorId` here and `txnId` on
     the record are the pair that stops it ever being written twice.        */
  const txnId=r.txnId||newId();
  await DB.set(['finance','txns',txnId],{
    ts:r.securedTs||r.ts, kind:'income', cat:'Donations', amount:amt,
    member:r.member||null, sponsor:r.sponsor||null, inkind:r.kind==='inkind',
    note:(r.kind==='inkind'?(r.what?r.what+' — ':'')+'in-kind sponsor':'member sponsor')
      +(r.note?' — '+r.note:''),
    by:meU().name, invoice:r.file||null, sponsorId:id});
  await DB.set(['sponsors',id],{...r, amount:amt, status:'done', txnId,
    confirmedBy:meU().name, confirmedTs:Date.now(), backNote:null,
    trail:sponsStamp(r,'Confirmed'+(changed?' — '+fmt(r.amount||0)+' → '+fmt(amt):'')
      +' · written into the books dated '+dstr(r.securedTs||r.ts))});
  // toast() writes with textContent, so escaping here would show a literal &amp;.
  closeModal(); toast('Confirmed — '+(r.member||'')+"'s sponsor is complete"); rerender();
}
function sponsUnconfirm(id){
  const r=(S.sponsors||{})[id]||{};
  pinConfirm('Undo the confirmation of '+(r.member||'')+"'s "+(r.sponsor||'sponsor')+'? The donation comes '
    +'straight back out of the books, and their sponsor goes back to not being complete.',
    async()=>{
      if(r.txnId) await DB.set(['finance','txns',r.txnId],null);
      await DB.set(['sponsors',id],{...r, status:'waiting', txnId:null, confirmedBy:null, confirmedTs:null,
        trail:sponsStamp(r,'Confirmation undone — book entry removed')});
      toast('Confirmation undone');
    });
}
function sponsBackSheet(id){
  const r=(S.sponsors||{})[id]||{};
  openModal(`<h3><button class="x" onclick="closeModal()">✕</button>↩ Send it back to ${esc(r.member||'')}</h3>
    <p class="muted">Use this when something needs fixing — the wrong figure, the wrong date, no photo of the
      cheque. They see your note, fix it and send it in again. Nothing goes into the books in the meantime and
      their sponsor stays outstanding.</p>
    <label>What needs fixing?</label>
    <textarea id="sb_note" rows="3" placeholder="e.g. Can you photograph the cheque before you drop it in?"></textarea>

/* ========================= THE PICNIC MODULE (v3.19) ======================
   Three things live in here, and they are all the same picnic:

     SUPPLIES  — the seven bins in Luca's mezzanine. Every item carries a
                 TARGET ("how many we need") that survives from year to year,
                 and a COUNT ("how many are actually there") that is wiped at
                 the start of each new picnic year. Subtract one from the
                 other and you have the shopping list; nobody types it.

     JOBS      — the Master List, as real to-do lists. Every job belongs to
                 one person (or to "Anyone"). Only an admin may add, remove or
                 reassign a job. Everybody can SEE every job — that is the
                 point of a club list — but a member may only tick their own.

     THE DAY   — the running order, 7:45am to 9pm, with who is on each station
                 and what that station needs. An admin can move the times and
                 change who is on. It is the one part members cannot edit at
                 all, because a timetable that anyone can shift is not a
                 timetable.

   there are none" are DIFFERENT FACTS. A missing `have` means nobody has been
   to that bin — it is grey, and it never appears on the shopping list. A
   `have` of 0 means somebody looked and the bin was empty — it is red, and it
   does. A spreadsheet cannot tell those two apart, which is exactly why the
   count has always been guesswork.

   Firebase drops null values on write, so an absent `have` key IS the "not
   counted" state — no extra flag needed, and clearing a count is a delete. */
