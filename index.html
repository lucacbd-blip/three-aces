<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d0d0d">
<title>Three Aces Club Manager</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🂡</text></svg>">
<style>
  :root{ /* LIGHT theme (default) */
    --green:#00813e; --red:#ce2b37; --white:#f4f4f4;
    --bg:#f6f6f3; --panel:#ffffff; --panel2:#efefec; --line:#d6d6d0; --line2:#e8e8e3;
    --text:#1c1c1c; --muted:#63636b; --gold:#9a7300; --star-w:#b7b7b7;
    --hdrbg:#ffffff; --navbg:#ffffff; --togoff:#c9c9c9;
    --pos:#0d7a3e; --neg:#c62828; --memberbg:#d9f2e4; --membertx:#0d6832;
  }
  body.dark{
    --green:#009246;
    --bg:#0d0d0d; --panel:#1a1a1a; --panel2:#242424; --line:#333; --line2:#222;
    --text:#f2f2f2; --muted:#9a9a9a; --gold:#e8c34a; --star-w:#f4f4f4;
    --hdrbg:#000; --navbg:#000; --togoff:#444;
    --pos:#7ee2a8; --neg:#ff8a80; --memberbg:#00331b; --membertx:#7ee2a8;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  body{padding-bottom:calc(70px + env(safe-area-inset-bottom));}
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit;font-size:16px;background:var(--panel2);color:var(--text);
    border:1px solid var(--line);border-radius:8px;padding:10px;width:100%;}
  textarea{resize:vertical;line-height:1.35;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--green);}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.5px;}

  /* Header */
  header{position:sticky;top:0;z-index:50;background:var(--hdrbg);
    border-bottom:2px solid var(--line);padding:10px 14px calc(8px);display:flex;align-items:center;gap:10px;}
  .tricolor{height:4px;background:linear-gradient(90deg,var(--green) 33%,var(--white) 33% 66%,var(--red) 66%);
    position:fixed;top:0;left:0;right:0;z-index:60;}
  header img.logo{height:44px;width:44px;object-fit:contain;border-radius:8px;}
  .brand{flex:1;line-height:1.1;}
  .brand .stars{font-size:11px;letter-spacing:3px;}
  .stars .g{color:var(--green);} .stars .w{color:var(--star-w);} .stars .r{color:var(--red);}
  .brand h1{margin:0;font-size:17px;letter-spacing:2px;font-weight:800;}
  .brand small{color:var(--muted);font-size:10px;letter-spacing:.5px;display:block;}
  .userchip{background:var(--panel2);border:1px solid var(--line);border-radius:20px;
    padding:6px 12px;font-size:13px;color:var(--text);display:flex;align-items:center;gap:6px;}
  .userchip b{color:var(--gold);}
  .mode-banner{background:#3a2f00;color:#ffd54f;text-align:center;font-size:12px;padding:5px;}
  .mode-banner.online{background:#00331b;color:#7ee2a8;}

  /* Views */
  .view{display:none;padding:14px;max-width:760px;margin:0 auto;}
  .view.active{display:block;}
  h2{font-size:15px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin:18px 0 10px;}
  h2:first-child{margin-top:4px;}

  /* Login */
  #login{max-width:420px;margin:0 auto;padding:24px 18px;}
  .login-logo{text-align:center;margin:18px 0 26px;}
  .login-logo img{max-width:170px;border-radius:14px;}
  .login-logo .stars{font-size:22px;letter-spacing:10px;margin-top:8px;}
  .login-logo h1{margin:6px 0 0;font-size:26px;letter-spacing:4px;}
  .login-logo p{color:var(--muted);margin:4px 0 0;font-size:12px;letter-spacing:1px;}
  /* PIN pad */
  .pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;}
  .pinpad button{padding:16px;font-size:22px;border-radius:12px;border:1px solid var(--line);
    background:var(--panel2);color:var(--text);cursor:pointer;}
  .pinpad button:active{background:var(--line);}
  .pindots{text-align:center;font-size:28px;letter-spacing:12px;min-height:40px;color:var(--gold);}
  .pinerr{color:var(--red);text-align:center;font-size:13px;min-height:18px;}

  /* Sell screen */
  .catbar{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px;}
  .catbar button{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);color:var(--muted);
    border-radius:18px;padding:8px 14px;font-size:13px;cursor:pointer;white-space:nowrap;}
  .catbar button.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:700;}
  .itemcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;}
  .itemcard .top{display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
  .itemcard .nm{font-size:16px;font-weight:700;}
  .itemcard .meta{font-size:12px;color:var(--muted);margin-top:2px;}
  .itemcard .price{color:var(--gold);font-weight:700;font-size:15px;}
  .sizerow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
  .sizebtn{min-width:64px;padding:10px 8px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel2);color:var(--text);font-size:14px;font-weight:700;cursor:pointer;text-align:center;}
  .sizebtn small{display:block;font-weight:400;font-size:11px;color:var(--muted);}
  .sizebtn.out{opacity:.35;}
  .sizebtn.low small{color:var(--gold);}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:baseline;border:1px solid #555;}

  /* Cart */
  #cartbar{position:fixed;bottom:calc(62px + env(safe-area-inset-bottom));left:0;right:0;z-index:40;
    background:var(--green);color:#fff;padding:12px 18px;display:none;justify-content:space-between;
    align-items:center;font-size:16px;font-weight:700;cursor:pointer;}
  #cartbar .n{background:#fff;color:var(--green);border-radius:50%;width:26px;height:26px;
    display:inline-flex;align-items:center;justify-content:center;margin-right:10px;}
  .cartline{display:flex;justify-content:space-between;align-items:center;gap:8px;
    border-bottom:1px solid var(--line);padding:10px 0;}
  .cartline .d{flex:1;}
  .cartline .nm{font-weight:700;}
  .cartline .sub{font-size:12px;color:var(--muted);}
  .saleflag{display:inline-block;background:#ffe1e1;color:#a31515;border-radius:6px;
    font-size:11px;font-weight:800;padding:2px 6px;margin-left:6px;}
  body.dark .saleflag{background:#4a1010;color:#ff9c9c;}
  .memberflag{display:inline-block;background:var(--memberbg);color:var(--membertx);border-radius:6px;
    font-size:11px;padding:2px 6px;margin-left:6px;}
  /* v3.24 — which picnic a book entry was bought for, said out loud on the entry */
  .picfortag{display:inline-block;background:#e7f1ff;color:#12457e;border:1px solid #b9d4f5;
    border-radius:6px;font-size:11px;font-weight:800;padding:2px 6px;margin-left:6px;white-space:nowrap;}
  /* v3.18 — member pricing must be impossible to miss on the Sell tab */
  .memberflag.big{font-size:15px;font-weight:900;letter-spacing:.6px;padding:4px 10px;border-radius:8px;
    text-transform:uppercase;border:2px solid var(--membertx);}
  /* v3.21 — a complimentary has to read differently from a discount at a glance */
  .compflag{display:inline-block;background:#e8ddff;color:#4b2a9c;border-radius:6px;
    font-size:11px;font-weight:900;letter-spacing:.5px;padding:2px 7px;margin-right:6px;}
  body.dark .compflag{background:#2f2350;color:#c3aaff;}
  .memberlink{font-size:14px;font-weight:800;color:var(--gold);text-decoration:none;}
  .memberlink.on{text-transform:uppercase;letter-spacing:.4px;}
  .qtyctl{display:flex;align-items:center;gap:8px;}
  .qtyctl button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);
    background:var(--panel2);color:var(--text);font-size:18px;cursor:pointer;}
  .cart-total{display:flex;justify-content:space-between;font-size:20px;font-weight:800;margin:14px 0;}
  .payrow{display:flex;gap:10px;margin:10px 0 16px;}
  .payrow button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel2);color:var(--text);font-size:15px;cursor:pointer;}
  .payrow button.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:700;}

  /* Generic buttons */
  .btn{display:block;width:100%;padding:14px;border-radius:12px;border:none;font-size:16px;
    font-weight:700;cursor:pointer;background:var(--green);color:#fff;}
  .btn.red{background:var(--red);} .btn.gray{background:var(--panel2);color:var(--text);border:1px solid var(--line);}
  .btn.small{width:auto;display:inline-block;padding:8px 14px;font-size:13px;border-radius:8px;}
  .btn:disabled{opacity:.5;}
  .rowbtns{display:flex;gap:10px;margin-top:10px;}
  .rowbtns .btn{flex:1;}

  /* Tables */
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{color:var(--muted);text-align:left;font-weight:600;font-size:11px;text-transform:uppercase;
    letter-spacing:.5px;padding:8px 6px;border-bottom:1px solid var(--line);}
  td{padding:9px 6px;border-bottom:1px solid var(--line2);}
  td.r,th.r{text-align:right;}
  .pos{color:var(--pos);} .neg{color:var(--neg);} .goldtxt{color:var(--gold);}
  /* Spreadsheet-style listings — scroll sideways on a phone, never squash */
  .scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  table.sheet{min-width:100%;width:max-content;font-size:12.5px;white-space:nowrap;}
  table.sheet th,table.sheet td{padding:7px 10px;}
  table.sheet tr:nth-child(even) td{background:var(--panel2);}
  table.sheet .totrow td{border-top:2px solid var(--line);background:var(--panel2);font-weight:800;}
  table.sheet.grid td:first-child,table.sheet.grid th:first-child{position:sticky;left:0;
    background:var(--panel);box-shadow:1px 0 0 var(--line);}
  table.sheet.grid tr:nth-child(even) td:first-child{background:var(--panel2);}

  /* Cards / stats */
  .statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px;}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;}
  .stat .v{font-size:22px;font-weight:800;}
  .stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}
  .stat.green .v{color:var(--pos);} .stat.gold .v{color:var(--gold);} .stat.red .v{color:var(--neg);}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;}
  .salecard{border-left:4px solid var(--green);}
  .salecard.voided{border-left-color:var(--red);opacity:.55;}
  .salecard .hd{display:flex;justify-content:space-between;font-weight:700;}
  .salecard .lines{font-size:13px;color:var(--muted);margin-top:6px;}
  .voidtag{color:var(--red);font-weight:700;font-size:11px;text-transform:uppercase;}

  /* Admin tabs */
  .tabbar{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;}
  .tabbar button{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);color:var(--muted);
    border-radius:8px;padding:9px 13px;font-size:13px;cursor:pointer;}
  .tabbar button.on{background:var(--panel2);color:var(--gold);border-color:var(--gold);font-weight:700;}

  /* Bottom nav */
  nav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--navbg);border-top:1px solid var(--line);
    display:none;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom));}
  nav button{background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 14px;}
  nav button .ic{font-size:20px;}
  nav button.on{color:var(--gold);}

  /* Modal */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;display:none;
    align-items:flex-end;justify-content:center;}
  .modal-bg.open{display:flex;}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;
    width:100%;max-width:560px;max-height:88vh;overflow-y:auto;padding:18px 16px calc(24px + env(safe-area-inset-bottom));}
  .modal h3{margin:0 0 12px;font-size:17px;}
  .modal .x{float:right;background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;padding:0 4px;}
  .sizeedit{display:grid;grid-template-columns:1.1fr 1fr 1fr .9fr .9fr 30px;gap:5px;align-items:center;margin-bottom:6px;}
  .sizeedit input,.sizeedit select{padding:8px;font-size:14px;}
  .sizeedit .del{background:none;border:none;color:var(--red);font-size:18px;cursor:pointer;}
  .sehead{display:grid;grid-template-columns:1.1fr 1fr 1fr .9fr .9fr 30px;gap:5px;font-size:10px;
    color:var(--muted);text-transform:uppercase;margin-bottom:4px;}
  .rsrow{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;align-items:center;margin-bottom:6px;font-size:13px;}
  .rsrow input{padding:8px;font-size:14px;}
  .rshead{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;font-size:10px;color:var(--muted);text-transform:uppercase;margin-bottom:4px;}

  /* Print (Save as PDF) */
  .printhead{display:none;}
  @media print{
    body{background:#fff !important;color:#000;padding:0;}
    .tricolor,header,nav,#cartbar,#modeBanner,.tabbar,.noprint,.btn,button{display:none !important;}
    .view{display:none;} .view.active{display:block;padding:0;max-width:none;}
    .printhead{display:block;text-align:center;margin-bottom:14px;color:#000;}
    .printhead h1{margin:0;font-size:20px;letter-spacing:2px;}
    .printhead p{margin:2px 0;font-size:12px;color:#333;}
    .card,.stat{background:#fff !important;border:1px solid #bbb !important;color:#000;break-inside:avoid;}
    .stat .v,.stat .l,td,th,h2,b,.goldtxt,.pos,.neg,.muted{color:#000 !important;}
    td,th{border-bottom:1px solid #ddd;}
    h2{color:#000;}
    tr.drill td:first-child::after{content:'' !important;}
  }
  /* a table row you can tap to see what the number is made of */
  tr.drill{cursor:pointer;}
  tr.drill td:first-child::after{content:' ›';color:var(--gold);font-weight:800;}
  tr.drill:active td{background:var(--panel2);}
  .drilltot td{border-top:2px solid var(--line);background:var(--panel2);font-weight:800;}
  .drillrow{cursor:pointer;}
  .drillrow:hover td{background:var(--panel2);}
  .drillrow:active td{background:var(--panel2);}
  .stat .sub{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.35;}
  .stat.drilltile{cursor:pointer;position:relative;}
  .stat.drilltile::after{content:'›';position:absolute;top:8px;right:11px;color:var(--gold);
    font-weight:800;font-size:17px;line-height:1;}
  .stat.drilltile:active{background:var(--panel2);}
  @media print{ .stat.drilltile::after{content:'' !important;} }
  .switchrow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #222;}
  .switchrow .t{font-size:14px;} .switchrow .s{font-size:12px;color:var(--muted);}
  .toggle{width:52px;height:30px;border-radius:15px;background:var(--togoff);border:none;position:relative;cursor:pointer;flex:0 0 auto;}
  .toggle.on{background:var(--green);}
  .toggle::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;
    background:#fff;transition:left .15s;}
  .toggle.on::after{left:25px;}
  .searchbox{margin-bottom:10px;}
  /* Stock grid (all items × all sizes) */
  .gridwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel);}
  .stockgrid{border-collapse:collapse;min-width:100%;}
  .stockgrid th,.stockgrid td{padding:8px 9px;border-bottom:1px solid var(--line2);white-space:nowrap;}
  .stockgrid tr:last-child td{border-bottom:none;}
  .stockgrid .itc{position:sticky;left:0;background:var(--panel);text-align:left;z-index:1;
    min-width:120px;max-width:175px;white-space:normal;line-height:1.25;font-weight:600;}
  .stockgrid td.c{text-align:center;}
  .stockgrid .dim{color:var(--line);}
  .dim{color:var(--muted);opacity:.6;}
  /* attendance grid */
  .attP{color:var(--pos);font-weight:800;} .attL{color:var(--gold);font-weight:800;}
  .attA{color:var(--neg);font-weight:800;} .attAN{color:#e67e22;font-weight:800;}
  .attNP{color:var(--muted);font-weight:800;}
  .attcell{cursor:pointer;user-select:none;min-width:34px;}
  .stockgrid .lowc{color:var(--gold);font-weight:700;}
  .stockgrid th.sz{cursor:pointer;user-select:none;}
  .stockgrid th.sz.on{color:var(--gold);}
  .stockgrid .totrow td{border-top:2px solid var(--line);background:var(--panel2);font-weight:800;}
  .muted{color:var(--muted);font-size:13px;}
  .empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:14px;}
  .toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;
    padding:12px 22px;border-radius:24px;font-weight:700;z-index:200;display:none;box-shadow:0 4px 18px rgba(0,0,0,.5);}
  .toast.err{background:var(--red);}

  /* ------------------------------ THE PICNIC ------------------------------
     Two visual jobs here. One: make "not counted" look unmistakably unlike
     "counted zero", because the whole module hangs on that difference — grey
     and hollow versus red and solid. Two: make a job row tappable with a
     thumb while standing in a shed, so the tick box is 30px and the whole
     row is not a link.                                                     */
  .picbar{height:8px;border-radius:5px;background:var(--line2);overflow:hidden;margin-top:6px;}
  .picbar i{display:block;height:100%;background:var(--pos);transition:width .25s;}
  .picbar.part i{background:var(--gold);}
  .picbin{font-size:11px;font-weight:900;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);
    padding:12px 0 4px;border-bottom:1px solid var(--line2);margin-bottom:2px;}
  .picit{padding:9px 0;border-bottom:1px solid var(--line2);}
  .picit:last-child{border-bottom:0;}
  .picit.sub{padding-left:18px;border-left:2px solid var(--line2);}
  /* v3.21 — a parent item reads as a drawer, so it looks pressable */
  .picit.haskids .picnm .picchev{display:inline-block;width:auto;margin-right:2px;}
  .picit.haskids .picr1:hover .picnm{color:var(--gold);}
  .picr1{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .picr2{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap;}
  .picnm{font-weight:700;font-size:14px;flex:1;min-width:0;}
  .picneed{font-size:12px;color:var(--muted);margin-top:2px;}
  .pictag{font-size:10px;font-weight:900;letter-spacing:.5px;padding:3px 7px;border-radius:6px;white-space:nowrap;}
  .pictag.ok{background:var(--memberbg);color:var(--membertx);}
    .picasg{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:5px;font-size:11.5px;
      background:#fff6f4;border:1px solid #f0d5cd;border-radius:6px;padding:4px 8px;color:#5c4038}
    .picasg .btn{margin-left:auto;padding:2px 8px;font-size:11px}
  .pictag.short{background:var(--red);color:#fff;}
  .pictag.un{background:var(--panel2);color:var(--muted);border:1px dashed var(--line);}
  .pictag.over{background:#fdf0d0;color:var(--gold);}
  /* The counter. One segmented control so the two buttons and the number read
     as a single thing you operate with a thumb, standing at the bin.        */
  .picstep{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:10px;
    overflow:hidden;background:var(--panel2);flex:none;}
  .picstep button{width:38px;border:0;background:none;color:var(--text);font-size:20px;font-weight:800;
    line-height:1;cursor:pointer;padding:0;font-family:inherit;}
  .picstep button:active{background:var(--line2);}
  .picstep input{width:52px;text-align:center;font-size:16px;font-weight:800;padding:8px 0;
    border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);
    background:var(--panel);color:var(--text);font-family:inherit;}
  .picstep input.un{color:var(--muted);font-weight:400;background:var(--panel2);}
  /* The shopping-list quantity — the number you actually have to buy.       */
  .picq{min-width:38px;padding:6px 9px;border-radius:9px;background:var(--red);color:#fff;
    font-size:16px;font-weight:900;text-align:center;flex:none;}
  .picjob{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2);}
  .picjob:last-child{border-bottom:0;}
  .pictick{width:30px;height:30px;flex:none;border-radius:8px;border:2px solid var(--line);background:var(--panel);
    display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;line-height:1;
    cursor:pointer;user-select:none;}
  .pictick.on{background:var(--pos);border-color:var(--pos);color:#fff;}
  .pictick.locked{cursor:default;opacity:.55;}

/* ============================ STORAGE LAYER =============================== */
const CLOUD = !!FIREBASE_CONFIG;
let S = {items:{}, users:{}, sales:{}, settings:{}, restocks:{}, payments:{}};   // live state
let _ref=null, _ready=false, _onChange=()=>{};

function newId(){ return 'k'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

let _initErr=null;
function updateBanner(){
  const b=$('modeBanner'); if(!b) return;
  if(!CLOUD){

  // Connected and working — but warn an admin if the signature isn't going out,

    b.style.display='block'; b.className='mode-banner';
    b.textContent = _authState==='disabled'
      ? '🔓 Sign-in is not switched on yet — the club database is still open to anyone who knows the address. In Firebase → Authentication → Sign-in method → Anonymous → Enable.'

/* Cloud mode talks to the Firebase Realtime Database over plain HTTPS (its REST
   API) — no SDK, nothing for corporate networks to choke on.                  */

/* -------------------------- SIGNING IN (ANONYMOUS) -------------------------
   Every phone quietly signs itself in as an anonymous Firebase user the moment
   the app opens, and every request to the database carries that signature.
   Nobody types anything extra — the club's own name-and-PIN screen is still the
   real front door. What this buys us is the database Rules: once they read
   "auth != null", a stranger who finds the database address gets nothing back.

   Deliberately forgiving. If signing in is unavailable for any reason the app
   carries straight on unsigned, which still works while the Rules are open.
   That is what makes the changeover safe: put the new file on every phone
   FIRST, let them all sign in, and only then tighten the Rules.

   authBase / tokenBase in the config are for testing only — leave them out.  */
const AUTH_BASE  = (FIREBASE_CONFIG && FIREBASE_CONFIG.authBase)  || 'https://identitytoolkit.googleapis.com/v1';
const TOKEN_BASE = (FIREBASE_CONFIG && FIREBASE_CONFIG.tokenBase) || 'https://securetoken.googleapis.com/v1';
const AUTH_STORE = 'threeacesAuth';
let _tok=null, _tokExp=0, _authState='new', _authMsg='', _authPend=null, _authNext=0;

async function _authPost(url, body){
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  let j={}; try{ j=await r.json(); }catch(e){}
  if(!r.ok) throw new Error((j.error&&j.error.message)||('HTTP '+r.status));
  return j;
}
function _authSavedRefresh(){
  try{ return (JSON.parse(localStorage.getItem(AUTH_STORE)||'null')||{}).r||null; }catch(e){ return null; }
}
async function _authFetchToken(){
  const key=encodeURIComponent(FIREBASE_CONFIG.apiKey||'');
  const saved=_authSavedRefresh();
  if(saved){                                   // reuse this phone's anonymous account
    try{
      const j=await _authPost(TOKEN_BASE+'/token?key='+key,
        {grant_type:'refresh_token', refresh_token:saved});
      _tok=j.id_token; _tokExp=Date.now()+((+j.expires_in||3600)*1000);
      try{ localStorage.setItem(AUTH_STORE,JSON.stringify({r:j.refresh_token||saved})); }catch(e){}
      return _tok;
    }catch(e){ try{ localStorage.removeItem(AUTH_STORE); }catch(e2){} }   // stale — start fresh
  }
  const j=await _authPost(AUTH_BASE+'/accounts:signUp?key='+key,{returnSecureToken:true});
  _tok=j.idToken; _tokExp=Date.now()+((+j.expiresIn||3600)*1000);
  try{ localStorage.setItem(AUTH_STORE,JSON.stringify({r:j.refreshToken})); }catch(e){}
  return _tok;
}
async function _authToken(force){
  if(!CLOUD) return null;
  if(!force && _tok && Date.now() < _tokExp-120000) return _tok;   // renew 2 min early
  if(_authPend) return _authPend;                                   // one sign-in at a time
  if(!force && !_tok && Date.now() < _authNext) return null;        // backing off after a failure
  _authPend=(async()=>{
    const was=_authState;
    try{
      const t=await _authFetchToken();
      _authState='ok'; _authMsg=''; _authNext=0;
      if(was!=='ok') updateBanner();
      return t;
    }catch(e){
      const m=(e&&e.message)||'';
      _authState = /OPERATION_NOT_ALLOWED|ADMIN_ONLY|CONFIGURATION_NOT_FOUND/.test(m) ? 'disabled' : 'error';
      _authMsg=m; _tok=null; _tokExp=0; _authNext=Date.now()+60000;
      if(was!==_authState) updateBanner();
      return null;
    }finally{ _authPend=null; }

function _sign(url,tok){ return tok ? url+(url.includes('?')?'&':'?')+'auth='+encodeURIComponent(tok) : url; }

  const tok=await _authToken();

  if(r.status===401 && tok && !_again){
    const t2=await _authToken(true);
    if(t2 && t2!==tok) return _fx(url,opts,true);
  }
  return r;
}

  if(status!==401 && status!==403) return '';
  return _authState==='ok'
    ? ' — this phone signed in, but the database refused it. In Firebase → Realtime Database → Rules, both ".read" and ".write" should be exactly  auth != null  (then Publish).'
    : ' — this phone could not sign in. In Firebase → Authentication → Sign-in method, Anonymous must be Enabled.';
}

let _lastJson='', _pollTimer=null;
function _restUrl(pathArr){
  const base=FIREBASE_CONFIG.databaseURL.replace(/\/+$/,'')+'/threeaces';
  return base + (pathArr&&pathArr.length ? '/'+pathArr.map(encodeURIComponent).join('/') : '') + '.json';
}
function _applyLocal(path, val){   // mirror a write into local state instantly
  let o=S;
  for(let i=0;i<path.length-1;i++){ o[path[i]] = o[path[i]]||{}; o=o[path[i]]; }
  if(val===null) delete o[path[path.length-1]]; else o[path[path.length-1]]=val;
}
const DB = {
  async init(onChange){
    _onChange = onChange;

      updateBanner();   // show "connecting…" right away

      window.addEventListener('focus',()=>this._refresh());
    }else{
      const raw = localStorage.getItem('threeaces');
      if(raw){ S = JSON.parse(raw); }
      else{ this.seed(); }
      _ready=true; setTimeout(_onChange,0);
    }
  },
  async _refresh(){
    try{
      const r=await _fx(_restUrl([]),{cache:'no-store'});

        _initErr=null; _ready=true; updateBanner(); _onChange();
      }
      return true;
    }catch(e){
      if(!_ready){ _initErr='Cannot reach the club database ('+(e.message||e)+').'; updateBanner(); }
      return false;
    }
  },
  async seed(){
    const items={}, users={};
    SEED_ITEMS.forEach((it,i)=>{ items[newId()+i]={name:it.name,cat:it.cat,order:i,active:true,sizes:it.sizes}; });
    SEED_USERS.forEach((u,i)=>{ users[newId()+'u'+i]=u; });
    const full={items,users,sales:{},settings:SEED_SETTINGS,restocks:{},payments:{}};
    if(CLOUD){
      try{
        const r=await _fx(_restUrl([]),{method:'PUT',body:JSON.stringify(full)});
        if(!r.ok) throw new Error('HTTP '+r.status+_ruleHint(r.status));
        _lastJson=JSON.stringify(full); S=full; _initErr=null; _ready=true; updateBanner(); _onChange();
      }catch(e){
        _initErr='Could not write the starting data ('+(e.message||e)+'). Fix that, then refresh.';
        updateBanner();
      }
    }
    else{ S=full; this._persist(); _onChange(); }
  },
  _persist(){ localStorage.setItem('threeaces', JSON.stringify(S)); },
  async set(path, val){          // path: array e.g. ['items', id, 'name']
    if(CLOUD){
      const r=await _fx(_restUrl(path),{method: val===null?'DELETE':'PUT', body: val===null?undefined:JSON.stringify(val)});
      if(!r.ok){ toast(r.status===401||r.status===403?'Save refused — this phone is not signed in':'Save failed — check connection',1); throw new Error('save failed'); }
      _applyLocal(path,val); _lastJson=''; _onChange();
      return;
    }
    _applyLocal(path,val);
    this._persist(); _onChange(); return Promise.resolve();
  },
  push(path, val){
    const id=newId();
    return this.set(path.concat(id), val).then(()=>id);
  },
  // atomic-ish stock change; resolves false if it would go negative.
  // Cloud mode uses the database's ETag compare-and-set so two phones can't
  // both sell the last piece.
  async txnStock(itemId, size, delta){
    if(!S.items[itemId] || !S.items[itemId].sizes || !S.items[itemId].sizes[size]) return false; // item deleted
    if(CLOUD){
      const u=_restUrl(['items',itemId,'sizes',size,'stock']);
      for(let attempt=0; attempt<6; attempt++){
        try{
          const g=await _fx(u,{headers:{'X-Firebase-ETag':'true'},cache:'no-store'});
          if(!g.ok) return false;
          const etag=g.headers.get('ETag');
          const cur=(await g.json())||0;
          if(cur+delta<0) return false;
          const p=await _fx(u,{method:'PUT',
            headers: etag? {'if-match':etag} : {},
            body: JSON.stringify(cur+delta)});
          if(p.ok){
            _applyLocal(['items',itemId,'sizes',size,'stock'],cur+delta);
            _lastJson=''; _onChange();
            return true;
          }
          if(p.status!==412) return false;   // 412 = someone beat us; retry
        }catch(e){ return false; }
      }
      return false;
    }
    const sz = S.items[itemId] && S.items[itemId].sizes[size];
    if(!sz || (sz.stock||0)+delta < 0) return Promise.resolve(false);
    sz.stock=(sz.stock||0)+delta; this._persist(); _onChange();
    return Promise.resolve(true);
  }
};

/* ------------------------- ATTACHED FILE STORE -----------------------------
   Invoices (photos, PDFs, Word files) are stored OUTSIDE the main /threeaces
   node so the 3-second live sync never has to download them — a file is only
   fetched when someone taps 📎 to view it.                                   */
function _filesUrl(id){ return FIREBASE_CONFIG.databaseURL.replace(/\/+$/,'')+'/threeacesFiles/'+encodeURIComponent(id)+'.json'; }
function _fileMetaUrl(id){ return FIREBASE_CONFIG.databaseURL.replace(/\/+$/,'')+'/threeacesFileMeta'+(id?'/'+encodeURIComponent(id):'')+'.json'; }
/* v3.21 — how big something is, in words a person reads without counting zeros. */
function sizeLabel(bytes){
  const b=Number(bytes)||0;
  if(b<1024) return b+' B';
  if(b<1024*1024) return Math.round(b/1024)+' KB';
  return (Math.round(b/1024/1024*10)/10)+' MB';
}
/* The bytes a dataURL actually costs. Base64 is 4 characters per 3 bytes, and
   the string is stored as-is, so the string length IS the storage cost — that
   is the number worth showing, not the decoded size.                        */
function dataUrlBytes(d){ return String(d||'').length; }
async function fileSave(id,obj){        // obj = {name, type, data(dataURL)}
  /* v3.21 — alongside every attachment we write a one-line note of its size to
     a tiny separate node. That is what lets the Data screen say how full the
     file store is without downloading every invoice to find out.            */
  const meta={n:(obj&&obj.name)||'', t:(obj&&obj.type)||'', b:dataUrlBytes(obj&&obj.data), ts:Date.now()};
  if(CLOUD){
    const r=await _fx(_filesUrl(id),{method:'PUT',body:JSON.stringify(obj)});
    if(!r.ok) throw new Error('file save failed'+_ruleHint(r.status));
    try{ await _fx(_fileMetaUrl(id),{method:'PUT',body:JSON.stringify(meta)}); }catch(e){}
    return;
  }
  const all=JSON.parse(localStorage.getItem('threeacesFiles')||'{}');
  all[id]=obj; localStorage.setItem('threeacesFiles',JSON.stringify(all));
  const mt=JSON.parse(localStorage.getItem('threeacesFileMeta')||'{}');
  mt[id]=meta; localStorage.setItem('threeacesFileMeta',JSON.stringify(mt));
}
async function fileLoad(id){
  if(CLOUD){
    try{ const r=await _fx(_filesUrl(id),{cache:'no-store'}); return r.ok? await r.json() : null; }
    catch(e){ return null; }
  }
  return (JSON.parse(localStorage.getItem('threeacesFiles')||'{}'))[id]||null;
}

/* ------------------------- SALES GROUPS -----------------------------------
   Every item belongs to ONE sales group, so a picnic reconciles by type:
   Clothing & Apparel / Raffle / Bocce Entry (plus Other for anything else).
   Set it per item in Admin → Items (or tag them all at once with the
   "Sales groups" button). A sale line resolves its group through its item,
   so re-tagging an item fixes its whole sales history too — that's how last
   year's and yesterday's sales get split without re-entering anything.     */
const SALE_GROUPS=['Clothing','Raffle','Bocce','Other'];
const GRP_LABEL={Clothing:'👕 Clothing & Apparel', Raffle:'🎟 Raffle',
                 Bocce:'🎳 Bocce Entry', Other:'📦 Other'};
function guessGroup(name,cat){
  const n=((name||'')+' '+(cat||'')).toLowerCase();
  if(/raffle|50\/50|draw ticket/.test(n)) return 'Raffle';
  if(/bocce|bocci|tournament/.test(n))    return 'Bocce';
  return 'Clothing';
}
function groupOf(it){
  if(!it) return 'Other';
  return SALE_GROUPS.includes(it.grp) ? it.grp : guessGroup(it.name,it.cat);
}
function lineGroup(l){                      // group of one line on a sale
  const it=(S.items||{})[l.itemId];
  if(it) return groupOf(it);                // live — re-tagging fixes history
  if(SALE_GROUPS.includes(l.grp)) return l.grp;   // item since deleted
  return guessGroup(l.item,'');
}
function saleUnits(s){ return (s.lines||[]).reduce((n,l)=>n+l.qty,0); }
// Roll a list of sales up into
// {group:{n,units,rev,items:{'Item — Size':{qty,rev}}, sellers:{name:{n,units,rev}}}}
function groupRollup(sales){
  const g={};
  const row=k=>g[k]=g[k]||{n:0,units:0,rev:0,items:{},sellers:{}};
  sales.forEach(s=>{
    const seen={};
    (s.lines||[]).forEach(l=>{
      const k=lineGroup(l), e=row(k), r=l.price*l.qty;
      e.units+=l.qty; e.rev+=r;
      if(!seen[k]){ seen[k]=1; e.n++; }
      const ik=l.item+' — '+l.size;
      e.items[ik]=e.items[ik]||{qty:0,rev:0};
      e.items[ik].qty+=l.qty; e.items[ik].rev+=r;
      const sn=s.sellerName||'—';
      const se=e.sellers[sn]=e.sellers[sn]||{n:0,units:0,rev:0};
      if(seen[k]===1){ seen[k]=2; se.n++; }
      se.units+=l.qty; se.rev+=r;
    });
  });
  return g;
}
/* ------------------------ MEMBER TABS (PAY LATER) -------------------------
   A "tab" is everything one person took on pay-later plus everything they've
   since paid off. Both the admin (Money screen) and the member themselves

function tabDetail(name){
  name=name||'';

    .sort((a,b)=>b[1].ts-a[1].ts);
  const charged=buys.reduce((a,[,s])=>a+s.total,0);
  const paid=pays.reduce((a,[,p])=>a+p.amount,0);
  return {name, buys, pays, charged, paid, owes:Math.round((charged-paid)*100)/100};
}

// ── One-shot data top-ups ────────────────────────────────────────────────────
// FIN_SEED only ever runs on a brand-new club, so a new category added there
// would never reach a club that is already running. These run once, on an admin
// screen (a member's phone has no write permission for settings), and set a flag
// so they never run again. _migRan stops it firing on every 3-second poll.
let _migRan=false;
function runMigrations(){
  if(_migRan || !_ready || !me) return;
  _migRan=true;
  const F=S.finance;
  if(!F || !F.cats || !isAdmin()) return;
  // v3.24 — "Annual Picnic - Supplies" for the things you buy for the picnic that
  // are not park fees, entertainment or prizes: cups, plates, tablecloths.
  if(!F.catsV324){
    const want='Annual Picnic - Supplies';
    const cur=(F.cats.expense||[]).slice();
    const at=cur.indexOf('Annual Picnic - Prizes');       // sit it with the other picnic lines
    const next=cur.slice(); next.splice(at>=0?at+1:next.length,0,want);
    Promise.resolve()
      .then(()=>cur.includes(want)?null:DB.set(['finance','cats','expense'],next))
      .then(()=>DB.set(['finance','catsV324'],true))
      .catch(()=>{ _migRan=false; });   // no write permission or offline — try again later
  }
}

  const _fsnap=picFocusSnap();   // taken before anything is torn down

// Backspace to erase, Esc/C to clear. Typing in the Name box is unaffected.
document.addEventListener('keydown', e=>{
  if(!$('login').classList.contains('active')) return;
  if(document.activeElement===$('loginName')){
    if(e.key==='Enter'){ e.preventDefault(); $('loginName').blur(); }
    return;
  }
  if(/^[0-9]$/.test(e.key)){ pinKey(e.key); e.preventDefault(); }
  else if(e.key==='Backspace'){ pinKey('⌫'); e.preventDefault(); }
  else if(e.key==='Escape'||e.key.toLowerCase()==='c'){ pinKey('C'); }
});

function renderNav(){
  const tabs=[['sell','🛒','Sell'],['stock','📦','Stock'],['saleslog','🧾','Sales']];
  // "My $" is for anyone who keeps a share OR has ever bought on a tab —
  // a member who owes the club needs somewhere to see what for.
  if((meU().profitPct||0)>0 || tabDetail(meU().name).charged>0.005) tabs.push(['mymoney','💰','My $']);
  // An admin is a member of the club as well: their own attendance and their own
  // sponsor are theirs to see, the same as everybody else's.
  if(clubRecOn()||picOn()) tabs.push(['myclub','🎟','Club']);
  if(isAdmin()) tabs.push(['admin','⚙️','Admin']);
  $('nav').innerHTML=tabs.map(([v,ic,l])=>
    `<button class="${view===v?'on':''}" onclick="go('${v}')"><span class="ic">${ic}</span>${l}</button>`).join('');
}
function go(v){ view=v; window.scrollTo(0,0); rerender(); }

function renderSell(){
  const cats=['All',...new Set(displayItemsSorted().map(([,i])=>i.cat||'Other'))];
  if(!cats.includes(selCat)) selCat='All';
  $('catBar').innerHTML=cats.map(c=>
    `<button class="${selCat===c?'on':''}" onclick="selCat='${esc(c)}';rerender()">${esc(c)}</button>`).join('');
  // Items with stock appear on the sale list; ad-hoc items (raffle tickets…) are always available.
  const list=displayItemsSorted().filter(([,i])=>(selCat==='All'||i.cat===selCat) && (i.adhoc || totalStock(i)>0));
  $('itemList').innerHTML=list.map(([id,it])=>{
    const sizes=Object.keys(it.sizes||{}).sort(sizeSort);
    const total=sizes.reduce((n,s)=>n+(it.sizes[s].stock||0),0);
    const prices=[...new Set(sizes.map(s=>salePriceOf(it,it.sizes[s])))];
    const pTxt=prices.length===1?fmt(prices[0]):fmt(Math.min(...prices))+'–'+fmt(Math.max(...prices));
    const open=openItem===id;
    const saleTag=it.salePct?`<span class="saleflag">${it.salePct}% OFF</span>`:'';
    return `<div class="itemcard">
      <div class="top" onclick="openItem=${open?'null':`'${id}'`};rerender()">
        <div><div class="nm">${colorDot(it)}${esc(it.name)}${saleTag}</div>
        <div class="meta">${esc(it.cat||'')} · ${it.adhoc?'always available':total+' in stock'}</div></div>
        <div class="price">${pTxt}</div>
      </div>
      ${open?`<div class="sizerow">${sizes.map(s=>{
          const z=it.sizes[s]; const st=z.stock||0;
          const sp=salePriceOf(it,z);
          const pLbl=it.salePct?`<s>${fmt(z.price)}</s> ${fmt(sp)}`:fmt(sp);
          if(it.adhoc) return `<button class="sizebtn" onclick="addToCart('${id}','${esc(s)}')">${esc(s)}<small>${pLbl}</small></button>`;
          return `<button class="sizebtn ${st===0?'out':st<=(z.reorder??2)?'low':''}" ${st===0?'disabled':''}
            onclick="addToCart('${id}','${esc(s)}')">${esc(s)}<small>${st===0?'sold out':st+' left · '+pLbl}</small></button>`;
        }).join('')}</div>`:''}
    </div>`;
  }).join('') || '<div class="empty">Nothing in stock in this category.</div>';
}
function addToCart(itemId,size){
  const it=S.items[itemId], z=it.sizes[size];
  if(!it.adhoc){
    const inCart=cart.filter(l=>l.itemId===itemId&&l.size===size).reduce((n,l)=>n+l.qty,0);
    if(inCart+1 > (z.stock||0)){ toast('Only '+(z.stock||0)+' left in stock',1); return; }
  }
  const ex=cart.find(l=>l.itemId===itemId&&l.size===size&&!l.member);
  if(ex) ex.qty++;
  else cart.push({itemId, item:it.name, size, qty:1, price:salePriceOf(it,z), regular:z.price,
    salePct:it.salePct||0, cost:z.cost, member:false, adhoc:!!it.adhoc});
  toast(it.name+' '+size+' added');
  renderCartBar();
}
// Effective prices with the volume discount spread across lines in proportion
// to their value — so per-item profit stays correct.
function discountedLines(){
  const base=cart.map(l=>{
    const unit=l.member?l.cost:l.price;
    return {l, unit, tot:unit*l.qty, newTot:unit*l.qty};
  });
  const subtotal=Math.round(base.reduce((a,x)=>a+x.tot,0)*100)/100;
  let discAmt=0;
  // A complimentary zeroes the whole sale outright. It is NOT run through the
  // discount maths — it is its own flag, so the report can tell the two apart.
  if(cartComp){
    base.forEach(x=>{ x.newTot=0; x.unit=0; });
    return {base, subtotal, discAmt:0, total:0, comp:true};
  }
  if(cartDisc && subtotal>0){
    discAmt = cartDisc.type==='pct'
      ? subtotal*Math.min(100,cartDisc.value)/100
      : Math.min(cartDisc.value, subtotal);
    discAmt=Math.round(discAmt*100)/100;
    let remaining=Math.round(discAmt*100);
    base.forEach((x,i)=>{
      const share = i===base.length-1 ? remaining
        : Math.round(discAmt*100 * x.tot/subtotal);
      remaining-=share;
      x.newTot=(Math.round(x.tot*100)-share)/100;
      x.unit=Math.round(x.newTot/x.l.qty*10000)/10000;
    });
  }
  const total=Math.round(base.reduce((a,x)=>a+x.newTot,0)*100)/100;
  return {base, subtotal, discAmt, total};
}
function renderCartBar(){
  const n=cart.reduce((a,l)=>a+l.qty,0);
  $('cartbar').style.display = n&&me ? 'flex':'none';
  $('cartN').textContent=n;
  $('cartT').textContent=fmt(n?discountedLines().total:0);
}

    ${cartDisc&&!cartComp?`<div class="cartline">
      <div class="d"><div class="nm">Volume discount — ${cartDisc.type==='pct'?cartDisc.value+'%':fmt(cartDisc.value)+' off'}</div>
        <div class="sub"><a href="#" style="color:var(--red)" onclick="cartDisc=null;openCart();renderCartBar();return false">remove discount</a></div></div>
      <div class="neg"><b>−${fmt(discAmt)}</b></div></div>
      <div class="cart-total" style="font-size:15px;color:var(--muted)"><span>Subtotal</span><span>${fmt(subtotal)}</span></div>`:''}

    ${cartComp?'':`<button class="btn gray" style="margin-bottom:10px" onclick="discountModal()">％ Volume discount ${cartDisc?'(change)':''}</button>`}
    ${cartComp?'':`<button class="btn gray" style="margin-bottom:10px" onclick="compModal()">🎁 Complimentary — give this away</button>`}
    ${cartComp?`<p class="muted" style="margin:0 0 10px">There is no payment to take, so there is nothing to
      choose here. Nobody's tab is touched.</p>`:`<label>Payment</label>
    <div class="payrow">
      ${PAY_METHODS.map(p=>`<button class="${payMethod===p?'on':''}" onclick="payMethod='${p}';openCart()">${p}</button>`).join('')}
    </div>
    ${payMethod==='Interac'?`<p class="muted" style="margin:6px 0 0">Tapped or e-transferred straight to the club — you are not
      holding this money, so it never shows up as cash for you to hand in. Your profit share on it is paid back to you.</p>`:''}`}
    ${(()=>{
      // v3.18 — attribution on every payment type. Pay Later is a debt ("who owes this"),
      // Cash / Interac is simply a record of who took it ("which member is purchasing this"),
      // because otherwise a cash member-price sale leaves no trace of who it went to.
      const memLine = cart.some(l=>l.member);
      const lab = cartComp
        ? 'Who is this going to? (optional — leave blank if it went to the public)'
        : payMethod==='Pay Later'
        ? 'Who owes this? (tracked on their tab until they pay)'

      return `<label>${lab}</label>

        ${Object.values(S.users||{}).filter(u=>u.active!==false).map(u=>
          `<option ${cartBuyer===u.name?'selected':''}>${esc(u.name)}</option>`).join('')}
      </select><div style="height:10px"></div>`;
    })()}
    <button class="btn" onclick="checkout()">${cartComp?'🎁 Complete — Complimentary, collect nothing':'✓ Complete Sale — '+fmt(total)}</button>
    <div class="rowbtns"><button class="btn gray" onclick="closeModal()">Keep Selling</button>
    <button class="btn red" onclick="cart=[];cartDisc=null;cartComp=null;cartBuyer='';memberUnlocked=false;closeModal();renderCartBar()">Cancel Sale</button></div>`);
}
/* v3.21 — the complimentary gate.
   Same shape as the member-price unlock: it says the number out loud, takes YOUR
   OWN PIN, and puts your name on it. Anybody can authorise one — the point is not
   to stop it happening, it is that the club knows it happened and who did it. */

function compGo(){

  const full=dmFull();

  cartDisc=null;                      // a complimentary replaces any discount on the sale
  toast('Complimentary — '+fmt(full)+' given away by '+meU().name);
  openCart(); renderCartBar();
}

  _dmType=cartDisc?cartDisc.type:'pct';
  openModal(`<h3><button class="x" onclick="openCart()">✕</button>％ Volume Discount</h3>
    <p class="muted">Applies to the whole sale, spread across every item so profit tracking stays accurate. Enter YOUR PIN to authorize it — the discount is recorded under your name.</p>

/* v3.18 — say the numbers out loud before the PIN goes in.
   "You're discounting it to this much — are you sure?" in figures, live as you type. */
function dmFull(){
  return Math.round(cart.reduce((a,l)=>a+(l.member?(l.cost||0):(l.price||0))*l.qty,0)*100)/100;
}
function dmCalc(v){
  const full=dmFull();
  if(!(v>0)||full<=0) return {full, off:0, now:full, pct:0};
  let off = _dmType==='pct' ? full*Math.min(100,v)/100 : Math.min(v, full);
  off=Math.round(off*100)/100;
  const now=Math.round((full-off)*100)/100;
  return {full, off, now, pct: full? Math.round(off/full*1000)/10 : 0};
}
function dmPrev(){
  const box=$('dm_prev'); if(!box) return;
  const raw=$('dm_val'); const v=parseFloat(String(raw?raw.value:'').replace(/[^0-9.]/g,''))||0;
  const c=dmCalc(v);
  if(!(v>0)){
    box.innerHTML=`<div class="muted">Total right now <b>${fmt(c.full)}</b> — type a discount to see what it becomes.</div>`;
    box.style.display='block'; return;
  }
  const bad = _dmType==='pct' && v>100;
  // 100% off is not a discount, it is a give-away. Send it to the right door.
  const wholeSale = (_dmType==='pct' && v===100) || (_dmType==='amt' && c.full>0 && c.off>=c.full);
  box.innerHTML = bad
    ? `<div class="neg"><b>Percent can't be over 100.</b></div>`
    : wholeSale
    ? `<div><b class="goldtxt">That takes the whole sale to ${fmt(0)}.</b>
         <p class="muted" style="margin:6px 0 0">That is a <b>complimentary</b>, not a discount — the club tracks
           give-aways separately so it can see what it hands out. Go back and use the
           <b>🎁 Complimentary</b> button on the sale instead.</p></div>`
    : `<div style="display:flex;justify-content:space-between;font-size:16px">
         <span class="muted">Total was</span><b style="text-decoration:line-through">${fmt(c.full)}</b></div>
       <div style="display:flex;justify-content:space-between;font-size:16px">
         <span class="neg">Discount</span><b class="neg">−${fmt(c.off)}</b></div>
       <div style="display:flex;justify-content:space-between;font-size:22px;font-weight:800;
            border-top:1px solid var(--line);margin-top:6px;padding-top:6px">
         <span>You will collect</span><span class="goldtxt">${fmt(c.now)}</span></div>
       <div class="muted" style="margin-top:6px">That's <b>${c.pct}% off</b> — enter your PIN below to confirm you meant it.</div>`;
  box.style.display='block';
}
function applyDiscount(){
  const pin=$('dm_pin').value;
  if(pin!==meU().pin){ toast('That\'s not your PIN — discount not applied',1); $('dm_pin').value=''; return; }
  // forgiving parse: accepts "5", "5.50", "$5", "10%"…
  const v=parseFloat(String($('dm_val').value).replace(/[^0-9.]/g,''))||0;
  if(v<=0){ toast('Enter the discount amount',1); return; }
  if(_dmType==='pct' && v>100){ toast('Percent can\'t be over 100',1); return; }
  const c=dmCalc(v);
  // v3.21 — taking the sale to zero by hand used to be how give-aways were done.
  // It is a complimentary: send it down that road so it gets flagged and counted.
  if((_dmType==='pct' && v===100) || (c.full>0 && c.off>=c.full)){
    toast('That is a complimentary — confirming it there instead',0);
    compModal(); return;
  }
  cartDisc={type:_dmType, value:Math.round(v*100)/100, by:meU().name};
  toast('Discount applied — '+fmt(c.full)+' → '+fmt(c.now));
  openCart(); renderCartBar();
}
/* v3.18 — member pricing is PIN-gated.
   Unlocking a member price on a sale now costs whoever is ringing it in their own PIN,
   so it can't be tapped by accident and the club knows who authorised it. The PIN is
   asked once per sale — after that you can flip lines freely — and going BACK to the
   regular price never asks, because that direction can't cost the club anything. */
let memberUnlocked=false;
function toggleMember(i){
  if(cart[i].member){ cart[i].member=false; openCart(); renderCartBar(); return; }   // reverting — no PIN
  if(memberUnlocked){ cart[i].member=true; openCart(); renderCartBar(); return; }
  memberPinModal(i);
}
let _mpIdx=null;
function memberPinModal(i){
  _mpIdx=i;
  const l=cart[i];
  const save=Math.round(((l.price||0)-(l.cost||0))*l.qty*100)/100;
  openModal(`<h3><button class="x" onclick="openCart()">✕</button>🔒 Unlock Member Pricing</h3>
    <p class="muted">Member price is the club's <b>cost</b> — the club makes nothing on it. Enter YOUR PIN to
      authorise it. You only have to do this once per sale.</p>
    <div class="card" style="margin:0 0 12px">
      <div style="font-weight:800">${esc(l.item)} — ${esc(l.size)} ×${l.qty}</div>
      <div style="display:flex;justify-content:space-between;margin-top:6px">

      <div style="display:flex;justify-content:space-between">

        <span class="muted">Club gives up</span><b class="neg">${fmt(save)}</b></div>
    </div>
    <label>Your 4-digit PIN</label>
    <input id="mp_pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off"
      style="font-size:26px;text-align:center;letter-spacing:10px"
      onkeydown="if(event.key==='Enter')memberPinGo()">
    <div style="height:12px"></div>
    <button class="btn" onclick="memberPinGo()">🔓 Unlock member price</button>
    <div style="height:8px"></div>
    <button class="btn gray" onclick="openCart()">Cancel — keep regular price</button>`);
  setTimeout(()=>{ const el=$('mp_pin'); if(el) el.focus(); },100);
}
function memberPinGo(){
  const el=$('mp_pin'); if(!el) return;
  if(el.value!==meU().pin){ toast('That\'s not your PIN — member price not applied',1); el.value=''; return; }
  memberUnlocked=true;
  if(_mpIdx!=null && cart[_mpIdx]) cart[_mpIdx].member=true;
  _mpIdx=null;
  toast('Member price unlocked for this sale');
  openCart(); renderCartBar();
}
function qty(i,d){
  const l=cart[i];
  if(d>0 && !l.adhoc){
    const z=S.items[l.itemId].sizes[l.size];
    const inCart=cart.filter(x=>x.itemId===l.itemId&&x.size===l.size).reduce((n,x)=>n+x.qty,0);
    if(inCart+1>(z.stock||0)){ toast('No more stock',1); return; }
  }
  l.qty+=d; if(l.qty<=0) cart.splice(i,1);
  if(!cart.length){ closeModal(); } else openCart();
  renderCartBar();
}
let _busy=false;
async function checkout(){
  if(_busy||!cart.length) return;
  // v3.21 — a complimentary collects nothing, so there is no debt and no member
  // price to attribute. It is always recorded as Cash of $0.00.
  if(cartComp) payMethod='Cash';
  if(!cartComp){
    if(payMethod==='Pay Later' && !cartBuyer){ toast('Pick which member owes this',1); return; }
    // v3.18 — a member price has to be attributed to a member, whatever the payment type
    if(payMethod!=='Pay Later' && cart.some(l=>l.member) && !cartBuyer){
      toast('This is a member price — pick which member is purchasing it',1); return; }
  }
  _busy=true;
  const done=[];
  try{
    for(const l of cart){
      if(l.adhoc) continue;   // ad-hoc items don't touch stock
      const ok=await DB.txnStock(l.itemId,l.size,-l.qty);
      if(!ok){ for(const d of done) await DB.txnStock(d.itemId,d.size,d.qty);
        toast('Not enough stock for '+l.item+' '+l.size+' — sale cancelled',1); _busy=false; return; }
      done.push(l);
    }
    const u=meU();
    const {base, subtotal, discAmt, total}=discountedLines();
    const sale={ts:Date.now(), sellerId:me, sellerName:u.name, sellerPct:u.profitPct||0,
      payment:payMethod, buyer:cartBuyer||null,
      voided:false, eventName:(S.settings&&S.settings.eventName)||'',
      // v3.21 — a complimentary is its own record: who gave it away, when, and what
      // it was worth at the price the club would have charged.
      comp: cartComp? {by:cartComp.by||u.name, ts:Date.now(), value:subtotal} : null,
      discount: (cartDisc&&!cartComp)? {type:cartDisc.type, value:cartDisc.value, amount:discAmt, by:cartDisc.by||u.name} : null,
      lines:base.map(x=>({itemId:x.l.itemId,item:x.l.item,size:x.l.size,qty:x.l.qty,
        price:x.unit, orig:(x.unit!==(x.l.regular??x.l.price))?(x.l.regular??x.l.price):null,
        salePct:x.l.salePct||0, grp:groupOf(S.items[x.l.itemId]),
        cost:x.l.cost, member:!!x.l.member, adhoc:!!x.l.adhoc})),
      total};
    await DB.push(['sales'], sale);
    const msg = sale.comp
      ? 'Complimentary recorded — '+fmt(sale.comp.value)+' given away'+(sale.buyer?' to '+sale.buyer:'')
      : sale.payment==='Pay Later'
      ? 'Sale recorded — '+fmt(sale.total)+' on '+sale.buyer+"'s tab"
      : 'Sale recorded — '+fmt(sale.total)+' '+sale.payment+(sale.buyer?' — '+sale.buyer:'');
    cart=[]; cartBuyer=''; cartDisc=null; cartComp=null; payMethod='Cash'; memberUnlocked=false; closeModal(); renderCartBar();
    toast(msg);
  }finally{ _busy=false; }
}

/* ------------------------------- STOCK ----------------------------------- */
function renderStock(){
  const q=($('stockSearch').value||'').toLowerCase();
  let items=displayItemsSorted().filter(([,i])=>!i.adhoc && i.name.toLowerCase().includes(q));
  const toggle=`<div class="payrow noprint" style="margin-bottom:10px">
    <button class="${stockView==='grid'?'on':''}" onclick="stockView='grid';rerender()">▦ Everything in one grid</button>
    <button class="${stockView==='cards'?'on':''}" onclick="stockView='cards';rerender()">☰ By item</button></div>`;
  if(stockView==='grid'){
    // one-page matrix: every item down the side, every size across the top
    const cols=[...new Set(items.flatMap(([,it])=>Object.keys(it.sizes||{})))].sort(sizeSort);
    if(stockSortSize && !cols.includes(stockSortSize)) stockSortSize=null;
    if(stockSortSize) items=[...items].sort((a,b)=>
      (((b[1].sizes||{})[stockSortSize]||{}).stock||0)-(((a[1].sizes||{})[stockSortSize]||{}).stock||0));
    const grand=items.reduce((n,[,it])=>n+totalStock(it),0);
    $('stockList').innerHTML= toggle + printHead('Stock Count','All items and sizes — '+grand+' pieces total') +
      `<p class="muted noprint">Looking for a size? Tap a size column heading (e.g. <b>M</b>) to sort by what's available in that size — tap it again to undo. Gold numbers are running low, — means sold out.</p>
      <div class="gridwrap"><table class="stockgrid">
        <tr><th class="itc">Item</th>${cols.map(s=>
          `<th class="sz ${stockSortSize===s?'on':''}" onclick="stockSortSize=${stockSortSize===s?'null':`'${esc(s)}'`};rerender()">${esc(s)}${stockSortSize===s?' ▼':''}</th>`).join('')}
          <th class="r">Total</th></tr>
        ${items.map(([id,it])=>`<tr><td class="itc">${colorDot(it)}${esc(it.name)}</td>${cols.map(s=>{
            const z=(it.sizes||{})[s];
            if(!z) return '<td class="c dim">·</td>';
            const st=z.stock||0;
            return `<td class="c ${st===0?'dim':st<=(z.reorder??2)?'lowc':''}">${st===0?'—':st}</td>`;
          }).join('')}<td class="r"><b>${totalStock(it)}</b></td></tr>`).join('')
          || `<tr><td colspan="${cols.length+2}" class="empty">Nothing matches.</td></tr>`}
        ${items.length?`<tr class="totrow"><td class="itc">TOTAL</td>${cols.map(s=>
          `<td class="c">${items.reduce((n,[,it])=>n+((((it.sizes||{})[s])||{}).stock||0),0)}</td>`).join('')}
          <td class="r">${grand}</td></tr>`:''}
      </table></div>
      <div class="rowbtns noprint" style="margin-top:10px">
        <button class="btn gray" onclick="window.print()">🖨 Print this view</button>
        <button class="btn" onclick="printStockSheet()">🖨 Stock sheet — one landscape page (PDF)</button>
      </div>`;
    return;
  }
  const grandC=items.reduce((n,[,it])=>n+totalStock(it),0);
  const rows=items.map(([id,it])=>{
    const sizes=Object.keys(it.sizes||{}).sort(sizeSort);
    const tot=sizes.reduce((n,s)=>n+(it.sizes[s].stock||0),0);
    return `<div class="card"><b>${colorDot(it)}${esc(it.name)}</b>
      <span class="muted" style="float:right">${tot} total</span>
      <div class="sizerow" style="margin-top:8px">${sizes.map(s=>{
        const z=it.sizes[s]; const st=z.stock||0;
        return `<span class="sizebtn ${st===0?'out':st<=(z.reorder??2)?'low':''}" style="cursor:default">${esc(s)}<small>${st}</small></span>`;}).join('')}
      </div></div>`;
  }).join('');
  $('stockList').innerHTML=toggle+(rows? rows+`<div class="card"><b>TOTAL — ${grandC} pieces</b></div>` :'<div class="empty">Nothing matches.</div>');
}

/* ----------------------------- SALES LOG ---------------------------------- */
function salesSorted(){ return Object.entries(S.sales||{}).sort((a,b)=>b[1].ts-a[1].ts); }
/* The Sales screen. Anyone can look at today. Admins and point-of-sale users
   get any date range they like, totals split by sales group (clothing /
   raffle / bocce entry) and a full itemized listing underneath each one.  */
let slPreset='today', slFrom=null, slTo=null, slGroup='', slWho='all', slOpen={};
let slView='cards';        // cards = receipts · list = spreadsheet · grid = item × size
let slSort='time';         // list view sort key
function slRange(){
  const now=new Date();
  if(!canReport()) return [today0(), today0()+86400000-1];
  if(slPreset==='custom') return [slFrom??today0(), slTo??(today0()+86400000-1)];
  if(slPreset==='today')  return [today0(), today0()+86400000-1];
  if(slPreset==='yday')   return [today0()-86400000, today0()-1];
  if(slPreset==='week'){ const d=new Date(); const dow=(d.getDay()+6)%7;   // Monday start
    d.setHours(0,0,0,0); d.setDate(d.getDate()-dow); return [d.getTime(), Date.now()]; }
  if(slPreset==='month') return [new Date(now.getFullYear(),now.getMonth(),1).getTime(), Date.now()];
  if(slPreset==='year')  return [new Date(now.getFullYear(),0,1).getTime(), Date.now()];
  return [0, Date.now()];   // all time
}
function slLabel(from,to){
  const d1=dstr(from), d2=dstr(to);
  return d1===d2 ? new Date(from).toLocaleDateString('en-CA',{weekday:'long',year:'numeric',month:'long',day:'numeric'})
                 : d1+' to '+d2;
}
function renderSales(){
  const [from,to]=slRange(), full=canReport();
  let list=salesSorted().filter(([,s])=>s.ts>=from&&s.ts<=to);
  if(slWho==='mine') list=list.filter(([,s])=>s.sellerId===me);
  else if(slWho!=='all') list=list.filter(([,s])=>s.sellerName===slWho);
  const live=list.filter(([,s])=>!s.voided).map(([,s])=>s);
  // group filter applies to the sale list only — the totals always show every group
  const shown = slGroup ? list.filter(([,s])=>(s.lines||[]).some(l=>lineGroup(l)===slGroup)) : list;
  const tot=live.reduce((a,s)=>a+s.total,0);
  const units=live.reduce((a,s)=>a+saleUnits(s),0);

  const presets=[['today','Today'],['yday','Yesterday'],['week','This week'],

    </div>
    <div class="rowbtns noprint" style="margin:0 0 8px">

        ${isAdmin()?sellerNames.map(n=>`<option value="${esc(n)}" ${slWho===n?'selected':''}>👤 ${esc(n)}</option>`).join(''):''}

  const groupCards = SALE_GROUPS.filter(g=>roll[g]).map(g=>{
    const e=roll[g], open=!!slOpen[g];

      </div>
      ${(open||_printing)?`<table style="margin-top:8px">
        <tr><th>What sold</th><th class="r">Qty</th><th class="r">Revenue</th></tr>
        ${items.map(([k,v])=>`<tr><td>${esc(k)}</td><td class="r"><b>${v.qty}</b></td><td class="r">${fmt(v.rev)}</td></tr>`).join('')}
        <tr class="totrow"><td><b>Total ${esc(GRP_LABEL[g].replace(/^\S+\s/,''))}</b></td>
          <td class="r"><b>${e.units}</b></td><td class="r"><b>${fmt(e.rev)}</b></td></tr>
      </table>
      <table style="margin-top:10px">
        <tr><th>Who sold it</th><th class="r">Sales</th><th class="r">Qty</th><th class="r">Revenue</th></tr>

      </table>
      ${full?`<div class="rowbtns noprint" style="margin-top:10px">

          ▸ Every ${esc(GRP_LABEL[g].replace(/^\S+\s/,''))} sale, line by line</button></div>`:''}`:''}
    </div>`;
  }).join('');

  // ---- the spreadsheet view: one row per line sold --------------------------
  const rows=saleLines(shown).map(r=>({...r, lineOK: !slGroup || r.grp===slGroup}))
    .filter(r=>r.lineOK);
  const SORTS={time:(a,b)=>b.ts-a.ts, item:(a,b)=>a.item.localeCompare(b.item)||sizeSort(a.size,b.size),
    seller:(a,b)=>a.seller.localeCompare(b.seller)||b.ts-a.ts,
    grp:(a,b)=>SALE_GROUPS.indexOf(a.grp)-SALE_GROUPS.indexOf(b.grp)||a.item.localeCompare(b.item),
    qty:(a,b)=>b.qty-a.qty, total:(a,b)=>b.total-a.total};
  rows.sort(SORTS[slSort]||SORTS.time);
  const liveRows=rows.filter(r=>!r.voided);
  const multiDay=dstr(from)!==dstr(to);
  const listHTML = !rows.length ? '<div class="empty">Nothing sold in this period. 🤞</div>' : `
    <div class="rowbtns noprint" style="margin:0 0 8px"><select id="slSortSel" onchange="slSort=this.value;rerender()">

         ['grp','🧾 By type of sale'],['qty','🔢 Biggest quantity first'],['total','💵 Biggest amount first']]

      ${rows.map(r=>`<tr${r.voided?' style="opacity:.45;text-decoration:line-through"':''}>
        <td>${multiDay?new Date(r.ts).toLocaleDateString('en-CA'):new Date(r.ts).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</td>
        ${multiDay?`<td>${new Date(r.ts).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</td>`:''}
        <td>${esc(r.seller)}</td><td>${esc(GRP_LABEL[r.grp].replace(/^\S+\s/,''))}</td>
        <td>${esc(r.item)}${r.member?' <span class="muted">(member)</span>':''}</td><td>${esc(r.size)}</td>
        <td class="r"><b>${r.qty}</b></td><td class="r">${fmt(r.price)}</td><td class="r"><b>${fmt(r.total)}</b></td>
        ${isAdmin()?`<td class="r goldtxt">${fmt(r.profit)}</td>`:''}
        <td>${esc(r.payment)}${r.buyer?' — '+esc(r.buyer):''}</td>
        <td>${r.movedFrom?`<span class="muted">📅 back-dated</span> `:''}${r.note?esc(r.note):''}</td></tr>`).join('')}
      <tr class="totrow"><td colspan="${(multiDay?2:1)+4}"><b>${liveRows.length} line${liveRows.length===1?'':'s'}</b></td>
        <td class="r"><b>${liveRows.reduce((a,r)=>a+r.qty,0)}</b></td><td></td>
        <td class="r"><b>${fmt(liveRows.reduce((a,r)=>a+r.total,0))}</b></td>
        ${isAdmin()?`<td class="r"><b>${fmt(liveRows.reduce((a,r)=>a+r.profit,0))}</b></td>`:''}<td></td><td></td></tr>
    </table></div>
    <p class="muted noprint">Scroll the table sideways to see every column. Voided lines are struck through and
      left out of the totals.</p>`;

  // ---- the grid view: item × size, sold vs still in stock -------------------
  const gridHTML = (()=>{
    const byItem={};
    liveRows.forEach(r=>{

    const names=Object.keys(byItem).sort((a,b)=>byItem[b].qty-byItem[a].qty||a.localeCompare(b));
    if(!names.length) return '<div class="empty">Nothing sold in this period. 🤞</div>';
    const cols=[...new Set(names.flatMap(n=>Object.keys(byItem[n].sizes)))].sort(sizeSort);
    const stockOf=(name,size)=>{
      const it=Object.values(S.items||{}).find(i=>i.name===name);
      if(!it) return null;

      <button class="btn gray" onclick="window.print()">🖨 Print / Save as PDF</button>
      ${full?`<button class="btn gray" onclick="exportShownSalesCSV()">⬇ Export to Excel</button>`:''}
    </div>
    <div class="statgrid">
      <div class="stat green"><div class="v">${fmt(tot)}</div><div class="l">${full?esc(slLabel(from,to)):'Today'} — ${live.length} sale${live.length===1?'':'s'}</div></div>
      <div class="stat gold"><div class="v">${units}</div><div class="l">Items sold</div></div>
      ${slWho==='all'?`<div class="stat"><div class="v">${fmt(mine)}</div><div class="l">Your own sales — ${esc(meU().name)}</div></div>`:''}
    </div>
    <h2>By type of sale</h2>
    <p class="muted noprint" style="margin:0 0 8px">Tap a type to see exactly which items and sizes were sold. Set what belongs where in ${isAdmin()?'Admin → Items → 🏷 Sales groups':'Admin → Items'}.</p>
    ${groupCards||'<div class="empty">Nothing sold in this period.</div>'}
    <h2 id="slEverything">Everything sold${slGroup?' — '+esc(GRP_LABEL[slGroup]):''}</h2>
    ${full?`<div class="rowbtns noprint" style="margin:0 0 8px">
      <select onchange="slGroup=this.value;rerender()">
        <option value="">🧾 All types of sale</option>
        ${SALE_GROUPS.map(g=>`<option value="${g}" ${slGroup===g?'selected':''}>${GRP_LABEL[g]}</option>`).join('')}
      </select></div>`:''}
    <div class="payrow noprint" style="margin:0 0 10px">
      ${[['cards','🧾 Receipts'],['list','📋 List'],['grid','▦ Grid']].map(([v,l])=>
        `<button class="${slView===v?'on':''}" onclick="slView='${v}';rerender()">${l}</button>`).join('')}
    </div>
    <p class="muted noprint" style="margin:0 0 10px">${
      slView==='cards'?'One card per sale, the way it was rung up.':
      slView==='list'?'One row per line sold — item, size, quantity and who sold it. Sorts any way you like.':
      'Every item across, every size down — how many sold and how many are still on the shelf.'}</p>`+
    (slView==='list'?listHTML: slView==='grid'?gridHTML:
     shown.map(([id,s])=>{
      const lines = slGroup ? s.lines.filter(l=>lineGroup(l)===slGroup) : s.lines;
      const sub = slGroup ? lines.reduce((a,l)=>a+l.price*l.qty,0) : s.total;
      return `<div class="card salecard ${s.voided?'voided':''}">
      <div class="hd"><span>${full&&dstr(from)!==dstr(to)?new Date(s.ts).toLocaleDateString('en-CA')+' ':''}${new Date(s.ts).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}
        · ${esc(s.sellerName)} ${s.voided?'<span class="voidtag">VOIDED</span>':''}${s.edited?' <span class="voidtag" style="color:var(--gold)">EDITED</span>':''}</span>
        <span>${fmt(sub)}${slGroup&&Math.abs(sub-s.total)>0.005?` <span class="muted">of ${fmt(s.total)}</span>`:''}</span></div>
      <div class="lines">${lines.map(l=>`${l.qty}× ${esc(l.item)} ${esc(l.size)}${l.member?' (member)':''}`).join(' · ')}
        · ${s.comp?'<span class="compflag">🎁 COMPLIMENTARY</span>':esc(s.payment)}${s.buyer?(s.payment==='Pay Later'&&!s.comp?` — <b>${esc(s.buyer)} owes</b>`:` — <b>${esc(s.buyer)}</b>`):''}${s.comp?` · <b class="neg">${fmt(compValueOf(s))} given away</b> <span class="muted">(by ${esc(s.comp.by||s.sellerName)})</span>`:''}${s.discount&&!s.comp?` · <b class="neg">−${fmt(s.discount.amount)} discount</b> <span class="muted">(by ${esc(s.discount.by||s.sellerName)})</span>`:''}</div>
      <div class="lines muted">${[...new Set(lines.map(lineGroup))].map(g=>GRP_LABEL[g]).join(' · ')}</div>
      ${s.edited&&s.edited.movedFrom?`<div class="lines muted">📅 Back-dated from ${new Date(s.edited.movedFrom).toLocaleString('en-CA')} by ${esc(s.edited.by||'')}</div>`:''}
      ${s.note?`<div class="lines" style="color:var(--gold)">📝 ${esc(s.note)}</div>`:''}
      ${isAdmin()&&!s.voided?`<div class="rowbtns noprint">
        <button class="btn small gray" onclick="pinConfirm('Edit this sale? Quantities, prices, payment, the date it happened and a note can all be changed — stock adjusts automatically.',()=>editSale('${id}'))">✎ Edit sale</button>
        <button class="btn small red" onclick="voidSale('${id}')">Void &amp; restock</button>
        <button class="btn small red" onclick="deleteSaleAsk('${id}')">🗑 Delete</button></div>`:''}
      ${isAdmin()&&s.voided?`<div class="rowbtns noprint">
        <button class="btn small red" onclick="deleteSaleAsk('${id}')">🗑 Delete permanently</button></div>`:''}
    </div>`;}).join('')||'<div class="empty">No sales in this period. 🤞</div>');
}
// When printing we open every group so the whole breakdown lands on paper.
let _printing=false;
window.addEventListener('beforeprint',()=>{ if(view==='saleslog'){ _printing=true; renderSales(); } });

function exportShownSalesCSV(){
  const [from,to]=slRange();
  let list=salesSorted().reverse().filter(([,s])=>s.ts>=from&&s.ts<=to);
  if(slWho==='mine') list=list.filter(([,s])=>s.sellerId===me);
  else if(slWho!=='all') list=list.filter(([,s])=>s.sellerName===slWho);
  const rows=[['Date','Time','Type of sale','Seller','Item','Size','Qty','Unit Price','Line Total','Payment','Owed By','Complimentary','Given Away By','Value Given Away','Voided','Note','Back-dated From']];
  list.forEach(([,s])=>{ const d=new Date(s.ts);
    s.lines.filter(l=>!slGroup||lineGroup(l)===slGroup).forEach(l=>rows.push([
      d.toLocaleDateString('en-CA'), d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}),
      GRP_LABEL[lineGroup(l)].replace(/^\S+\s/,''), s.sellerName, l.item, l.size, l.qty, l.price,
      Math.round(l.price*l.qty*100)/100, s.payment, s.buyer||'',
      isComp(s)?'Y':'', isComp(s)?(s.comp.by||s.sellerName):'',
      isComp(s)?Math.round((l.member?(l.cost||0):lineList(l))*(l.qty||0)*100)/100:'',
      s.voided?'Y':'', s.note||'',
      (s.edited&&s.edited.movedFrom)?new Date(s.edited.movedFrom).toLocaleString('en-CA'):'']));
  });
  dl('three-aces-sales-'+dstr(from)+'-to-'+dstr(to)+'.csv', rows.map(r=>r.map(csvCell).join(',')).join('\n'));
  toast('Exported '+(rows.length-1)+' lines');
}
function voidSale(id){
  const s=(S.sales||{})[id]; if(!s) return;
  const what=(s.lines||[]).map(l=>l.qty+'× '+l.item+' '+l.size).join(', ');
  pinConfirm('Void this sale — '+fmt(s.total)+(what?' ('+what+')':'')+', rung up by '
    +(s.sellerName||'—')+' on '+new Date(s.ts).toLocaleDateString('en-CA')
    +'. The items go back into stock and the sale is crossed out everywhere, but the record stays '
    +'in the log so the books can still be audited.',
    ()=>voidSaleGo(id));
}
async function voidSaleGo(id){
  const s=(S.sales||{})[id]; if(!s || s.voided) return;
  for(const l of (s.lines||[])){ if(!l.adhoc && S.items[l.itemId]) await DB.txnStock(l.itemId,l.size,l.qty); }
  await DB.set(['sales',id,'voided'],true);
  toast('Sale voided — stock restored');
}
/* Voiding keeps the record and crosses it out, which is what an auditor wants.
   Sometimes you just want the thing gone — a test sale, a double-tap, something
   rung up on the wrong phone. That is this, and it takes a PIN because there is
   no undo: the record is removed from the database entirely. */
function deleteSaleAsk(id){
  const s=(S.sales||{})[id]; if(!s) return;
  const what=(s.lines||[]).map(l=>l.qty+'× '+l.item+' '+l.size).join(', ');
  pinConfirm('Delete this sale completely — '+fmt(s.total)+(what?' ('+what+')':'')+', rung up by '
    +(s.sellerName||'—')+' on '+new Date(s.ts).toLocaleDateString('en-CA')+'. '
    +(s.voided?'The stock went back on the shelf when it was voided, so it stays as it is. '
              :'The items go back into stock. ')
    +'Unlike voiding, nothing is left behind: it disappears from the sales log, the reports, the money '
    +'screen and the books. This cannot be undone.',
    ()=>deleteSaleGo(id));
}
async function deleteSaleGo(id){
  const s=(S.sales||{})[id]; if(!s) return;
  // A voided sale has already had its stock put back — don't credit it twice.
  if(!s.voided){
    for(const l of (s.lines||[])){ if(!l.adhoc && S.items[l.itemId]) await DB.txnStock(l.itemId,l.size,l.qty); }
  }
  await DB.set(['sales',id],null);
  toast('Sale deleted — no record kept');
}
